name: Nightly Test (HCU)

on:
  schedule:
    - cron: "30 18 * * *" # 02:30 Beijing Time daily
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref, branch, tag, or SHA to test"
        required: false
        type: string
        default: ""
      runner_label:
        description: "HCU runner label override"
        required: false
        type: string
        default: ""
      image:
        description: "HCU CI container image override"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue running remaining files after a test failure"
        required: false
        type: boolean
        default: true
      job_filter:
        description: "Run one HCU nightly module or all modules"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - nightly-hcu-core
          - nightly-hcu-core-functional
          - nightly-hcu-1
          - nightly-hcu-accuracy
          - nightly-hcu-accuracy-text
          - nightly-hcu-accuracy-reasoning-code
          - nightly-hcu-vlm
          - nightly-hcu-perf-text
          - nightly-hcu-large-model-4
          - nightly-hcu-large-model-8
          - nightly-hcu-quant-opt
          - nightly-hcu-functional-long
          - nightly-hcu-api-models
          - nightly-hcu-long-scheduler
          - nightly-hcu-long-decoding
          - nightly-hcu-2
          - nightly-hcu-4-functional

permissions:
  contents: read

concurrency:
  group: nightly-test-hcu-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate-config:
    name: Validate HCU nightly config
    runs-on: ${{ inputs.runner_label || vars.HCU_CI_RUNNER_LABEL }}
    outputs:
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      image: ${{ steps.resolve.outputs.image }}
      continue_on_error_flag: ${{ steps.resolve.outputs.continue_on_error_flag }}
      job_filter: ${{ steps.resolve.outputs.job_filter }}
      target_ref: ${{ steps.resolve.outputs.target_ref }}
    steps:
      - name: Resolve HCU runner, image, ref, and filters
        id: resolve
        env:
          INPUT_RUNNER_LABEL: ${{ inputs.runner_label || '' }}
          INPUT_IMAGE: ${{ inputs.image || '' }}
          INPUT_REF: ${{ inputs.ref || '' }}
          INPUT_JOB_FILTER: ${{ inputs.job_filter || 'all' }}
          VAR_RUNNER_LABEL: ${{ vars.HCU_CI_RUNNER_LABEL || '' }}
          VAR_IMAGE: ${{ vars.HCU_CI_IMAGE || '' }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error || '' }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          runner_label="${INPUT_RUNNER_LABEL:-${VAR_RUNNER_LABEL}}"
          if [[ "${runner_label}" == "hcu-ci-pr" ]]; then
            echo "Routing validation runner label hcu-ci-pr to hcu-ci-pr-2 for nmz4 test runner."
            runner_label="hcu-ci-pr-2"
          fi
          image="${INPUT_IMAGE:-${VAR_IMAGE}}"
          target_ref="${INPUT_REF:-${GITHUB_SHA_VALUE}}"
          continue_on_error="${CONTINUE_ON_ERROR:-true}"
          job_filter="${INPUT_JOB_FILTER:-all}"

          case "${job_filter}" in
            nightly-hcu-core)
              job_filter="nightly-hcu-core-functional"
              ;;
            nightly-hcu-accuracy)
              job_filter="nightly-hcu-accuracy-text"
              ;;
            nightly-hcu-long-scheduler|nightly-hcu-long-decoding)
              job_filter="nightly-hcu-functional-long"
              ;;
          esac

          if [[ -z "${runner_label}" ]]; then
            echo "::error::HCU runner label is required. Set vars.HCU_CI_RUNNER_LABEL or workflow input runner_label."
            exit 1
          fi

          if [[ -z "${image}" ]]; then
            echo "::error::HCU CI image is required. Set vars.HCU_CI_IMAGE or workflow input image."
            exit 1
          fi

          continue_on_error_flag=""
          if [[ "${continue_on_error}" == "true" || "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            continue_on_error_flag="--continue-on-error"
          fi

          echo "runner_label=${runner_label}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "target_ref=${target_ref}" >> "${GITHUB_OUTPUT}"
          echo "continue_on_error_flag=${continue_on_error_flag}" >> "${GITHUB_OUTPUT}"
          echo "job_filter=${job_filter}" >> "${GITHUB_OUTPUT}"

      - name: Checkout code
        env:
          CHECKOUT_REF: ${{ steps.resolve.outputs.target_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/hcu-sglang-${GITHUB_RUN_ID}-nightly-validate"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "HCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Setup HCU validation container
        env:
          HCU_CI_IMAGE: ${{ steps.resolve.outputs.image }}
          HCU_CI_CONTAINER_NAME: ci_sglang_hcu_nightly_${{ github.run_id }}_validate
          HCU_CI_SKIP_PULL: ${{ vars.HCU_CI_SKIP_PULL || '' }}
          HCU_CI_VISIBLE_DEVICES: ${{ vars.HCU_CI_VISIBLE_DEVICES || '' }}
        run: |
          GITHUB_WORKSPACE="${HCU_CI_CHECKOUT_DIR}" \
            bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_start_container.sh" \
              --image "${HCU_CI_IMAGE}" \
              --container-name "${HCU_CI_CONTAINER_NAME}"

      - name: Verify HCU registration in container
        env:
          HCU_CI_CONTAINER_NAME: ci_sglang_hcu_nightly_${{ github.run_id }}_validate
        run: |
          bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_exec.sh" \
            --container-name "${HCU_CI_CONTAINER_NAME}" \
            -w /sglang-checkout \
            -- python3 scripts/ci/hcu/verify_hcu_registration.py

      - name: Cleanup HCU validation container
        if: always()
        env:
          HCU_CI_CONTAINER_NAME: ci_sglang_hcu_nightly_${{ github.run_id }}_validate
        run: bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_cleanup_container.sh"

  probe-hcu-wheels:
    name: Probe staged HCU wheels
    needs: validate-config
    if: needs.validate-config.result == 'success'
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    outputs:
      full_sha: ${{ steps.probe.outputs.full_sha }}
      short_sha: ${{ steps.probe.outputs.short_sha }}
      wheel_available: ${{ steps.probe.outputs.wheel_available }}
      wheel_urls: ${{ steps.probe.outputs.wheel_urls }}
    env:
      CHECKOUT_REF: ${{ needs.validate-config.outputs.target_ref }}
      HCU_WHEEL_STAGING_ROOT: /ci_public/sglang-das/hcu-wheel-staging
      HCU_WHEEL_STAGING_CONTAINER_ROOT: /hcu-wheel-staging
    steps:
      - name: Checkout code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/hcu-sglang-${GITHUB_RUN_ID}-nightly-probe-wheels"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "HCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Probe local staged wheels
        id: probe
        run: |
          set -euo pipefail
          full_sha="$(git -C "${HCU_CI_CHECKOUT_DIR}" rev-parse HEAD)"
          short_sha="$(git -C "${HCU_CI_CHECKOUT_DIR}" rev-parse --short=12 HEAD)"
          export HCU_WHEEL_TARGET_SHA="${full_sha}"
          export HCU_WHEEL_TARGET_SHORT_SHA="${short_sha}"
          echo "full_sha=${full_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"

          python3 - <<'PY_PROBE' | tee /tmp/hcu_nightly_probe_wheels.out
          import os
          import pathlib
          import sys

          root = pathlib.Path(os.environ.get("HCU_WHEEL_STAGING_ROOT", "/ci_public/sglang-das/hcu-wheel-staging"))
          container_root = pathlib.Path(os.environ.get("HCU_WHEEL_STAGING_CONTAINER_ROOT", "/hcu-wheel-staging"))
          target_sha = os.environ["HCU_WHEEL_TARGET_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo_name = repo.split("/", 1)
          repo_key = f"{owner}_{repo_name}"
          def candidate_dirs():
              base = root / repo_key
              return sorted(
                  [path for path in base.glob(f"pr-*/{target_sha}") if path.is_dir()],
                  key=lambda path: path.stat().st_mtime,
                  reverse=True,
              )

          def wheel_kind(path: pathlib.Path):
              name = path.name.replace("-", "_")
              if name.startswith(("sgl_kernel_", "sglang_kernel_")):
                  return "sgl-kernel"
              if name.startswith("sglang_"):
                  return "sglang"
              return None

          def to_container_path(path: pathlib.Path) -> str:
              return str(container_root / path.relative_to(root))

          candidates = candidate_dirs()
          if not candidates:
              print("wheel_available=false")
              print(f"[probe-hcu-wheels] no staged dirs under {root / repo_key}/pr-*/{target_sha}", file=sys.stderr)
              sys.exit(0)

          for staging_dir in candidates:
              ready = staging_dir / "READY"
              wheel_dir = staging_dir / "wheels"
              if not ready.exists() or not wheel_dir.is_dir():
                  print(f"[probe-hcu-wheels] skipping incomplete staging dir {staging_dir}", file=sys.stderr)
                  continue
              found = {}
              for wheel in sorted(wheel_dir.glob("*.whl")):
                  kind = wheel_kind(wheel)
                  if kind and kind not in found:
                      found[kind] = wheel
              missing = [name for name in ("sglang", "sgl-kernel") if name not in found]
              if not missing:
                  wheel_urls = " ".join(to_container_path(found[name]) for name in ("sglang", "sgl-kernel"))
                  print("wheel_available=true")
                  print(f"wheel_urls={wheel_urls}")
                  print(f"[probe-hcu-wheels] reusing staged wheels from {staging_dir}: {wheel_urls}", file=sys.stderr)
                  sys.exit(0)
              print(f"[probe-hcu-wheels] {staging_dir} missing {missing}; found={list(found)}", file=sys.stderr)

          print("wheel_available=false")
          PY_PROBE

          wheel_available="$(grep '^wheel_available=' /tmp/hcu_nightly_probe_wheels.out | tail -n 1 | cut -d= -f2-)"
          wheel_urls="$(grep '^wheel_urls=' /tmp/hcu_nightly_probe_wheels.out | tail -n 1 | cut -d= -f2- || true)"
          echo "wheel_available=${wheel_available:-false}" >> "${GITHUB_OUTPUT}"
          echo "wheel_urls=${wheel_urls}" >> "${GITHUB_OUTPUT}"

  build-hcu-wheels:
    name: Build HCU nightly wheels
    needs:
      - validate-config
      - probe-hcu-wheels
    if: needs.validate-config.result == 'success' && needs.probe-hcu-wheels.outputs.wheel_available != 'true'
    runs-on: [self-hosted, hcu, nmz4]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    container:
      image: ${{ vars.HCU_CI_RELEASE_IMAGE }}
      options: >
        --device=/dev/kfd --device=/dev/dri/ --group-add video
        -v /opt/hyhal/:/opt/hyhal/:ro
        --shm-size=80G
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged=true
        -v /ci_public/sglang-das/hcu-wheel-staging:/ci_public/sglang-das/hcu-wheel-staging
    env:
      TORCH_VERSION: '2.10.0'
      PIP_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
      PIP_TRUSTED_HOST: 10.16.1.201
      RESOURCE_SERVER: http://10.16.1.201:8000/
      WHEEL_COMMIT_SHA: ${{ needs.probe-hcu-wheels.outputs.full_sha }}
      HCU_WHEEL_STAGING_ROOT: /ci_public/sglang-das/hcu-wheel-staging
    steps:
      - name: Detect runner workspace ownership
        shell: bash
        run: |
          host_uid="$(stat -c '%u' "${RUNNER_TEMP}")"
          host_gid="$(stat -c '%g' "${RUNNER_TEMP}")"
          [[ "${host_uid}" =~ ^[0-9]+$ && "${host_gid}" =~ ^[0-9]+$ ]]
          echo "HCU_RUNNER_HOST_UID=${host_uid}" >> "${GITHUB_ENV}"
          echo "HCU_RUNNER_HOST_GID=${host_gid}" >> "${GITHUB_ENV}"

      - name: Normalize workspace ownership before checkout
        run: |
          chown -R "${HCU_RUNNER_HOST_UID}:${HCU_RUNNER_HOST_GID}" "${GITHUB_WORKSPACE}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WHEEL_COMMIT_SHA }}
          submodules: 'recursive'

      - name: Trust checked-out workspace
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install build deps
        run: |
          pip install torch==${TORCH_VERSION} build scikit-build-core cmake ninja wheel setuptools setuptools-scm setuptools-rust maturin ciupload
          wget ${RESOURCE_SERVER}/Jenkins/CompileDep/sglang/protoc-24.4-linux-x86_64.zip
          unzip protoc-24.4-linux-x86_64.zip -d /usr/local/
          chmod +x /usr/local/bin/protoc
          ln -s /usr/local/bin/protoc /usr/bin/protoc
          wget ${RESOURCE_SERVER}/Jenkins/CompileDep/sglang/rustup-init.sh
          export RUSTUP_DIST_SERVER=https://mirrors.tuna.tsinghua.edu.cn/rustup
          export RUSTUP_UPDATE_ROOT=https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup
          bash rustup-init.sh -y
          rm -rf ${HOME}/.cargo/config
          mkdir -p ${HOME}/.cargo
          cat > ${HOME}/.cargo/config << 'EOF'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'

          [source.tuna-sparse]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"

          [net]
          retry = 5
          git-fetch-with-cli = true

          [http]
          low-speed-limit = 1
          EOF

      - name: Install DTK
        run: |
          DTK_PKG_URL=${RESOURCE_SERVER}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
          cd /opt
          wget -q $DTK_PKG_URL
          tar -xzf $(basename $DTK_PKG_URL)
          mv dtk-* dtk

      - name: Build sgl-kernel (HIP)
        run: |
          source /opt/dtk/env.sh
          cd python/sglang/kernels/aot && python setup_hip.py bdist_wheel
          echo "=== sgl-kernel wheel ==="
          ls -lh dist/*.whl

      - name: Build sglang python package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.5.15.post1"
        run: |
          source /opt/dtk/env.sh
          source $HOME/.cargo/env
          cd python
          export SETUPTOOLS_SCM_PRETEND_VERSION="${SETUPTOOLS_SCM_PRETEND_VERSION}"
          python -m build --wheel --no-isolation -Cfeatures=all_hip
          echo "=== sglang wheel ==="
          ls -lh dist/*.whl

      - name: Repair and stage HCU wheels
        run: |
          source /opt/dtk/env.sh
          DTK_PKG_URL=${RESOURCE_SERVER}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
          DTK_VER=$(echo $DTK_PKG_URL | grep -oP 'dtk\K[0-9]+\.[0-9]+' | tr -d '.')
          mkdir -p output
          shopt -s nullglob
          wheels=(python/sglang/kernels/aot/dist/*.whl python/dist/*.whl)
          if (( ${#wheels[@]} == 0 )); then
            echo "No HCU wheels were built" >&2
            exit 1
          fi
          CIUpload REPAIR \
            --dtk_version "${DTK_VER}" \
            --torch_version "${TORCH_VERSION}" \
            --git_commit "${WHEEL_COMMIT_SHA}" \
            --outputdir output \
            -f "${wheels[@]}"
          echo "=== Repaired wheels ==="
          ls -lh output/

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          STAGING_ROOT="${HCU_WHEEL_STAGING_ROOT:-/ci_public/sglang-das/hcu-wheel-staging}"
          STAGING_DIR="${STAGING_ROOT}/${GITHUB_REPOSITORY_OWNER}_${REPO_NAME}/pr-nightly-${GITHUB_RUN_ID}/${WHEEL_COMMIT_SHA}"
          WHEEL_DIR="${STAGING_DIR}/wheels"

          echo "Saving HCU nightly wheels to ${WHEEL_DIR}"
          rm -rf "${WHEEL_DIR}"
          mkdir -p "${WHEEL_DIR}"
          cp -v output/*.whl "${WHEEL_DIR}/"

          export STAGING_DIR
          python3 - <<'PY_MANIFEST'
          from email.parser import Parser
          import json
          import os
          import pathlib
          import zipfile

          staging_dir = pathlib.Path(os.environ["STAGING_DIR"])
          wheel_dir = staging_dir / "wheels"
          wheel_paths = sorted(wheel_dir.glob("*.whl"))
          wheel_local_versions = {}
          for path in wheel_paths:
              with zipfile.ZipFile(path) as archive:
                  metadata_names = [
                      name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
                  ]
                  if len(metadata_names) != 1:
                      raise RuntimeError(f"Expected one METADATA file in {path.name}")
                  metadata = Parser().parsestr(
                      archive.read(metadata_names[0]).decode("utf-8")
                  )
              version = metadata.get("Version", "")
              _, separator, local_version = version.partition("+")
              if not separator or not local_version:
                  raise RuntimeError(f"Missing local version in {path.name}: {version}")
              wheel_local_versions[path.name] = local_version
          unique_local_versions = set(wheel_local_versions.values())
          local_version = next(iter(unique_local_versions)) if len(unique_local_versions) == 1 else None
          wheels = [str(path.relative_to(staging_dir)) for path in wheel_paths]
          manifest = {
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "commit_sha": os.environ.get("WHEEL_COMMIT_SHA", ""),
              "torch_version": os.environ.get("TORCH_VERSION", ""),
              "local_version": local_version,
              "wheel_local_versions": wheel_local_versions,
              "source": "nightly-test-hcu",
              "wheels": wheels,
          }
          (staging_dir / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY_MANIFEST

          touch "${STAGING_DIR}/READY"
          chown -R "${HCU_RUNNER_HOST_UID}:${HCU_RUNNER_HOST_GID}" "${STAGING_DIR}" || true
          echo "HCU nightly wheels are staged locally at ${STAGING_DIR}"

      - name: Normalize workspace ownership
        if: always()
        run: |
          chown -R "${HCU_RUNNER_HOST_UID}:${HCU_RUNNER_HOST_GID}" "${GITHUB_WORKSPACE}"

  wait-hcu-wheels:
    name: Wait HCU wheels
    needs:
      - validate-config
      - probe-hcu-wheels
      - build-hcu-wheels
    if: >
      always() &&
      needs.validate-config.result == 'success' &&
      needs.probe-hcu-wheels.result == 'success' &&
      (needs.build-hcu-wheels.result == 'success' || needs.build-hcu-wheels.result == 'skipped')
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    outputs:
      wheel_urls: ${{ steps.wait.outputs.wheel_urls }}
    env:
      HCU_WHEEL_STAGING_ROOT: /ci_public/sglang-das/hcu-wheel-staging
      HCU_WHEEL_STAGING_CONTAINER_ROOT: /hcu-wheel-staging
      HCU_WHEEL_TARGET_SHA: ${{ needs.probe-hcu-wheels.outputs.full_sha }}
      HCU_WHEEL_TARGET_SHORT_SHA: ${{ needs.probe-hcu-wheels.outputs.short_sha }}
      PROBE_WHEEL_AVAILABLE: ${{ needs.probe-hcu-wheels.outputs.wheel_available }}
      PROBE_WHEEL_URLS: ${{ needs.probe-hcu-wheels.outputs.wheel_urls }}
    steps:
      - name: Wait for current commit HCU wheels
        id: wait
        run: |
          set -euo pipefail
          if [[ "${PROBE_WHEEL_AVAILABLE}" == "true" ]]; then
            echo "Reusing existing staged HCU wheels for ${HCU_WHEEL_TARGET_SHA}: ${PROBE_WHEEL_URLS}"
            echo "wheel_urls=${PROBE_WHEEL_URLS}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Waiting for newly staged HCU wheels for ${HCU_WHEEL_TARGET_SHA}"
          echo "Host staging root: ${HCU_WHEEL_STAGING_ROOT}"
          python3 - <<'PY_WAIT' | tee /tmp/hcu_nightly_wheel_paths.out
          import os
          import pathlib
          import sys
          import time

          root = pathlib.Path(os.environ.get("HCU_WHEEL_STAGING_ROOT", "/ci_public/sglang-das/hcu-wheel-staging"))
          container_root = pathlib.Path(os.environ.get("HCU_WHEEL_STAGING_CONTAINER_ROOT", "/hcu-wheel-staging"))
          target_sha = os.environ["HCU_WHEEL_TARGET_SHA"]
          short_sha = os.environ.get("HCU_WHEEL_TARGET_SHORT_SHA", target_sha[:12])
          repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo_name = repo.split("/", 1)
          repo_key = f"{owner}_{repo_name}"
          timeout_s = int(os.environ.get("HCU_WHEEL_WAIT_TIMEOUT", "3600"))
          interval_s = int(os.environ.get("HCU_WHEEL_WAIT_INTERVAL", "60"))

          def candidate_dirs():
              base = root / repo_key
              return sorted(
                  [path for path in base.glob(f"pr-*/{target_sha}") if path.is_dir()],
                  key=lambda path: path.stat().st_mtime,
                  reverse=True,
              )

          def wheel_kind(path: pathlib.Path):
              name = path.name.replace("-", "_")
              if name.startswith(("sgl_kernel_", "sglang_kernel_")):
                  return "sgl-kernel"
              if name.startswith("sglang_"):
                  return "sglang"
              return None

          def to_container_path(path: pathlib.Path) -> str:
              return str(container_root / path.relative_to(root))

          deadline = time.time() + timeout_s
          while time.time() < deadline:
              candidates = candidate_dirs()
              if not candidates:
                  print(f"[wait-hcu-wheels] no staged dirs under {root / repo_key}/pr-*/{target_sha}", file=sys.stderr)
              for staging_dir in candidates:
                  ready = staging_dir / "READY"
                  wheel_dir = staging_dir / "wheels"
                  if not ready.exists():
                      print(f"[wait-hcu-wheels] {staging_dir} has no READY", file=sys.stderr)
                      continue
                  if not wheel_dir.is_dir():
                      print(f"[wait-hcu-wheels] {staging_dir} has no wheels directory", file=sys.stderr)
                      continue
                  found = {}
                  for wheel in sorted(wheel_dir.glob("*.whl")):
                      kind = wheel_kind(wheel)
                      if kind and kind not in found:
                          found[kind] = wheel
                  missing = [name for name in ("sglang", "sgl-kernel") if name not in found]
                  if not missing:
                      paths = [to_container_path(found[name]) for name in ("sglang", "sgl-kernel")]
                      print(f"[wait-hcu-wheels] found staged wheels in {staging_dir}: {' '.join(paths)}", file=sys.stderr)
                      print(" ".join(paths))
                      sys.exit(0)
                  print(f"[wait-hcu-wheels] {staging_dir} missing {missing}; found={list(found)}", file=sys.stderr)
              print(f"[wait-hcu-wheels] waiting for local staged wheels for {short_sha}; sleep {interval_s}s", file=sys.stderr)
              time.sleep(interval_s)

          print(f"Timed out waiting for locally staged HCU wheels for {target_sha}", file=sys.stderr)
          sys.exit(1)
          PY_WAIT

          wheel_urls="$(tail -n 1 /tmp/hcu_nightly_wheel_paths.out)"
          if [[ -z "${wheel_urls}" ]]; then
            echo "No local staged wheel paths were produced." >&2
            exit 1
          fi
          echo "wheel_urls=${wheel_urls}" >> "${GITHUB_OUTPUT}"
          echo "HCU_CI_INSTALL_WHEEL_URLS=${wheel_urls}"

  nightly-hcu:
    name: Nightly HCU (${{ matrix.name }})
    needs:
      - validate-config
      - probe-hcu-wheels
      - build-hcu-wheels
      - wait-hcu-wheels
    if: >
      always() &&
      needs.validate-config.result == 'success' &&
      needs.probe-hcu-wheels.result == 'success' &&
      (needs.build-hcu-wheels.result == 'success' || needs.build-hcu-wheels.result == 'skipped') &&
