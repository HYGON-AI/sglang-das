    env:
      HCU_CI_IMAGE: ${{ needs.validate-config.outputs.image }}
      HCU_CI_CONTAINER_NAME: ci_sglang_hcu_nightly_${{ github.run_id }}_${{ matrix.name }}
      HCU_CI_SKIP_PULL: ${{ vars.HCU_CI_SKIP_PULL || '' }}
      HCU_CI_SKIP_DEPENDENCY_INSTALL: ${{ vars.HCU_CI_SKIP_DEPENDENCY_INSTALL || '' }}
      HCU_CI_SKIP_REQUIREMENTS_INSTALL: ${{ vars.HCU_CI_SKIP_REQUIREMENTS_INSTALL || '' }}
      HCU_CI_SKIP_SGLANG_BUILD: ${{ vars.HCU_CI_SKIP_SGLANG_BUILD || '' }}
      HCU_CI_VISIBLE_DEVICES: ${{ matrix.visible_devices || vars.HCU_CI_VISIBLE_DEVICES || '' }}
      HCU_CI_NETWORK_MODE: ${{ matrix.network_mode || 'bridge' }}
      HCU_MODEL_EXTRA_HOST_PATHS: ${{ matrix.extra_model_paths || '' }}
      SGLANG_HCU_GSM8K_DATA_PATH: /public/opendas/DL_DATA/opencompass_data/gsm8k/test.jsonl
      SGLANG_HCU_MMLU_DATASET_PATH: /public/opendas/DL_DATA/llm-models/datasets/mmlu
      SGLANG_HCU_MATH500_DATA_PATH: /public/opendas/DL_DATA/opencompass_data/math/test_prm800k_500.jsonl
      SGLANG_HCU_HUMANEVAL_DATA_PATH: /public/opendas/DL_DATA/opencompass_data/humaneval/human-eval-v2-20210705.jsonl
      HCU_CI_INSTALL_WHEEL_URLS: ${{ needs.wait-hcu-wheels.outputs.wheel_urls || '' }}
      HCU_CI_USE_INSTALLED_WHEELS: "1"
      HCU_WHEEL_STAGING_ROOT: /ci_public/sglang-das/hcu-wheel-staging
      HCU_WHEEL_STAGING_CONTAINER_ROOT: /hcu-wheel-staging
      HCU_ACCURACY_SHARED_ROOT: /ci_public/sglang-das/hcu-accuracy
      HCU_REASONING_CODE_SHARED_ROOT: /ci_public/sglang-das/hcu-reasoning-code
    steps:
      - name: Check job filter
        id: filter
        env:
          JOB_FILTER: ${{ needs.validate-config.outputs.job_filter }}
          MATRIX_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          if [[ "${JOB_FILTER}" == "all" || "${JOB_FILTER}" == "${MATRIX_GROUP}" ]]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            echo "Running group ${MATRIX_GROUP}"
          else
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping group ${MATRIX_GROUP}; selected job_filter=${JOB_FILTER}"
          fi

      - name: Checkout code
        if: steps.filter.outputs.should_run == 'true'
        env:
          CHECKOUT_REF: ${{ needs.validate-config.outputs.target_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/hcu-sglang-${GITHUB_RUN_ID}-nightly-${{ matrix.name }}"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "HCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Setup HCU container
        if: steps.filter.outputs.should_run == 'true'
        run: |
          GITHUB_WORKSPACE="${HCU_CI_CHECKOUT_DIR}" \
            bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_start_container.sh" \
              --image "${HCU_CI_IMAGE}" \
              --container-name "${HCU_CI_CONTAINER_NAME}"

      - name: Install dependencies
        if: steps.filter.outputs.should_run == 'true'
        run: bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_install_dependency.sh"

      - name: Install reasoning/code evaluation dependencies
        if: >-
          steps.filter.outputs.should_run == 'true' &&
          matrix.group == 'nightly-hcu-accuracy-reasoning-code'
        run: >-
          bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_install_reasoning_code_deps.sh"

      - name: Run nightly HCU suite
        id: run_suite
        if: steps.filter.outputs.should_run == 'true'
        env:
          INCLUDE_FILES: ${{ matrix.include_files }}
          CONTINUE_ON_ERROR_FLAG: ${{ needs.validate-config.outputs.continue_on_error_flag }}
        run: |
          set -euo pipefail

          cmd=(
            python3 run_suite.py
            --hw hcu
            --suite "${{ matrix.suite }}"
            --auto-partition-id "${{ matrix.part }}"
            --auto-partition-size "${{ matrix.parts }}"
            --timeout-per-file "${{ matrix.timeout_per_file }}"
          )

          if [[ "${{ matrix.nightly }}" == "true" ]]; then
            cmd+=(--nightly)
          fi

          if [[ -n "${CONTINUE_ON_ERROR_FLAG}" ]]; then
            cmd+=("${CONTINUE_ON_ERROR_FLAG}")
          fi

          if [[ -n "${INCLUDE_FILES}" ]]; then
            for include_file in ${INCLUDE_FILES}; do
              cmd+=(--include-file "${include_file}")
            done
          fi

          echo "Running ${{ matrix.suite }} partition ${{ matrix.part }}/${{ matrix.parts }} nightly=${{ matrix.nightly }}"
          echo "HCU_CI_INSTALL_WHEEL_URLS=${HCU_CI_INSTALL_WHEEL_URLS}"
          exec_args=(
            -w /sglang-checkout/test
            --container-name "${HCU_CI_CONTAINER_NAME}"
          )
          if [[ "${{ matrix.group }}" == "nightly-hcu-accuracy-text" ]]; then
            exec_args+=(
              -e SGLANG_HCU_ACCURACY_RESULT_DIR=/sglang-checkout/test-results/hcu-accuracy
            )
          fi
          if [[ "${{ matrix.group }}" == "nightly-hcu-accuracy-reasoning-code" ]]; then
            log_dir="${HCU_CI_CHECKOUT_DIR}/test-results/hcu-reasoning-code/.logs"
            mkdir -p "${log_dir}"
            bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_exec.sh" "${exec_args[@]}" -- \
              "${cmd[@]}" 2>&1 | tee "${log_dir}/${{ matrix.reasoning_model_key }}-suite.log"
          else
            bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_exec.sh" "${exec_args[@]}" -- \
              "${cmd[@]}"
          fi

      - name: Judge HumanEval in a restricted container
        id: judge_humaneval
        if: >-
          always() &&
          steps.filter.outputs.should_run == 'true' &&
          matrix.group == 'nightly-hcu-accuracy-reasoning-code'
        run: |
          set -euo pipefail
          log_dir="${HCU_CI_CHECKOUT_DIR}/test-results/hcu-reasoning-code/.logs"
          mkdir -p "${log_dir}"
          bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_judge_humaneval.sh" \
            "${{ matrix.reasoning_model_key }}" 2>&1 | \
            tee "${log_dir}/${{ matrix.reasoning_model_key }}-judge.log"

      - name: Capture HCU runtime image ID
        if: >-
          always() &&
          steps.filter.outputs.should_run == 'true' &&
          (matrix.group == 'nightly-hcu-accuracy-text' ||
           matrix.group == 'nightly-hcu-accuracy-reasoning-code')
        run: |
          set -euo pipefail
          image_id="$(docker inspect --format '{{.Image}}' "${HCU_CI_CONTAINER_NAME}" 2>/dev/null || true)"
          if [[ -z "${image_id}" ]]; then
            image_id="$(docker image inspect --format '{{.Id}}' "${HCU_CI_IMAGE}" 2>/dev/null || true)"
          fi
          echo "HCU_CI_RUNTIME_IMAGE_ID=${image_id:-unknown}" >> "${GITHUB_ENV}"
          echo "Resolved HCU runtime image ID: ${image_id:-unknown}"

      - name: Cleanup HCU container
        if: always() && steps.filter.outputs.should_run == 'true'
        run: bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_cleanup_container.sh"

      - name: Publish reasoning/code results to shared storage
        if: >-
          always() &&
          steps.filter.outputs.should_run == 'true' &&
          matrix.group == 'nightly-hcu-accuracy-reasoning-code'
        env:
          SUITE_OUTCOME: ${{ steps.run_suite.outcome }}
          JUDGE_OUTCOME: ${{ steps.judge_humaneval.outcome }}
          HCU_REASONING_COMMIT_SHA: ${{ needs.probe-hcu-wheels.outputs.full_sha }}
          HCU_REASONING_TARGET_REF: ${{ needs.validate-config.outputs.target_ref }}
        run: |
          set -euo pipefail
          outcome="failure"
          if [[ "${SUITE_OUTCOME}" == "success" && "${JUDGE_OUTCOME}" == "success" ]]; then
            outcome="success"
          elif [[ "${SUITE_OUTCOME}" == "cancelled" || "${JUDGE_OUTCOME}" == "cancelled" ]]; then
            outcome="cancelled"
          fi
          result_root="${HCU_CI_CHECKOUT_DIR}/test-results/hcu-reasoning-code"
          python_bin="$(command -v python3.12 || command -v python3.10 || command -v python3.9 || command -v python3.8 || command -v python3)"
          "${python_bin}" "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_publish_reasoning_code.py" \
            --local-model-dir "${result_root}/${{ matrix.reasoning_model_key }}" \
            --log-file "${result_root}/.logs/${{ matrix.reasoning_model_key }}-suite.log" \
            --log-file "${result_root}/.logs/${{ matrix.reasoning_model_key }}-judge.log" \
            --shared-root "${HCU_REASONING_CODE_SHARED_ROOT}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --model-key "${{ matrix.reasoning_model_key }}" \
            --outcome "${outcome}" \
            --target-ref "${HCU_REASONING_TARGET_REF}" \
            --commit-sha "${HCU_REASONING_COMMIT_SHA}" \
            --image-ref "${HCU_CI_IMAGE}" \
            --image-id "${HCU_CI_RUNTIME_IMAGE_ID:-unknown}" \
            --runner-name "${RUNNER_NAME}" \
            --retention-days 14

      - name: Publish HCU accuracy results to shared storage
        if: >-
          always() &&
          steps.filter.outputs.should_run == 'true' &&
          matrix.group == 'nightly-hcu-accuracy-text'
        env:
          PARTITION_OUTCOME: ${{ steps.run_suite.outcome }}
          HCU_ACCURACY_COMMIT_SHA: ${{ needs.probe-hcu-wheels.outputs.full_sha }}
          HCU_ACCURACY_TARGET_REF: ${{ needs.validate-config.outputs.target_ref }}
        run: |
          set -euo pipefail
          result_dir="${RUNNER_TEMP}/hcu-sglang-${GITHUB_RUN_ID}-nightly-${{ matrix.name }}/test-results/hcu-accuracy"
          python_bin="$(command -v python3.12 || command -v python3.10 || command -v python3.9 || command -v python3.8 || command -v python3)"
          "${python_bin}" "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_publish_accuracy.py" \
            --local-results-dir "${result_dir}" \
            --shared-root "${HCU_ACCURACY_SHARED_ROOT}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --partition "${{ matrix.name }}" \
            --outcome "${PARTITION_OUTCOME}" \
            --target-ref "${HCU_ACCURACY_TARGET_REF}" \
            --commit-sha "${HCU_ACCURACY_COMMIT_SHA}" \
            --image-ref "${HCU_CI_IMAGE}" \
            --image-id "${HCU_CI_RUNTIME_IMAGE_ID:-unknown}" \
            --runner-name "${RUNNER_NAME}" \
            --retention-days 14

  nightly-hcu-finish:
    name: Nightly HCU finish
    needs:
      - validate-config
      - probe-hcu-wheels
      - build-hcu-wheels
      - wait-hcu-wheels
      - nightly-hcu
    if: always()
    runs-on: ${{ needs.validate-config.outputs.runner_label || vars.HCU_CI_RUNNER_LABEL }}
    steps:
      - name: Check all dependent job statuses
        run: |
          set -euo pipefail
          json_needs='${{ toJson(needs) }}'
          job_names=$(echo "${json_needs}" | jq -r 'keys_unsorted[]')

          for job in ${job_names}; do
            result=$(echo "${json_needs}" | jq -r --arg j "${job}" '.[$j].result')
            echo "${job}: ${result}"

            if [[ "${job}" == "build-hcu-wheels" && "${result}" == "skipped" ]]; then
              continue
            fi

            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done

          echo "All HCU nightly jobs completed successfully or were intentionally skipped."

  notify-hcu-accuracy-feishu:
    name: Notify HCU accuracy to Feishu
    needs:
      - validate-config
      - probe-hcu-wheels
      - nightly-hcu
      - nightly-hcu-finish
    if: >-
      always() &&
      github.ref_name == github.event.repository.default_branch &&
      needs.validate-config.result == 'success' &&
      (needs.validate-config.outputs.job_filter == 'all' ||
       needs.validate-config.outputs.job_filter == 'nightly-hcu-accuracy-text')
    runs-on: ${{ needs.validate-config.outputs.runner_label || vars.HCU_CI_RUNNER_LABEL }}
    environment: hcu-ci-notify
    steps:
      - name: Checkout notification source
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_dir="${RUNNER_TEMP}/hcu-notify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${checkout_dir}"
          mkdir -p "${checkout_dir}"
          echo "HCU_NOTIFY_SOURCE_DIR=${checkout_dir}" >> "${GITHUB_ENV}"
          git init "${checkout_dir}"
          cd "${checkout_dir}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Send signed Feishu accuracy card
        env:
          FEISHU_HCU_CI_WEBHOOK: ${{ secrets.FEISHU_HCU_CI_WEBHOOK }}
          FEISHU_HCU_CI_SIGNING_SECRET: ${{ secrets.FEISHU_HCU_CI_SIGNING_SECRET }}
          HCU_ACCURACY_RESULTS_DIR: /ci_public/sglang-das/hcu-accuracy/run-${{ github.run_id }}/attempt-${{ github.run_attempt }}
          HCU_ACCURACY_BRANCH: ${{ github.ref_name }}
          HCU_ACCURACY_TARGET_REF: ${{ needs.validate-config.outputs.target_ref }}
          HCU_ACCURACY_COMMIT_SHA: ${{ needs.probe-hcu-wheels.outputs.full_sha }}
          HCU_ACCURACY_IMAGE: ${{ needs.validate-config.outputs.image }}
          HCU_ACCURACY_WORKFLOW_RESULT: ${{ needs.nightly-hcu.result }}
          HCU_ACCURACY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python_bin="$(command -v python3.12 || command -v python3.10 || command -v python3.9 || command -v python3.8 || command -v python3)"
          "${python_bin}" "${HCU_NOTIFY_SOURCE_DIR}/scripts/ci/hcu/hcu_ci_notify_feishu.py" \
            --results-dir "${HCU_ACCURACY_RESULTS_DIR}" \
            --branch "${HCU_ACCURACY_BRANCH}" \
            --target-ref "${HCU_ACCURACY_TARGET_REF}" \
            --commit-sha "${HCU_ACCURACY_COMMIT_SHA}" \
            --image "${HCU_ACCURACY_IMAGE}" \
            --workflow-result "${HCU_ACCURACY_WORKFLOW_RESULT}" \
            --run-url "${HCU_ACCURACY_RUN_URL}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}"
