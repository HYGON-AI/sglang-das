name: Release HCU Nightly Wheels

permissions:
  contents: read

on:
  # ---- 合入 release 分支后触发 ----
  push:
    branches:
      - release/20260825_v0.5.18

  # ---- 手动触发，仅构建产物，不上传 NIGHTLY ----
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的 Git ref/branch/tag/SHA，默认当前分支 HEAD'
        required: false
        default: ''
        type: string

jobs:
  compile:
    # ---- 并发控制: 同一分支 + 同一 Python 版本的 job 只保留最新一个 ----
    concurrency:
      group: release-nightly-hcu-${{ github.ref }}-py${{ matrix.python-version }}
      cancel-in-progress: true
    # ---- 自托管 HCU runner，在 Docker 容器内执行 ----
    runs-on: [self-hosted, hcu]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    container:
      image: ${{ vars.BASE_COMPILE_IMAGE_ROCKY_PY310 }}
      options: >
        --device=/dev/kfd --device=/dev/dri/ --group-add video
        -v /opt/hyhal/:/opt/hyhal/:ro
        --shm-size=80G
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged=true

    # ---- Matrix: 3 个 Python 版本并行编译 ----
    strategy:
      matrix:
        python-version: ['3.10']

    env:
      TORCH_VERSION: '2.11.0'
      PYPI_URL: ${{ vars.PYPI_URL }}
      PIP_INDEX_URL: ${{ vars.PYPI_URL }}/nightly/dtk2604/+simple/
      RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
      DTK_PKG_URL: ${{ vars.RESOURCE_SERVER_URL }}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
      WHEEL_COMMIT_SHA: ${{ inputs.ref || github.sha }}

    steps:
      # =======================================================================
      # 环境准备
      # =======================================================================

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WHEEL_COMMIT_SHA }}
          submodules: 'recursive'

      - name: Resolve wheel commit SHA
        run: |
          WHEEL_COMMIT_SHA="$(git rev-parse HEAD)"
          echo "WHEEL_COMMIT_SHA=${WHEEL_COMMIT_SHA}" >> "${GITHUB_ENV}"
          echo "Building HCU wheels for ${WHEEL_COMMIT_SHA}"

      - name: Resolve PIP_TRUSTED_HOST from PYPI_URL
        run: |
          PIP_TRUSTED_HOST="$(echo "${PYPI_URL}" | sed -E 's#^https?://([^/:]+).*#\1#')"
          echo "PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST}" >> "${GITHUB_ENV}"

      # 容器内已预装 Python 3.10 + DTK/ROCm + gcc + cmake
      - name: Install build deps
        run: |
          yum install -y perl-IPC-Cmd perl-Time-Piece
          pip install torch==${TORCH_VERSION} build scikit-build-core cmake ninja wheel setuptools setuptools-scm setuptools-rust "maturin<1.8" ciupload
          wget ${RESOURCE_SERVER_URL}/Jenkins/CompileDep/sglang/protoc-24.4-linux-x86_64.zip
          unzip protoc-24.4-linux-x86_64.zip -d /usr/local/
          chmod +x /usr/local/bin/protoc
          ln -s /usr/local/bin/protoc /usr/bin/protoc
          wget ${RESOURCE_SERVER_URL}/Jenkins/CompileDep/sglang/rustup-init.sh
          export RUSTUP_DIST_SERVER=https://mirrors.tuna.tsinghua.edu.cn/rustup
          export RUSTUP_UPDATE_ROOT=https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup
          bash rustup-init.sh -y
          rm -rf ${HOME}/.cargo/config
          mkdir -p ${HOME}/.cargo
          cat > ${HOME}/.cargo/config << 'EOF'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'

          [source.tuna-sparse]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"

          [net]
          retry = 5
          git-fetch-with-cli = true

          [http]
          low-speed-limit = 1
          EOF

      - name: Install DTK
        run: |
          cd /opt
          wget -q $DTK_PKG_URL
          tar -xzf $(basename $DTK_PKG_URL)
          mv dtk-* dtk

      # =======================================================================
      # 路径检测: 决定哪些组件需要编译
      # =======================================================================

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            sgl-kernel:
              - 'python/sglang/kernels/aot/**'
            sglang:
              - 'python/**'
            gateway:
              - 'sgl-model-gateway/**'

      # =======================================================================
      # 编译阶段: 按检测结果增量编译；workflow_dispatch 时忽略检测结果，全量编译
      # =======================================================================

      - name: Build sgl-kernel (HIP)
        run: |
          source /opt/dtk/env.sh
          cd python/sglang/kernels/aot && python setup_hip.py bdist_wheel
          echo "=== sgl-kernel wheel ==="
          ls -lh dist/*.whl

      - name: Build sglang python package
        if: steps.changes.outputs.sglang == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.5.18"
        run: |
          source /opt/dtk/env.sh
          source $HOME/.cargo/env
          cd python
          export SETUPTOOLS_SCM_PRETEND_VERSION="${SETUPTOOLS_SCM_PRETEND_VERSION}"
          python -m build --wheel --no-isolation -Cfeatures=all_hip
          echo "=== sglang wheel ==="
          ls -lh dist/*.whl

      - name: Build sgl-model-gateway
        if: steps.changes.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          source /opt/dtk/env.sh
          source $HOME/.cargo/env
          export RUSTUP_DIST_SERVER=https://mirrors.ustc.edu.cn/rust-static
          export RUSTUP_UPDATE_ROOT=https://mirrors.ustc.edu.cn/rust-static/rustup
          cd sgl-model-gateway && cargo build --release
          maturin build --manifest-path bindings/python/Cargo.toml --release --skip-auditwheel
          echo "=== sgl-model-gateway wheel ==="
          ls -lh "$GITHUB_WORKSPACE/sgl-model-gateway/target/wheels/"*.whl

      # =======================================================================
      # 修复 (auditwheel) & 上传产物
      # =======================================================================

      - name: Apply DAS local version to wheels
        env:
          CIUPLOAD_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          source /opt/dtk/env.sh
          DTK_VER=$(echo $DTK_PKG_URL | grep -oP 'dtk\K[0-9]+(\.[0-9]+)+' | tr -d '.')
          mkdir -p output
          shopt -s nullglob
          wheels=(python/sglang/kernels/aot/dist/*.whl python/dist/*.whl sgl-model-gateway/target/wheels/*.whl)
          if (( ${#wheels[@]} == 0 )); then
            echo "No HCU wheels were built" >&2
            exit 1
          fi
          CIUpload REPAIR \
            --dtk_version "${DTK_VER}" \
            --torch_version "${TORCH_VERSION}" \
            --git_commit "${WHEEL_COMMIT_SHA}" \
            --outputdir output \
            -f "${wheels[@]}"
          echo "=== Repaired wheels ==="
          ls -lh output/
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            CIUpload NIGHTLY \
              --devpi_url "${PYPI_URL}" \
              --password "${CIUPLOAD_PASSWORD}" \
              --dtk_pkg_name "$(basename "${DTK_PKG_URL}")" \
              -f output/*.whl
          fi
          rm -rf /home/github/sgl_whl_temp/HYGON-AI_hcu-sglang/* || true

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: hcu-wheels-py${{ matrix.python-version }}
          path: output/*.whl
          if-no-files-found: warn

      # 容器 job 以 root 运行, 会在共享 workspace 留下 root 文件,
      # 导致同机器上其他 job 的 checkout 失败; 跑完清掉
      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
