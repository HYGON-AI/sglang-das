  finalize-dcu-wheels:
    name: Finalize DCU wheels
    needs:
      - check-changes
      - call-gate
      - validate-config
      - wait-dcu-wheels
      - stage-a-test-1-gpu-small-dcu
      - stage-b-test-1-gpu-small-dcu
    if: always() && needs.check-changes.outputs.dcu == 'true' && needs.check-changes.outputs.wheel_required == 'true' && needs.wait-dcu-wheels.result == 'success'
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    container:
      image: harbor.sourcefind.cn:5443/dcu/admin/base/dev:rockylinux8.6-mpi5.0-gcc10.3-cmake3.29-py3.10-mkl2020.4.304
      options: >
        -v ${{ vars.DCU_CI_WHEEL_STAGING_HOST || '/home/github/sgl_whl_temp' }}:${{ vars.DCU_CI_WHEEL_STAGING_HOST || '/home/github/sgl_whl_temp' }}
    env:
      DCU_WHEEL_STAGING_DIR: ${{ needs.wait-dcu-wheels.outputs.staging_dir }}
      STAGE_A_RESULT: ${{ needs.stage-a-test-1-gpu-small-dcu.result }}
      STAGE_B_RESULT: ${{ needs.stage-b-test-1-gpu-small-dcu.result }}
      PIP_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
      PIP_TRUSTED_HOST: 10.16.1.201
      RESOURCE_SERVER: http://10.16.1.201:8000/
      DCU_CI_PROMOTE_DEVPI_URL: ${{ vars.DCU_CI_PROMOTE_DEVPI_URL || 'http://10.16.1.201:9929' }}
      DCU_CI_PROMOTE_DEVPI_USER: ${{ vars.DCU_CI_PROMOTE_DEVPI_USER || 'nightly' }}
      DCU_CI_PROMOTE_DEVPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
    steps:
      - name: Record test result or promote wheels
        run: |
          set -euo pipefail
          if [[ -z "${DCU_WHEEL_STAGING_DIR}" || ! -d "${DCU_WHEEL_STAGING_DIR}" ]]; then
            echo "::error::DCU wheel staging dir is missing: ${DCU_WHEEL_STAGING_DIR}"
            exit 1
          fi

          export RESULT_STATUS="failed"
          if [[ "${STAGE_A_RESULT}" =~ ^(success|skipped)$ && "${STAGE_B_RESULT}" =~ ^(success|skipped)$ ]]; then
            RESULT_STATUS="passed"
          fi

          python3 - <<'PY_RESULT'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          staging_dir = Path(os.environ["DCU_WHEEL_STAGING_DIR"])
          result = {
              "status": os.environ["RESULT_STATUS"],
              "stage_a_result": os.environ["STAGE_A_RESULT"],
              "stage_b_result": os.environ["STAGE_B_RESULT"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "updated_at": datetime.now(timezone.utc).isoformat(),
          }
          (staging_dir / "test-result.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY_RESULT

          if [[ "${RESULT_STATUS}" != "passed" ]]; then
            touch "${DCU_WHEEL_STAGING_DIR}/TEST_FAILED"
            echo "DCU tests did not pass; keeping staged wheels local and skipping devpi upload."
            exit 0
          fi

          if [[ -z "${DCU_CI_PROMOTE_DEVPI_PASSWORD}" ]]; then
            echo "::error::PYPI_PASSWORD secret is required to promote DCU wheels."
            exit 1
          fi

          python3 -m pip install wheel ciupload
          DTK_PKG_URL=${RESOURCE_SERVER}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
          CIUpload \
            --devpi_url "${DCU_CI_PROMOTE_DEVPI_URL}" \
            --devpi_user "${DCU_CI_PROMOTE_DEVPI_USER}" \
            --devpi_password "${DCU_CI_PROMOTE_DEVPI_PASSWORD}" \
            --dtk_pkg_name "$(basename "${DTK_PKG_URL}")" \
            -f "${DCU_WHEEL_STAGING_DIR}"/wheels/*.whl
          touch "${DCU_WHEEL_STAGING_DIR}/PROMOTED"
          echo "DCU PR wheels promoted from ${DCU_WHEEL_STAGING_DIR}."

  pr-test-dcu-finish:
    name: PR Test (DCU) finish
    needs:
      - check-changes
      - call-gate
      - validate-config
      - wait-dcu-wheels
      - stage-a-test-1-gpu-small-dcu
      - stage-b-test-1-gpu-small-dcu
      - finalize-dcu-wheels
    if: always()
    runs-on: ${{ inputs.runner_label || vars.DCU_CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Check all dependent job statuses
        run: |
          json_needs='${{ toJson(needs) }}'
          job_names=$(echo "${json_needs}" | jq -r 'keys_unsorted[]')

          for job in ${job_names}; do
            result=$(echo "${json_needs}" | jq -r --arg j "${job}" '.[$j].result')
            echo "${job}: ${result}"

            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done

          echo "All required DCU jobs completed successfully or were skipped."
