name: PR Test (DCU)
run-name: ${{ (inputs.target_stage || inputs.target_stage_select) && (inputs.pr_head_sha && format('[{0}] {1}', inputs.target_stage || inputs.target_stage_select, inputs.pr_head_sha) || format('[{0}]', inputs.target_stage || inputs.target_stage_select)) || '' }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
    branches:
      - v0.5.12_dev
      - dcu-ci-pr
      - main
    paths:
      - ".github/workflows/pr-test-dcu.yml"
      - ".github/workflows/pr-gate.yml"
      - "scripts/ci/dcu/**"
      - "python/pyproject*.toml"
      - "python/sglang/**"
      - "test/run_suite.py"
      - "test/registered/**"
      - "sgl-kernel/**"
  workflow_dispatch:
    inputs:
      target_stage_select:
        description: "Select a DCU stage to run from dropdown (leave empty for all)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - stage-a-test-1-gpu-small-dcu
          - stage-b-test-1-gpu-small-dcu
      target_stage:
        description: "Or type comma-separated DCU stage names"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref, branch, tag, or SHA to test"
        required: false
        type: string
        default: ""
      pr_head_sha:
        description: "PR head SHA for reruns"
        required: false
        type: string
        default: ""
      runner_label:
        description: "DCU runner label override"
        required: false
        type: string
        default: ""
      image:
        description: "DCU CI container image override"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue running remaining files after a test failure"
        required: false
        type: boolean
        default: false
      force_wheel_mode:
        description: "Force waiting for and installing DCU wheels"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Git ref, branch, tag, or SHA to test"
        required: false
        type: string
        default: ""
      run_all_tests:
        description: "Run all DCU PR tests"
        required: false
        type: boolean
        default: false
      runner_label:
        description: "DCU runner label override"
        required: false
        type: string
        default: ""
      image:
        description: "DCU CI container image override"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue running remaining files after a test failure"
        required: false
        type: boolean
        default: false
      force_wheel_mode:
        description: "Force waiting for and installing DCU wheels"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-test-dcu-${{ github.event_name }}-${{ github.head_ref || github.ref_name || 'default' }}-${{ inputs.pr_head_sha || inputs.ref || 'current' }}-${{ inputs.target_stage || inputs.target_stage_select || 'all' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  check-changes:
    name: Check changes
    runs-on: ${{ github.event_name == 'workflow_dispatch' && (inputs.runner_label || vars.DCU_CI_RUNNER_LABEL) || 'ubuntu-latest' }}
    outputs:
      dcu: ${{ steps.filter.outputs.dcu || steps.run-mode.outputs.run_all_tests }}
      run_stage_a: ${{ steps.plan.outputs.run_stage_a }}
      run_stage_b: ${{ steps.plan.outputs.run_stage_b }}
      wheel_required: ${{ steps.wheel.outputs.wheel_required }}
      gateway_wheel_required: ${{ steps.wheel.outputs.gateway_wheel_required }}
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}

      - name: Determine run mode
        id: run-mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ALL_TESTS: ${{ inputs.run_all_tests || false }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${RUN_ALL_TESTS}" == "true" ]]; then
            echo "run_all_tests=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run_all_tests=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Detect DCU-relevant changes
        id: filter
        if: steps.run-mode.outputs.run_all_tests != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "${BASE_SHA}" ]]; then
            echo "dcu=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${BASE_SHA}" "${HEAD_SHA}"
          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "${changed_files}"

          if echo "${changed_files}" | grep -Eq '^(\.github/workflows/pr-test-dcu\.yml|\.github/workflows/pr-gate\.yml|scripts/ci/dcu/|python/pyproject.*\.toml|python/sglang/|test/run_suite\.py|python/sglang/test/ci/|test/registered/|sgl-kernel/)'; then
            echo "dcu=true" >> "${GITHUB_OUTPUT}"
          else
            echo "dcu=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Select DCU stages
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_STAGE: ${{ inputs.target_stage || inputs.target_stage_select || '' }}
        run: |
          if [[ "${EVENT_NAME}" != "workflow_dispatch" || -z "${TARGET_STAGE}" || "${TARGET_STAGE}" == "all" ]]; then
            echo "run_stage_a=true" >> "${GITHUB_OUTPUT}"
            echo "run_stage_b=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          requested=",${TARGET_STAGE},"
          run_stage_a=false
          run_stage_b=false

          if [[ "${requested}" == *",stage-a-test-1-gpu-small-dcu,"* ]]; then
            run_stage_a=true
          fi
          if [[ "${requested}" == *",stage-b-test-1-gpu-small-dcu,"* ]]; then
            run_stage_b=true
          fi

          if [[ "${run_stage_a}" == "false" && "${run_stage_b}" == "false" ]]; then
            echo "::error::Unknown DCU target_stage '${TARGET_STAGE}'."
            exit 1
          fi

          echo "run_stage_a=${run_stage_a}" >> "${GITHUB_OUTPUT}"
          echo "run_stage_b=${run_stage_b}" >> "${GITHUB_OUTPUT}"

      - name: Classify DCU wheel sync mode
        id: wheel
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_WHEEL_MODE: ${{ inputs.force_wheel_mode || false }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "${FORCE_WHEEL_MODE}" == "true" ]]; then
            echo "wheel_required=true" >> "${GITHUB_OUTPUT}"
            echo "gateway_wheel_required=false" >> "${GITHUB_OUTPUT}"
            echo "Wheel mode forced by workflow input."
            exit 0
          fi

          if [[ "${EVENT_NAME}" != "pull_request" || -z "${BASE_SHA}" ]]; then
            echo "wheel_required=false" >> "${GITHUB_OUTPUT}"
            echo "gateway_wheel_required=false" >> "${GITHUB_OUTPUT}"
            echo "Wheel mode disabled for non-PR run without force_wheel_mode."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${BASE_SHA}" "${HEAD_SHA}"
          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "${changed_files}"

          wheel_required=false
          gateway_wheel_required=false

          if echo "${changed_files}" | grep -Eq '^(sgl-kernel/|requirements_dcu\.txt|python/pyproject.*\.toml|python/sglang/srt/layers/|python/sglang/srt/_custom_ops\.py)'; then
            wheel_required=true
          fi

          if echo "${changed_files}" | grep -Eq '^sgl-model-gateway/'; then
            wheel_required=true
            gateway_wheel_required=true
          fi

          echo "wheel_required=${wheel_required}" >> "${GITHUB_OUTPUT}"
          echo "gateway_wheel_required=${gateway_wheel_required}" >> "${GITHUB_OUTPUT}"
          echo "wheel_required=${wheel_required}, gateway_wheel_required=${gateway_wheel_required}"

  call-gate:
    name: Call PR gate
    needs: check-changes
    if: github.event_name == 'pull_request' && needs.check-changes.outputs.dcu == 'true'
    uses: ./.github/workflows/pr-gate.yml
    with:
      require-run-ci: true
      cool-down-minutes: 0
    secrets: inherit

  validate-config:
    name: Validate DCU config
    needs:
      - check-changes
      - call-gate
    if: always() && needs.check-changes.outputs.dcu == 'true' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped')
    runs-on: ${{ github.event_name == 'workflow_dispatch' && (inputs.runner_label || vars.DCU_CI_RUNNER_LABEL) || 'ubuntu-latest' }}
    outputs:
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      image: ${{ steps.resolve.outputs.image }}
      continue_on_error_flag: ${{ steps.resolve.outputs.continue_on_error_flag }}
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}

      - name: Checkout code for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CHECKOUT_REF: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-validate"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Resolve DCU runner and image
        id: resolve
        env:
          INPUT_RUNNER_LABEL: ${{ inputs.runner_label || '' }}
          INPUT_IMAGE: ${{ inputs.image || '' }}
          VAR_RUNNER_LABEL: ${{ vars.DCU_CI_RUNNER_LABEL || '' }}
          VAR_IMAGE: ${{ vars.DCU_CI_IMAGE || '' }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error || false }}
        run: |
          runner_label="${INPUT_RUNNER_LABEL:-${VAR_RUNNER_LABEL}}"
          image="${INPUT_IMAGE:-${VAR_IMAGE}}"

          if [[ -z "${runner_label}" ]]; then
            echo "::error::DCU runner label is required. Set vars.DCU_CI_RUNNER_LABEL or workflow input runner_label."
            exit 1
          fi

          if [[ -z "${image}" ]]; then
            echo "::error::DCU CI image is required. Set vars.DCU_CI_IMAGE or workflow input image."
            exit 1
          fi

          continue_on_error_flag=""
          if [[ "${CONTINUE_ON_ERROR}" == "true" ]]; then
            continue_on_error_flag="--continue-on-error"
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            continue_on_error_flag="--continue-on-error"
          fi

          echo "runner_label=${runner_label}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "continue_on_error_flag=${continue_on_error_flag}" >> "${GITHUB_OUTPUT}"

      - name: Verify DCU registration
        if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/ci/dcu/verify_dcu_registration.py

      - name: Setup DCU validation container
        if: github.event_name == 'workflow_dispatch'
        env:
          DCU_CI_IMAGE: ${{ steps.resolve.outputs.image }}
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_${{ github.run_id }}_validate
          DCU_CI_SKIP_PULL: ${{ vars.DCU_CI_SKIP_PULL || '' }}
          DCU_CI_VISIBLE_DEVICES: ${{ vars.DCU_CI_VISIBLE_DEVICES || '' }}
        run: |
          GITHUB_WORKSPACE="${DCU_CI_CHECKOUT_DIR}" \
            bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_start_container.sh" \
              --image "${DCU_CI_IMAGE}" \
              --container-name "${DCU_CI_CONTAINER_NAME}"

      - name: Verify DCU registration in container
        if: github.event_name == 'workflow_dispatch'
        env:
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_${{ github.run_id }}_validate
        run: |
          bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_exec.sh" \
            --container-name "${DCU_CI_CONTAINER_NAME}" \
            -w /sglang-checkout \
            -- python3 scripts/ci/dcu/verify_dcu_registration.py

      - name: Cleanup DCU validation container
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_${{ github.run_id }}_validate
        run: |
          if docker ps -a --format '{{.Names}}' | grep -Fxq "${DCU_CI_CONTAINER_NAME}"; then
            host_uid="$(id -u)"
            host_gid="$(id -g)"
            docker exec "${DCU_CI_CONTAINER_NAME}" bash -lc "chown -R ${host_uid}:${host_gid} /sglang-checkout || true" || true
            docker rm -f "${DCU_CI_CONTAINER_NAME}"
          fi

  wait-dcu-wheels:
    name: Wait DCU wheels
    needs:
      - check-changes
      - call-gate
      - validate-config
    if: always() && needs.check-changes.outputs.dcu == 'true' && needs.check-changes.outputs.wheel_required == 'true' && needs.validate-config.result == 'success' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped')
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    outputs:
      wheel_urls: ${{ steps.wait.outputs.wheel_urls }}
    env:
      DCU_WHEEL_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
      CHECKOUT_REF: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.sha }}
      GATEWAY_WHEEL_REQUIRED: ${{ needs.check-changes.outputs.gateway_wheel_required }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Resolve wheel target SHA
        id: sha
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "Using wheel short SHA: ${short_sha}"

      - name: Wait for current commit DCU wheels
        id: wait
        run: |
          set -euo pipefail
          short_sha="${{ steps.sha.outputs.short_sha }}"
          export CHECKOUT_REF="${short_sha}"
          echo "Waiting for DCU wheels with g${short_sha}"

          python3 - <<'PY_WAIT' | tee /tmp/dcu_wheel_urls.out
          import html.parser
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request

          base = os.environ["DCU_WHEEL_INDEX_URL"].rstrip("/") + "/"
          short_sha = os.environ["CHECKOUT_REF"][:12]
          gateway_required = os.environ.get("GATEWAY_WHEEL_REQUIRED", "false") == "true"
          timeout_s = int(os.environ.get("DCU_WHEEL_WAIT_TIMEOUT", "3600"))
          interval_s = int(os.environ.get("DCU_WHEEL_WAIT_INTERVAL", "60"))

          class LinkParser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  for key, value in attrs:
                      if key == "href":
                          self.links.append(value)

          def fetch_links(project):
              url = urllib.parse.urljoin(base, project.strip("/") + "/")
              with urllib.request.urlopen(url, timeout=30) as resp:
                  parser = LinkParser()
                  parser.feed(resp.read().decode("utf-8", errors="replace"))
              return [urllib.parse.urljoin(url, link) for link in parser.links]

          def find_wheel(projects, prefixes):
              marker = f"g{short_sha}"
              for project in projects:
                  try:
                      links = fetch_links(project)
                  except Exception as exc:
                      print(f"[wait-dcu-wheels] {project}: {type(exc).__name__}: {exc}", file=sys.stderr)
                      continue
                  for link in links:
                      filename = urllib.parse.unquote(link.rsplit("/", 1)[-1].split("#", 1)[0])
                      normalized = filename.replace("-", "_")
                      if not filename.endswith(".whl") or marker not in filename:
                          continue
                      if any(normalized.startswith(prefix.replace("-", "_")) for prefix in prefixes):
                          return link
              return None

          requirements = [
              ("sglang", ["sglang"], ["sglang_"]),
              ("sgl-kernel", ["sgl-kernel", "sglang-kernel", "sgl_kernel", "sglang_kernel"], ["sgl_kernel_", "sglang_kernel_"]),
          ]
          if gateway_required:
              requirements.append(("sgl-model-gateway", ["sgl-model-gateway", "sgl_model_gateway"], ["sgl_model_gateway_"]))

          deadline = time.time() + timeout_s
          found = {}
          while time.time() < deadline:
              missing = []
              for name, projects, prefixes in requirements:
                  if name in found:
                      continue
                  wheel = find_wheel(projects, prefixes)
                  if wheel:
                      found[name] = wheel
                      print(f"[wait-dcu-wheels] found {name}: {wheel}", file=sys.stderr)
                  else:
                      missing.append(name)
              if len(found) == len(requirements):
                  print(" ".join(found[name] for name, _, _ in requirements))
                  sys.exit(0)
              print(f"[wait-dcu-wheels] missing {missing}; sleep {interval_s}s", file=sys.stderr)
              time.sleep(interval_s)

          print(f"Timed out waiting for current commit wheels g{short_sha}; found={found}", file=sys.stderr)
          sys.exit(1)
          PY_WAIT
          wheel_urls="$(tail -n 1 /tmp/dcu_wheel_urls.out)"
          echo "wheel_urls=${wheel_urls}" >> "${GITHUB_OUTPUT}"

  stage-a-test-1-gpu-small-dcu:
    name: Stage A DCU smoke
    needs:
      - check-changes
      - call-gate
      - validate-config
      - wait-dcu-wheels
    if: always() && needs.check-changes.outputs.dcu == 'true' && needs.check-changes.outputs.run_stage_a == 'true' && needs.validate-config.result == 'success' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped') && (needs.wait-dcu-wheels.result == 'success' || needs.wait-dcu-wheels.result == 'skipped')
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    env:
      DCU_CI_IMAGE: ${{ needs.validate-config.outputs.image }}
      DCU_CI_CONTAINER_NAME: ci_sglang_dcu_${{ github.run_id }}_stage_a
      DCU_CI_SKIP_PULL: ${{ vars.DCU_CI_SKIP_PULL || '' }}
      DCU_CI_SKIP_DEPENDENCY_INSTALL: ${{ vars.DCU_CI_SKIP_DEPENDENCY_INSTALL || '' }}
      DCU_CI_SKIP_REQUIREMENTS_INSTALL: ${{ vars.DCU_CI_SKIP_REQUIREMENTS_INSTALL || '' }}
      DCU_CI_SKIP_SGLANG_BUILD: ${{ vars.DCU_CI_SKIP_SGLANG_BUILD || '' }}
      DCU_CI_VISIBLE_DEVICES: ${{ vars.DCU_CI_VISIBLE_DEVICES || '' }}
      DCU_CI_INSTALL_WHEEL_URLS: ${{ needs.wait-dcu-wheels.outputs.wheel_urls || '' }}
      DCU_CI_USE_INSTALLED_WHEELS: ${{ needs.check-changes.outputs.wheel_required == 'true' && '1' || '' }}
    steps:
      - name: Checkout code
        env:
          CHECKOUT_REF: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-stage-a"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Setup DCU container
        run: |
          GITHUB_WORKSPACE="${DCU_CI_CHECKOUT_DIR}" \
            bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_start_container.sh" \
              --image "${DCU_CI_IMAGE}" \
              --container-name "${DCU_CI_CONTAINER_NAME}"

      - name: Install dependencies
        run: bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_install_dependency.sh"

      - name: Run stage-a-test-1-gpu-small-dcu
        timeout-minutes: 30
        run: |
          bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_exec.sh" -w /sglang-checkout/test --container-name "${DCU_CI_CONTAINER_NAME}" -- \
            python3 run_suite.py \
              --hw dcu \
              --suite stage-a-test-1-gpu-small-dcu \
              --include-file registered/dcu/interface/test_dcu_smoke.py \
              --timeout-per-file 120 \
              ${{ needs.validate-config.outputs.continue_on_error_flag }}

      - name: Cleanup DCU container
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -Fxq "${DCU_CI_CONTAINER_NAME}"; then
            host_uid="$(id -u)"
            host_gid="$(id -g)"
            docker exec "${DCU_CI_CONTAINER_NAME}" bash -lc "chown -R ${host_uid}:${host_gid} /sglang-checkout || true" || true
            docker rm -f "${DCU_CI_CONTAINER_NAME}"
          fi

  stage-b-test-1-gpu-small-dcu:
    name: Stage B DCU required (${{ matrix.name }})
    needs:
      - check-changes
      - call-gate
      - validate-config
      - stage-a-test-1-gpu-small-dcu
      - wait-dcu-wheels
    if: always() && needs.check-changes.outputs.dcu == 'true' && needs.check-changes.outputs.run_stage_b == 'true' && needs.validate-config.result == 'success' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped') && (needs.wait-dcu-wheels.result == 'success' || needs.wait-dcu-wheels.result == 'skipped')
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: stage-b-required-0
            part: 0
            parts: 4
            timeout_per_file: 300
            timeout_minutes: 60
          - name: stage-b-required-1
            part: 1
            parts: 4
            timeout_per_file: 300
            timeout_minutes: 60
          - name: stage-b-required-2
            part: 2
            parts: 4
            timeout_per_file: 300
            timeout_minutes: 60
          - name: stage-b-required-3
            part: 3
            parts: 4
            timeout_per_file: 300
            timeout_minutes: 60
    env:
      DCU_CI_IMAGE: ${{ needs.validate-config.outputs.image }}
      DCU_CI_CONTAINER_NAME: ci_sglang_dcu_${{ github.run_id }}_stage_b_${{ matrix.part }}
      DCU_CI_SKIP_PULL: ${{ vars.DCU_CI_SKIP_PULL || '' }}
      DCU_CI_SKIP_DEPENDENCY_INSTALL: ${{ vars.DCU_CI_SKIP_DEPENDENCY_INSTALL || '' }}
      DCU_CI_SKIP_REQUIREMENTS_INSTALL: ${{ vars.DCU_CI_SKIP_REQUIREMENTS_INSTALL || '' }}
      DCU_CI_SKIP_SGLANG_BUILD: ${{ vars.DCU_CI_SKIP_SGLANG_BUILD || '' }}
      DCU_CI_VISIBLE_DEVICES: ${{ vars.DCU_CI_VISIBLE_DEVICES || '' }}
      DCU_CI_INSTALL_WHEEL_URLS: ${{ needs.wait-dcu-wheels.outputs.wheel_urls || '' }}
      DCU_CI_USE_INSTALLED_WHEELS: ${{ needs.check-changes.outputs.wheel_required == 'true' && '1' || '' }}
    steps:
      - name: Checkout code
        env:
          CHECKOUT_REF: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-stage-b-${{ matrix.part }}"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Setup DCU container
        run: |
          GITHUB_WORKSPACE="${DCU_CI_CHECKOUT_DIR}" \
            bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_start_container.sh" \
              --image "${DCU_CI_IMAGE}" \
              --container-name "${DCU_CI_CONTAINER_NAME}"

      - name: Install dependencies
        run: bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_install_dependency.sh"

      - name: Run stage-b-test-1-gpu-small-dcu required partition
        run: |
          echo "Running stage-b-test-1-gpu-small-dcu required partition ${{ matrix.part }}/${{ matrix.parts }}"
          bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_exec.sh" -w /sglang-checkout/test --container-name "${DCU_CI_CONTAINER_NAME}" -- \
            python3 run_suite.py \
              --hw dcu \
              --suite stage-b-test-1-gpu-small-dcu \
              --include-file registered/dcu/interface/test_dcu_stage_b_flow_0.py \
              --include-file registered/dcu/interface/test_dcu_stage_b_flow_1.py \
              --include-file registered/unit/observability/test_metrics_utils.py \
              --include-file registered/unit/parser/test_harmony_parser.py \
              --include-file registered/unit/parser/test_jinja_template_utils.py \
              --include-file registered/unit/parser/test_reasoning_parser.py \
              --include-file registered/unit/server_args/test_server_args.py \
              --include-file registered/unit/entrypoints/openai/test_serving_embedding.py \
              --include-file registered/attention/test_triton_attention_kernels.py \
              --include-file registered/quant/test_triton_scaled_mm.py \
              --include-file registered/layers/mamba/test_mamba_ssm.py \
              --include-file registered/layers/mamba/test_mamba_ssm_ssd.py \
              --include-file registered/rl/test_fp32_lm_head.py \
              --include-file registered/embedding/test_input_embeddings.py \
              --include-file registered/embedding/test_openai_embedding.py \
              --include-file registered/vlm/test_evs.py \
              --include-file registered/openai_server/features/test_enable_thinking.py \
              --include-file registered/openai_server/features/test_reasoning_content.py \
              --include-file registered/attention/test_create_kvindices.py \
              --include-file registered/layers/mamba/test_causal_conv1d.py \
              --include-file registered/unit/managers/test_io_struct.py \
              --include-file registered/unit/managers/test_profile_merger_http_api.py \
              --include-file registered/unit/mem_cache/test_radix_cache_unit.py \
              --include-file registered/ops/test_repeat_interleave.py \
              --include-file registered/openai_server/features/test_openai_server_ebnf.py \
              --include-file registered/openai_server/basic/test_serving_completions.py \
              --include-file registered/openai_server/validation/test_large_max_new_tokens.py \
              --include-file registered/openai_server/validation/test_openai_server_ignore_eos.py \
              --include-file registered/sampling/test_original_logprobs.py \
              --include-file registered/openai_server/validation/test_request_length_validation.py \
              --include-file registered/sampling/test_pytorch_sampling_backend.py \
              --include-file registered/sampling/test_penalty.py \
              --include-file registered/core/test_hidden_states.py \
              --include-file registered/openai_server/basic/test_anthropic_server.py \
              --include-file registered/constrained_decoding/test_constrained_decoding.py \
              --include-file registered/openai_server/features/test_json_mode.py \
              --include-file registered/metrics/test_priority_metrics.py \
              --include-file registered/dcu/srt/bw1100/test_qwen25_0p5b_server_dcu.py \
              --auto-partition-id ${{ matrix.part }} \
              --auto-partition-size ${{ matrix.parts }} \
              --timeout-per-file ${{ matrix.timeout_per_file }} \
              ${{ needs.validate-config.outputs.continue_on_error_flag }}

      - name: Cleanup DCU container
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -Fxq "${DCU_CI_CONTAINER_NAME}"; then
            host_uid="$(id -u)"
            host_gid="$(id -g)"
            docker exec "${DCU_CI_CONTAINER_NAME}" bash -lc "chown -R ${host_uid}:${host_gid} /sglang-checkout || true" || true
            docker rm -f "${DCU_CI_CONTAINER_NAME}"
          fi

  pr-test-dcu-finish:
    name: PR Test (DCU) finish
    needs:
      - check-changes
      - call-gate
      - validate-config
      - wait-dcu-wheels
      - stage-a-test-1-gpu-small-dcu
      - stage-b-test-1-gpu-small-dcu
    if: always()
    runs-on: ${{ github.event_name == 'workflow_dispatch' && (inputs.runner_label || vars.DCU_CI_RUNNER_LABEL) || 'ubuntu-latest' }}
    steps:
      - name: Check all dependent job statuses
        run: |
          json_needs='${{ toJson(needs) }}'
          job_names=$(echo "${json_needs}" | jq -r 'keys_unsorted[]')

          for job in ${job_names}; do
            result=$(echo "${json_needs}" | jq -r --arg j "${job}" '.[$j].result')
            echo "${job}: ${result}"

            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done

          echo "All required DCU jobs completed successfully or were skipped."
