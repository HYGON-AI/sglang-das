name: PR Test (DCU)
run-name: ${{ (inputs.target_stage || inputs.target_stage_select) && (inputs.pr_head_sha && format('[{0}] {1}', inputs.target_stage || inputs.target_stage_select, inputs.pr_head_sha) || format('[{0}]', inputs.target_stage || inputs.target_stage_select)) || '' }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
    branches:
      - v0.5.12_dev
      - main
    paths:
      - ".github/workflows/pr-test-dcu.yml"
      - ".github/workflows/pr-gate.yml"
      - "scripts/ci/dcu/**"
      - "python/pyproject*.toml"
      - "python/sglang/**"
      - "test/run_suite.py"
      - "test/registered/**"
      - "sgl-kernel/**"
  workflow_dispatch:
    inputs:
      target_stage_select:
        description: "Select a DCU stage to run from dropdown (leave empty for all)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - stage-a-test-1-gpu-small-dcu
          - stage-b-test-1-gpu-small-dcu
      target_stage:
        description: "Or type comma-separated DCU stage names"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref, branch, tag, or SHA to test"
        required: false
        type: string
        default: ""
      pr_head_sha:
        description: "PR head SHA for reruns"
        required: false
        type: string
        default: ""
      runner_label:
        description: "DCU runner label override"
        required: false
        type: string
        default: ""
      image:
        description: "DCU CI container image override"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue running remaining files after a test failure"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Git ref, branch, tag, or SHA to test"
        required: false
        type: string
        default: ""
      run_all_tests:
        description: "Run all DCU PR tests"
        required: false
        type: boolean
        default: false
      runner_label:
        description: "DCU runner label override"
        required: false
        type: string
        default: ""
      image:
        description: "DCU CI container image override"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue running remaining files after a test failure"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-test-dcu-${{ github.event_name }}-${{ github.head_ref || github.ref_name || 'default' }}-${{ inputs.pr_head_sha || inputs.ref || 'current' }}-${{ inputs.target_stage || inputs.target_stage_select || 'all' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  check-changes:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      dcu: ${{ steps.filter.outputs.dcu || steps.run-mode.outputs.run_all_tests }}
      run_stage_a: ${{ steps.plan.outputs.run_stage_a }}
      run_stage_b: ${{ steps.plan.outputs.run_stage_b }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}

      - name: Determine run mode
        id: run-mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ALL_TESTS: ${{ inputs.run_all_tests || false }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${RUN_ALL_TESTS}" == "true" ]]; then
            echo "run_all_tests=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run_all_tests=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Detect DCU-relevant changes
        id: filter
        if: steps.run-mode.outputs.run_all_tests != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "${BASE_SHA}" ]]; then
            echo "dcu=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${BASE_SHA}" "${HEAD_SHA}"
          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "${changed_files}"

          if echo "${changed_files}" | grep -Eq '^(\.github/workflows/pr-test-dcu\.yml|\.github/workflows/pr-gate\.yml|scripts/ci/dcu/|python/pyproject.*\.toml|python/sglang/|test/run_suite\.py|python/sglang/test/ci/|test/registered/|sgl-kernel/)'; then
            echo "dcu=true" >> "${GITHUB_OUTPUT}"
          else
            echo "dcu=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Select DCU stages
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_STAGE: ${{ inputs.target_stage || inputs.target_stage_select || '' }}
        run: |
          if [[ "${EVENT_NAME}" != "workflow_dispatch" || -z "${TARGET_STAGE}" || "${TARGET_STAGE}" == "all" ]]; then
            echo "run_stage_a=true" >> "${GITHUB_OUTPUT}"
            echo "run_stage_b=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          requested=",${TARGET_STAGE},"
          run_stage_a=false
          run_stage_b=false

          if [[ "${requested}" == *",stage-a-test-1-gpu-small-dcu,"* ]]; then
            run_stage_a=true
          fi
          if [[ "${requested}" == *",stage-b-test-1-gpu-small-dcu,"* ]]; then
            run_stage_b=true
          fi

          if [[ "${run_stage_a}" == "false" && "${run_stage_b}" == "false" ]]; then
            echo "::error::Unknown DCU target_stage '${TARGET_STAGE}'."
            exit 1
          fi

          echo "run_stage_a=${run_stage_a}" >> "${GITHUB_OUTPUT}"
          echo "run_stage_b=${run_stage_b}" >> "${GITHUB_OUTPUT}"

  call-gate:
    name: Call PR gate
    needs: check-changes
    if: github.event_name == 'pull_request' && needs.check-changes.outputs.dcu == 'true'
    uses: ./.github/workflows/pr-gate.yml
    with:
      require-run-ci: true
      cool-down-minutes: 0
    secrets: inherit

  validate-config:
    name: Validate DCU config
    needs:
      - check-changes
      - call-gate
    if: always() && needs.check-changes.outputs.dcu == 'true' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      image: ${{ steps.resolve.outputs.image }}
      continue_on_error_flag: ${{ steps.resolve.outputs.continue_on_error_flag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}

      - name: Resolve DCU runner and image
        id: resolve
        env:
          INPUT_RUNNER_LABEL: ${{ inputs.runner_label || '' }}
          INPUT_IMAGE: ${{ inputs.image || '' }}
          VAR_RUNNER_LABEL: ${{ vars.DCU_CI_RUNNER_LABEL || '' }}
          VAR_IMAGE: ${{ vars.DCU_CI_IMAGE || '' }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error || false }}
        run: |
          runner_label="${INPUT_RUNNER_LABEL:-${VAR_RUNNER_LABEL}}"
          image="${INPUT_IMAGE:-${VAR_IMAGE}}"

          if [[ -z "${runner_label}" ]]; then
            echo "::error::DCU runner label is required. Set vars.DCU_CI_RUNNER_LABEL or workflow input runner_label."
            exit 1
          fi

          if [[ -z "${image}" ]]; then
            echo "::error::DCU CI image is required. Set vars.DCU_CI_IMAGE or workflow input image."
            exit 1
          fi

          continue_on_error_flag=""
          if [[ "${CONTINUE_ON_ERROR}" == "true" ]]; then
            continue_on_error_flag="--continue-on-error"
          fi

          echo "runner_label=${runner_label}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "continue_on_error_flag=${continue_on_error_flag}" >> "${GITHUB_OUTPUT}"

      - name: Verify DCU registration
        run: python3 scripts/ci/dcu/verify_dcu_registration.py

  stage-a-test-1-gpu-small-dcu:
    name: Stage A DCU smoke
    needs:
      - check-changes
      - call-gate
      - validate-config
    if: always() && needs.check-changes.outputs.dcu == 'true' && needs.check-changes.outputs.run_stage_a == 'true' && needs.validate-config.result == 'success' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped')
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    env:
      GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dcu-gitconfig
      DCU_CI_IMAGE: ${{ needs.validate-config.outputs.image }}
      DCU_CI_CONTAINER_NAME: ci_sglang_dcu_${{ github.run_id }}_stage_a
      DCU_CI_SKIP_PULL: ${{ vars.DCU_CI_SKIP_PULL || '' }}
      DCU_CI_SKIP_DEPENDENCY_INSTALL: ${{ vars.DCU_CI_SKIP_DEPENDENCY_INSTALL || '' }}
      DCU_CI_SKIP_REQUIREMENTS_INSTALL: ${{ vars.DCU_CI_SKIP_REQUIREMENTS_INSTALL || '' }}
      DCU_CI_SKIP_SGLANG_BUILD: ${{ vars.DCU_CI_SKIP_SGLANG_BUILD || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}

      - name: Setup DCU container
        run: bash scripts/ci/dcu/dcu_ci_start_container.sh --image "${DCU_CI_IMAGE}" --container-name "${DCU_CI_CONTAINER_NAME}"

      - name: Install dependencies
        run: bash scripts/ci/dcu/dcu_ci_install_dependency.sh

      - name: Run stage-a-test-1-gpu-small-dcu
        timeout-minutes: 30
        run: |
          bash scripts/ci/dcu/dcu_ci_exec.sh -w /sglang-checkout/test --container-name "${DCU_CI_CONTAINER_NAME}" -- \
            python3 run_suite.py \
              --hw dcu \
              --suite stage-a-test-1-gpu-small-dcu \
              --include-file registered/dcu/interface/test_dcu_smoke.py \
              --timeout-per-file 120 \
              ${{ needs.validate-config.outputs.continue_on_error_flag }}

      - name: Cleanup DCU container
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -Fxq "${DCU_CI_CONTAINER_NAME}"; then
            host_uid="$(id -u)"
            host_gid="$(id -g)"
            docker exec "${DCU_CI_CONTAINER_NAME}" bash -lc "chown -R ${host_uid}:${host_gid} /sglang-checkout || true" || true
            docker rm -f "${DCU_CI_CONTAINER_NAME}"
          fi

  stage-b-test-1-gpu-small-dcu:
    name: Stage B DCU smoke (${{ matrix.part }})
    needs:
      - check-changes
      - call-gate
      - validate-config
      - stage-a-test-1-gpu-small-dcu
    if: always() && needs.check-changes.outputs.dcu == 'true' && needs.check-changes.outputs.run_stage_b == 'true' && needs.validate-config.result == 'success' && (needs.stage-a-test-1-gpu-small-dcu.result == 'success' || needs.stage-a-test-1-gpu-small-dcu.result == 'skipped') && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped')
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: [0, 1]
    env:
      GIT_CONFIG_GLOBAL: ${{ runner.temp }}/dcu-gitconfig
      DCU_CI_IMAGE: ${{ needs.validate-config.outputs.image }}
      DCU_CI_CONTAINER_NAME: ci_sglang_dcu_${{ github.run_id }}_stage_b_${{ matrix.part }}
      DCU_CI_SKIP_PULL: ${{ vars.DCU_CI_SKIP_PULL || '' }}
      DCU_CI_SKIP_DEPENDENCY_INSTALL: ${{ vars.DCU_CI_SKIP_DEPENDENCY_INSTALL || '' }}
      DCU_CI_SKIP_REQUIREMENTS_INSTALL: ${{ vars.DCU_CI_SKIP_REQUIREMENTS_INSTALL || '' }}
      DCU_CI_SKIP_SGLANG_BUILD: ${{ vars.DCU_CI_SKIP_SGLANG_BUILD || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}

      - name: Setup DCU container
        run: bash scripts/ci/dcu/dcu_ci_start_container.sh --image "${DCU_CI_IMAGE}" --container-name "${DCU_CI_CONTAINER_NAME}"

      - name: Install dependencies
        run: bash scripts/ci/dcu/dcu_ci_install_dependency.sh

      - name: Run stage-b-test-1-gpu-small-dcu partition
        timeout-minutes: 30
        run: |
          echo "Running stage-b-test-1-gpu-small-dcu partition ${{ matrix.part }}/2"
          bash scripts/ci/dcu/dcu_ci_exec.sh -w /sglang-checkout/test --container-name "${DCU_CI_CONTAINER_NAME}" -- \
            python3 run_suite.py \
              --hw dcu \
              --suite stage-b-test-1-gpu-small-dcu \
              --include-file registered/dcu/interface/test_dcu_stage_b_flow_0.py \
              --include-file registered/dcu/interface/test_dcu_stage_b_flow_1.py \
              --auto-partition-id ${{ matrix.part }} \
              --auto-partition-size 2 \
              --timeout-per-file 120 \
              ${{ needs.validate-config.outputs.continue_on_error_flag }}

      - name: Cleanup DCU container
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -Fxq "${DCU_CI_CONTAINER_NAME}"; then
            host_uid="$(id -u)"
            host_gid="$(id -g)"
            docker exec "${DCU_CI_CONTAINER_NAME}" bash -lc "chown -R ${host_uid}:${host_gid} /sglang-checkout || true" || true
            docker rm -f "${DCU_CI_CONTAINER_NAME}"
          fi

  pr-test-dcu-finish:
    name: PR Test (DCU) finish
    needs:
      - check-changes
      - call-gate
      - validate-config
      - stage-a-test-1-gpu-small-dcu
      - stage-b-test-1-gpu-small-dcu
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        run: |
          json_needs='${{ toJson(needs) }}'
          job_names=$(echo "${json_needs}" | jq -r 'keys_unsorted[]')

          for job in ${job_names}; do
            result=$(echo "${json_needs}" | jq -r --arg j "${job}" '.[$j].result')
            echo "${job}: ${result}"

            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done

          echo "All required DCU jobs completed successfully or were skipped."
