name: PR Test (DCU)
run-name: ${{ (inputs.target_stage || inputs.target_stage_select) && (inputs.pr_head_sha && format('[{0}] {1}', inputs.target_stage || inputs.target_stage_select, inputs.pr_head_sha) || format('[{0}]', inputs.target_stage || inputs.target_stage_select)) || '' }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
    branches:
      - v0.5.12_dev
      - dcu-ci-pr
      - main
    paths:
      - ".github/workflows/pr-test-dcu.yml"
      - ".github/workflows/pr-gate.yml"
      - ".github/workflows/release-pr-dcu.yml"
      - ".github/workflows/dcu-full-enabled.yml"
      - ".github/workflows/release-pypi-nightky-dcu.yml"
      - "scripts/ci/dcu/**"
      - "python/pyproject*.toml"
      - "python/sglang/**"
      - "test/run_suite.py"
      - "test/registered/**"
      - "sgl-kernel/**"
      - "sgl-model-gateway/**"
      - "requirements_dcu.txt"
  workflow_dispatch:
    inputs:
      target_stage_select:
        description: "Select a DCU stage to run from dropdown (leave empty for all)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - stage-a-test-1-gpu-small-dcu
          - stage-b-test-1-gpu-small-dcu
      target_stage:
        description: "Or type comma-separated DCU stage names"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref, branch, tag, or SHA to test"
        required: false
        type: string
        default: ""
      pr_head_sha:
        description: "PR head SHA for reruns"
        required: false
        type: string
        default: ""
      runner_label:
        description: "DCU runner label override"
        required: false
        type: string
        default: ""
      image:
        description: "DCU CI container image override"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue running remaining files after a test failure"
        required: false
        type: boolean
        default: false
      force_wheel_mode:
        description: "Force waiting for and installing DCU wheels"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Git ref, branch, tag, or SHA to test"
        required: false
        type: string
        default: ""
      run_all_tests:
        description: "Run all DCU PR tests"
        required: false
        type: boolean
        default: false
      runner_label:
        description: "DCU runner label override"
        required: false
        type: string
        default: ""
      image:
        description: "DCU CI container image override"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue running remaining files after a test failure"
        required: false
        type: boolean
        default: false
      force_wheel_mode:
        description: "Force waiting for and installing DCU wheels"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-test-dcu-${{ github.event_name }}-${{ github.head_ref || github.ref_name || 'default' }}-${{ inputs.pr_head_sha || inputs.ref || 'current' }}-${{ inputs.target_stage || inputs.target_stage_select || 'all' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  check-changes:
    name: Check changes
    runs-on: ${{ inputs.runner_label || vars.DCU_CI_RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      dcu: ${{ steps.filter.outputs.dcu || steps.run-mode.outputs.run_all_tests }}
      auto_run_ci: ${{ steps.filter.outputs.auto_run_ci || 'false' }}
      run_stage_a: ${{ steps.plan.outputs.run_stage_a }}
      run_stage_b: ${{ steps.plan.outputs.run_stage_b }}
      wheel_required: ${{ steps.wheel.outputs.wheel_required }}
      gateway_wheel_required: ${{ steps.wheel.outputs.gateway_wheel_required }}
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_dispatch'
        env:
          CHECKOUT_REF: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-check"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Determine run mode
        id: run-mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ALL_TESTS: ${{ inputs.run_all_tests || false }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${RUN_ALL_TESTS}" == "true" ]]; then
            echo "run_all_tests=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run_all_tests=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Detect DCU-relevant changes
        id: filter
        if: steps.run-mode.outputs.run_all_tests != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd "${DCU_CI_CHECKOUT_DIR}"
          if [[ -z "${BASE_SHA}" ]]; then
            echo "dcu=true" >> "${GITHUB_OUTPUT}"
            echo "auto_run_ci=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "${changed_files}"

          dcu_path_pattern='^(\.github/workflows/(pr-test-dcu|pr-gate|release-pr-dcu|dcu-full-enabled|release-pypi-nightky-dcu)\.yml|scripts/ci/dcu/|python/pyproject.*\.toml|python/sglang/|test/run_suite\.py|python/sglang/test/ci/|test/registered/|sgl-kernel/|sgl-model-gateway/|requirements_dcu\.txt$)'

          if echo "${changed_files}" | grep -Eq "${dcu_path_pattern}"; then
            echo "dcu=true" >> "${GITHUB_OUTPUT}"
            echo "auto_run_ci=true" >> "${GITHUB_OUTPUT}"
          else
            echo "dcu=false" >> "${GITHUB_OUTPUT}"
            echo "auto_run_ci=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Select DCU stages
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_STAGE: ${{ inputs.target_stage || inputs.target_stage_select || '' }}
        run: |
          if [[ "${EVENT_NAME}" != "workflow_dispatch" || -z "${TARGET_STAGE}" || "${TARGET_STAGE}" == "all" ]]; then
            echo "run_stage_a=true" >> "${GITHUB_OUTPUT}"
            echo "run_stage_b=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          requested=",${TARGET_STAGE},"
          run_stage_a=false
          run_stage_b=false

          if [[ "${requested}" == *",stage-a-test-1-gpu-small-dcu,"* ]]; then
            run_stage_a=true
          fi
          if [[ "${requested}" == *",stage-b-test-1-gpu-small-dcu,"* ]]; then
            run_stage_b=true
          fi

          if [[ "${run_stage_a}" == "false" && "${run_stage_b}" == "false" ]]; then
            echo "::error::Unknown DCU target_stage '${TARGET_STAGE}'."
            exit 1
          fi

          echo "run_stage_a=${run_stage_a}" >> "${GITHUB_OUTPUT}"
          echo "run_stage_b=${run_stage_b}" >> "${GITHUB_OUTPUT}"

      - name: Classify DCU wheel sync mode
        id: wheel
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_WHEEL_MODE: ${{ inputs.force_wheel_mode || false }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "${FORCE_WHEEL_MODE}" == "true" ]]; then
            echo "wheel_required=true" >> "${GITHUB_OUTPUT}"
            echo "gateway_wheel_required=false" >> "${GITHUB_OUTPUT}"
            echo "Wheel mode forced by workflow input."
            exit 0
          fi

          if [[ "${EVENT_NAME}" != "pull_request" || -z "${BASE_SHA}" ]]; then
            echo "wheel_required=false" >> "${GITHUB_OUTPUT}"
            echo "gateway_wheel_required=false" >> "${GITHUB_OUTPUT}"
            echo "Wheel mode disabled for non-PR run without force_wheel_mode."
            exit 0
          fi

          cd "${DCU_CI_CHECKOUT_DIR:-${GITHUB_WORKSPACE}}"

          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "${changed_files}"

          wheel_required=false
          gateway_wheel_required=false

          if echo "${changed_files}" | grep -Eq '^(\.github/workflows/release-pr-dcu\.yml$|sgl-kernel/|requirements_dcu\.txt$|python/pyproject.*\.toml|python/sglang/)'; then
            wheel_required=true
          fi

          if echo "${changed_files}" | grep -Eq '^sgl-model-gateway/'; then
            wheel_required=true
            gateway_wheel_required=true
          fi

          echo "wheel_required=${wheel_required}" >> "${GITHUB_OUTPUT}"
          echo "gateway_wheel_required=${gateway_wheel_required}" >> "${GITHUB_OUTPUT}"
          echo "wheel_required=${wheel_required}, gateway_wheel_required=${gateway_wheel_required}"

  call-gate:
    name: Call PR gate
    needs: check-changes
    if: github.event_name == 'pull_request' && needs.check-changes.outputs.dcu == 'true'
    runs-on: ${{ inputs.runner_label || vars.DCU_CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Fetch latest PR info
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput("labels", JSON.stringify(pr.data.labels.map(l => l.name)));
            core.setOutput("draft", pr.data.draft);
            core.setOutput("user", pr.data.user.login);

      - name: Log PR info
        run: |
          echo "===== DCU PR Gate Info ====="
          echo "PR Event: ${{ github.event_name }}"
          echo "PR Labels: ${{ steps.pr.outputs.labels }}"
          echo "PR Draft: ${{ steps.pr.outputs.draft }}"
          echo "PR User: ${{ steps.pr.outputs.user }}"
          echo "Require run-ci: true"
          echo "Auto run DCU CI: ${{ needs.check-changes.outputs.auto_run_ci }}"
          echo "============================"

      - name: Block draft PR
        if: fromJson(steps.pr.outputs.draft)
        run: |
          echo "PR is draft. Blocking DCU CI."
          exit 1

      - name: Require run-ci label or DCU auto-run
        env:
          AUTO_RUN_CI: ${{ needs.check-changes.outputs.auto_run_ci || 'false' }}
          HAS_RUN_CI_LABEL: ${{ contains(fromJson(steps.pr.outputs.labels), 'run-ci') }}
        run: |
          if [[ "${HAS_RUN_CI_LABEL}" == "true" ]]; then
            echo "Found run-ci label. Proceeding with DCU CI."
            exit 0
          fi

          if [[ "${AUTO_RUN_CI}" == "true" ]]; then
            echo "Auto-run DCU CI because DCU-impact paths changed."
            exit 0
          fi

          echo "Missing required label 'run-ci'. See https://docs.sglang.io/developer_guide/contribution_guide.html#how-to-trigger-ci-tests for more details."
          exit 1

  validate-config:
    name: Validate DCU config
    needs:
      - check-changes
      - call-gate
    if: always() && needs.check-changes.outputs.dcu == 'true' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped')
    runs-on: ${{ inputs.runner_label || vars.DCU_CI_RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      image: ${{ steps.resolve.outputs.image }}
      continue_on_error_flag: ${{ steps.resolve.outputs.continue_on_error_flag }}
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_dispatch'
        env:
          CHECKOUT_REF: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-validate"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Checkout code for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CHECKOUT_REF: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-validate"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Resolve DCU runner and image
        id: resolve
        env:
          INPUT_RUNNER_LABEL: ${{ inputs.runner_label || '' }}
          INPUT_IMAGE: ${{ inputs.image || '' }}
          VAR_RUNNER_LABEL: ${{ vars.DCU_CI_RUNNER_LABEL || '' }}
          VAR_IMAGE: ${{ vars.DCU_CI_IMAGE || '' }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error || false }}
        run: |
          runner_label="${INPUT_RUNNER_LABEL:-${VAR_RUNNER_LABEL}}"
          image="${INPUT_IMAGE:-${VAR_IMAGE}}"

          if [[ -z "${runner_label}" ]]; then
            echo "::error::DCU runner label is required. Set vars.DCU_CI_RUNNER_LABEL or workflow input runner_label."
            exit 1
          fi

          if [[ -z "${image}" ]]; then
            echo "::error::DCU CI image is required. Set vars.DCU_CI_IMAGE or workflow input image."
            exit 1
          fi

          continue_on_error_flag=""
          if [[ "${CONTINUE_ON_ERROR}" == "true" ]]; then
            continue_on_error_flag="--continue-on-error"
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            continue_on_error_flag="--continue-on-error"
          fi

          echo "runner_label=${runner_label}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "continue_on_error_flag=${continue_on_error_flag}" >> "${GITHUB_OUTPUT}"

      - name: Verify DCU registration
        if: github.event_name != 'workflow_dispatch'
        run: |
          cd "${DCU_CI_CHECKOUT_DIR}"
          python3.9 scripts/ci/dcu/verify_dcu_registration.py || python3 scripts/ci/dcu/verify_dcu_registration.py

      - name: Setup DCU validation container
        if: github.event_name == 'workflow_dispatch'
        env:
          DCU_CI_IMAGE: ${{ steps.resolve.outputs.image }}
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_${{ github.run_id }}_validate
          DCU_CI_SKIP_PULL: ${{ vars.DCU_CI_SKIP_PULL || '' }}
          DCU_CI_VISIBLE_DEVICES: ${{ vars.DCU_CI_VISIBLE_DEVICES || '' }}
        run: |
          GITHUB_WORKSPACE="${DCU_CI_CHECKOUT_DIR}" \
            bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_start_container.sh" \
              --image "${DCU_CI_IMAGE}" \
              --container-name "${DCU_CI_CONTAINER_NAME}"

      - name: Verify DCU registration in container
        if: github.event_name == 'workflow_dispatch'
        env:
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_${{ github.run_id }}_validate
        run: |
          bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_exec.sh" \
            --container-name "${DCU_CI_CONTAINER_NAME}" \
            -w /sglang-checkout \
            -- python3 scripts/ci/dcu/verify_dcu_registration.py

      - name: Cleanup DCU validation container
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_${{ github.run_id }}_validate
        run: bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_cleanup_container.sh"

  wait-dcu-wheels:
    name: Wait DCU wheels
    needs:
      - check-changes
      - call-gate
      - validate-config
    if: always() && needs.check-changes.outputs.dcu == 'true' && needs.check-changes.outputs.wheel_required == 'true' && needs.validate-config.result == 'success' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped')
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    outputs:
      wheel_paths: ${{ steps.wait.outputs.wheel_paths }}
      staging_dir: ${{ steps.wait.outputs.staging_dir }}
    env:
      CHECKOUT_REF: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      GATEWAY_WHEEL_REQUIRED: ${{ needs.check-changes.outputs.gateway_wheel_required }}
      DCU_CI_WHEEL_STAGING_HOST: ${{ vars.DCU_CI_WHEEL_STAGING_HOST || '/home/github/sgl_whl_temp' }}
      DCU_CI_WHEEL_STAGING_CONTAINER: ${{ vars.DCU_CI_WHEEL_STAGING_CONTAINER || '/dcu-wheel-staging' }}
    steps:
      - name: Checkout code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-wait-wheels"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf "x-access-token:%s" "${GH_TOKEN}" | base64 | tr -d "\n")"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Resolve wheel target SHA
        id: sha
        run: |
          set -euo pipefail
          full_sha="$(git -C "${DCU_CI_CHECKOUT_DIR}" rev-parse HEAD)"
          short_sha="$(git -C "${DCU_CI_CHECKOUT_DIR}" rev-parse --short=12 HEAD)"
          echo "full_sha=${full_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "Using wheel SHA: ${full_sha} (${short_sha})"

      - name: Wait for current commit local DCU wheels
        id: wait
        env:
          CHECKOUT_FULL_SHA: ${{ steps.sha.outputs.full_sha }}
          CHECKOUT_SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          set -euo pipefail
          echo "Waiting for local DCU wheels with g${CHECKOUT_SHORT_SHA} under ${DCU_CI_WHEEL_STAGING_HOST}"

          python3 - <<'PY_WAIT'
          import json
          import os
          import sys
          import time
          from pathlib import Path, PurePosixPath

          staging_root = Path(os.environ["DCU_CI_WHEEL_STAGING_HOST"])
          container_root = PurePosixPath(os.environ.get("DCU_CI_WHEEL_STAGING_CONTAINER", "/dcu-wheel-staging"))
          repo_key = os.environ["GITHUB_REPOSITORY"].replace("/", "_").replace(":", "_")
          full_sha = os.environ["CHECKOUT_FULL_SHA"]
          short_sha = os.environ["CHECKOUT_SHORT_SHA"][:12]
          pr_number = os.environ.get("PR_NUMBER", "")
          gateway_required = os.environ.get("GATEWAY_WHEEL_REQUIRED", "false") == "true"
          timeout_s = int(os.environ.get("DCU_WHEEL_WAIT_TIMEOUT", "3600"))
          interval_s = int(os.environ.get("DCU_WHEEL_WAIT_INTERVAL", "60"))
          repo_dir = staging_root / repo_key

          def candidate_dirs():
              seen = set()
              if pr_number:
                  path = repo_dir / f"pr-{pr_number}" / full_sha
                  seen.add(path)
                  yield path
              if repo_dir.exists():
                  for path in sorted(repo_dir.glob(f"*/{full_sha}")):
                      if path not in seen:
                          yield path

          def match_wheel(wheels, kind):
              marker = f"g{short_sha}"
              for wheel in wheels:
                  filename = wheel.name
                  normalized = filename.replace("-", "_")
                  if not filename.endswith(".whl") or marker not in filename:
                      continue
                  if kind == "sglang" and normalized.startswith("sglang_") and not normalized.startswith(("sglang_kernel_", "sgl_kernel_")):
                      return wheel
                  if kind == "sgl-kernel" and normalized.startswith(("sgl_kernel_", "sglang_kernel_")):
                      return wheel
                  if kind == "sgl-model-gateway" and normalized.startswith("sgl_model_gateway_"):
                      return wheel
              return None

          requirements = ["sglang", "sgl-kernel"]
          if gateway_required:
              requirements.append("sgl-model-gateway")

          deadline = time.time() + timeout_s
          last_status = ""
          while time.time() < deadline:
              for staging_dir in candidate_dirs():
                  ready = staging_dir / "READY"
                  manifest_path = staging_dir / "manifest.json"
                  wheels_dir = staging_dir / "wheels"
                  if not ready.exists() or not manifest_path.exists() or not wheels_dir.is_dir():
                      last_status = f"{staging_dir} is not ready"
                      continue
                  try:
                      manifest = json.loads(manifest_path.read_text())
                  except Exception as exc:
                      last_status = f"failed to read {manifest_path}: {exc}"
                      continue
                  if manifest.get("head_sha") != full_sha:
                      last_status = f"{manifest_path} head_sha mismatch: {manifest.get('head_sha')}"
                      continue

                  wheels = sorted(wheels_dir.glob("*.whl"))
                  found = {name: match_wheel(wheels, name) for name in requirements}
                  missing = [name for name, wheel in found.items() if wheel is None]
                  if missing:
                      last_status = f"{staging_dir} missing wheels: {missing}"
                      continue

                  ordered = [found[name] for name in requirements]
                  container_paths = []
                  for wheel in ordered:
                      rel = wheel.relative_to(staging_root)
                      container_paths.append(str(container_root / PurePosixPath(rel.as_posix())))

                  output_path = Path(os.environ["GITHUB_OUTPUT"])
                  with output_path.open("a") as out:
                      out.write(f"wheel_paths={' '.join(container_paths)}\n")
                      out.write(f"staging_dir={staging_dir}\n")
                  print(f"[wait-dcu-wheels] found local wheels: {' '.join(container_paths)}")
                  print(f"[wait-dcu-wheels] staging dir: {staging_dir}")
                  sys.exit(0)

              print(f"[wait-dcu-wheels] {last_status or 'staged wheels not found'}; sleep {interval_s}s", file=sys.stderr)
              time.sleep(interval_s)

          print(f"Timed out waiting for local DCU wheels for {full_sha}; last_status={last_status}", file=sys.stderr)
          sys.exit(1)
          PY_WAIT

  stage-a-test-1-gpu-small-dcu:
    name: Stage A DCU smoke
    needs:
      - check-changes
      - call-gate
      - validate-config
      - wait-dcu-wheels
    if: always() && needs.check-changes.outputs.dcu == 'true' && needs.check-changes.outputs.run_stage_a == 'true' && needs.validate-config.result == 'success' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped') && (needs.wait-dcu-wheels.result == 'success' || needs.wait-dcu-wheels.result == 'skipped')
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
