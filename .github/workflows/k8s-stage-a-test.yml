name: HCU K8s Stage A/B comparison (test branch only)

# Runs the Stage A smoke and Stage B required test files file-by-file with the
# same scripts on two environments:
#   k8s    : ARC K8s pool hygon-bw1100-1card (HCU_CI_IN_K8S=1 from the job template)
#   legacy : existing [ci, bw1100] runners with the original docker flow
# then compares the per-file results. run_suite.py is not used because on main it
# currently stops at its registry sanity check (test_channel_fp8_activation_clamp.py).
# Triggered only by changes to .github/k8s-test/trigger on the test branch.

on:
  push:
    branches: [test/k8s-runner-20261108]
    paths: [.github/k8s-test/trigger]

permissions:
  contents: read

concurrency:
  group: hcu-k8s-stage-a
  cancel-in-progress: false

env:
  HCU_CI_IMAGE: 10.16.1.152:5000/jenkins/model_test_env/sglang:0.5.18-latest
  HCU_CI_SKIP_PULL: ${{ vars.HCU_CI_SKIP_PULL || '' }}
  HCU_CI_SKIP_DEPENDENCY_INSTALL: ${{ vars.HCU_CI_SKIP_DEPENDENCY_INSTALL || '' }}
  HCU_CI_SKIP_REQUIREMENTS_INSTALL: ${{ vars.HCU_CI_SKIP_REQUIREMENTS_INSTALL || '' }}
  HCU_CI_SKIP_SGLANG_BUILD: ${{ vars.HCU_CI_SKIP_SGLANG_BUILD || '' }}
  HCU_WHEEL_STAGING_ROOT: /ci_public/sglang-das/hcu-wheel-staging
  HCU_WHEEL_STAGING_CONTAINER_ROOT: /hcu-wheel-staging

jobs:
  k8s:
    if: github.repository == 'HYGON-AI/sglang-das' && github.ref == 'refs/heads/test/k8s-runner-20261108'
    name: Stage A/B files (K8s hygon-bw1100-1card)
    runs-on: hygon-bw1100-1card
    timeout-minutes: 120
    container:
      image: 10.16.1.152:5000/jenkins/model_test_env/sglang:0.5.18-latest
    env:
      HCU_CI_CONTAINER_NAME: ci_sglang_hcu_${{ github.run_id }}_k8s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Show allocation
        run: |
          echo "HCU_CI_CHECKOUT_DIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "node=${NODE_NAME:-} HCU_CI_IN_K8S=${HCU_CI_IN_K8S:-} nproc=$(nproc)"
          ls /dev/dri | grep renderD || true
          python3 -c "import torch; print('torch', torch.__version__, 'devices', torch.cuda.device_count())"
      - name: Setup HCU container
        run: |
          GITHUB_WORKSPACE="${HCU_CI_CHECKOUT_DIR}" bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_start_container.sh" \
            --image "${HCU_CI_IMAGE}" --container-name "${HCU_CI_CONTAINER_NAME}"
      - name: Install dependencies
        run: bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_install_dependency.sh"
      - name: Verify HCU external APIs
        run: |
          bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_exec.sh" -w /sglang-checkout --container-name "${HCU_CI_CONTAINER_NAME}" -- \
            python3 scripts/ci/hcu/check_hcu_external_api_compat.py
      - name: Run Stage A/B test files
        run: bash .github/k8s-test/run_stage_files.sh "${RUNNER_TEMP}/results-k8s.tsv"
      - name: Cleanup HCU container
        if: always()
        run: bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_cleanup_container.sh"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: results-k8s, path: '${{ runner.temp }}/results-k8s.tsv*', retention-days: 7, if-no-files-found: warn}

  legacy:
    if: github.repository == 'HYGON-AI/sglang-das' && github.ref == 'refs/heads/test/k8s-runner-20261108'
    name: Stage A/B files (legacy ci bw1100)
    runs-on: [ci, bw1100]
    timeout-minutes: 120
    env:
      HCU_CI_CONTAINER_NAME: ci_sglang_hcu_${{ github.run_id }}_legacy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Show runner
        run: |
          echo "HCU_CI_CHECKOUT_DIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "runner=${RUNNER_NAME} HCU_CI_IN_K8S=${HCU_CI_IN_K8S:-unset}"
      - name: Setup HCU container
        run: |
          GITHUB_WORKSPACE="${HCU_CI_CHECKOUT_DIR}" bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_start_container.sh" \
            --image "${HCU_CI_IMAGE}" --container-name "${HCU_CI_CONTAINER_NAME}"
      - name: Install dependencies
        run: bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_install_dependency.sh"
      - name: Verify HCU external APIs
        run: |
          bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_exec.sh" -w /sglang-checkout --container-name "${HCU_CI_CONTAINER_NAME}" -- \
            python3 scripts/ci/hcu/check_hcu_external_api_compat.py
      - name: Run Stage A/B test files
        run: bash .github/k8s-test/run_stage_files.sh "${RUNNER_TEMP}/results-legacy.tsv"
      - name: Cleanup HCU container
        if: always()
        run: bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_cleanup_container.sh"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: results-legacy, path: '${{ runner.temp }}/results-legacy.tsv*', retention-days: 7, if-no-files-found: warn}
