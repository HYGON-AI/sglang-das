name: Lint (HCU)

permissions:
  contents: read

on:
  push:
    branches: [main, v0.5.12_dev]
  pull_request_target:

jobs:
  lint-hcu:
    runs-on: [self-hosted, hcu, nmz4]
    timeout-minutes: 30

    container:
      image: ${{ vars.HCU_CI_RELEASE_IMAGE }}

    env:
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      PIP_TRUSTED_HOST: mirrors.aliyun.com

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Fetch PR base revision
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags "https://github.com/${BASE_REPOSITORY}.git" "${BASE_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"

      - name: Install pre-commit hook
        run: |
          python -m pip install pre-commit
          pre-commit install

      - name: Run pre-commit checks (PR diff only)
        if: github.event_name == 'pull_request_target'
        run: |
          SKIP=no-commit-to-branch pre-commit run \
            --from-ref ${{ github.event.pull_request.base.sha }} \
            --to-ref HEAD \
            --show-diff-on-failure

      - name: Run pre-commit checks (all files on push)
        if: github.event_name == 'push'
        run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure
