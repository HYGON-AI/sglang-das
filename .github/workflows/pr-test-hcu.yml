name: PR Test (HCU)
run-name: ${{ (inputs.target_stage || inputs.target_stage_select) && (inputs.pr_head_sha && format('[{0}] {1}', inputs.target_stage || inputs.target_stage_select, inputs.pr_head_sha) || format('[{0}]', inputs.target_stage || inputs.target_stage_select)) || '' }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
    branches:
      - v0.5.12_dev
      - hcu-ci-pr
      - main
    paths:
      - ".github/workflows/pr-test-hcu.yml"
      - ".github/workflows/pr-gate.yml"
      - ".github/workflows/release-pr-hcu.yml"
      - ".github/workflows/hcu-full-enabled.yml"
      - ".github/workflows/release-pypi-nightly-hcu.yml"
      - "scripts/ci/hcu/**"
      - "python/pyproject*.toml"
      - "python/sglang/**"
      - "test/run_suite.py"
      - "test/registered/**"
      - "sgl-kernel/**"
      - "sgl-model-gateway/**"
      - "requirements_hcu.txt"
  workflow_dispatch:
    inputs:
      target_stage_select:
        description: "Select a HCU stage to run from dropdown (leave empty for all)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - stage-a-test-1-gpu-small-hcu
          - stage-b-test-1-gpu-small-hcu
      target_stage:
        description: "Or type comma-separated HCU stage names"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref, branch, tag, or SHA to test"
        required: false
        type: string
        default: ""
      pr_head_sha:
        description: "PR head SHA for reruns"
        required: false
        type: string
        default: ""
      runner_label:
        description: "HCU runner label override"
        required: false
        type: string
        default: ""
      image:
        description: "HCU CI container image override"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue running remaining files after a test failure"
        required: false
        type: boolean
        default: false
      force_wheel_mode:
        description: "Force waiting for and installing HCU wheels"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Git ref, branch, tag, or SHA to test"
        required: false
        type: string
        default: ""
      run_all_tests:
        description: "Run all HCU PR tests"
        required: false
        type: boolean
        default: false
      runner_label:
        description: "HCU runner label override"
        required: false
        type: string
        default: ""
      image:
        description: "HCU CI container image override"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue running remaining files after a test failure"
        required: false
        type: boolean
        default: false
      force_wheel_mode:
        description: "Force waiting for and installing HCU wheels"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-test-hcu-${{ github.event_name }}-${{ github.head_ref || github.ref_name || 'default' }}-${{ inputs.pr_head_sha || inputs.ref || 'current' }}-${{ inputs.target_stage || inputs.target_stage_select || 'all' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  check-changes:
    name: Check changes
    runs-on: ${{ inputs.runner_label || vars.HCU_CI_RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      hcu: ${{ steps.filter.outputs.hcu || steps.run-mode.outputs.run_all_tests }}
      auto_run_ci: ${{ steps.filter.outputs.auto_run_ci || 'false' }}
      run_stage_a: ${{ steps.plan.outputs.run_stage_a }}
      run_stage_b: ${{ steps.plan.outputs.run_stage_b }}
      wheel_required: ${{ steps.wheel.outputs.wheel_required }}
      gateway_wheel_required: ${{ steps.wheel.outputs.gateway_wheel_required }}
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_dispatch'
        env:
          CHECKOUT_REF: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/hcu-sglang-${GITHUB_RUN_ID}-check"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "HCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Determine run mode
        id: run-mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ALL_TESTS: ${{ inputs.run_all_tests || false }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${RUN_ALL_TESTS}" == "true" ]]; then
            echo "run_all_tests=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run_all_tests=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Detect HCU-relevant changes
        id: filter
        if: steps.run-mode.outputs.run_all_tests != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd "${HCU_CI_CHECKOUT_DIR}"
          if [[ -z "${BASE_SHA}" ]]; then
            echo "hcu=true" >> "${GITHUB_OUTPUT}"
            echo "auto_run_ci=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "${changed_files}"

          hcu_path_pattern='^(\.github/workflows/(pr-test-hcu|pr-gate|release-pr-hcu|hcu-full-enabled|release-pypi-nightly-hcu)\.yml|scripts/ci/hcu/|python/pyproject.*\.toml|python/sglang/|test/run_suite\.py|python/sglang/test/ci/|test/registered/|sgl-kernel/|sgl-model-gateway/|requirements_hcu\.txt$)'

          if echo "${changed_files}" | grep -Eq "${hcu_path_pattern}"; then
            echo "hcu=true" >> "${GITHUB_OUTPUT}"
            echo "auto_run_ci=true" >> "${GITHUB_OUTPUT}"
          else
            echo "hcu=false" >> "${GITHUB_OUTPUT}"
            echo "auto_run_ci=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Select HCU stages
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_STAGE: ${{ inputs.target_stage || inputs.target_stage_select || '' }}
        run: |
          if [[ "${EVENT_NAME}" != "workflow_dispatch" || -z "${TARGET_STAGE}" || "${TARGET_STAGE}" == "all" ]]; then
            echo "run_stage_a=true" >> "${GITHUB_OUTPUT}"
            echo "run_stage_b=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          requested=",${TARGET_STAGE},"
          run_stage_a=false
          run_stage_b=false

          if [[ "${requested}" == *",stage-a-test-1-gpu-small-hcu,"* ]]; then
            run_stage_a=true
          fi
          if [[ "${requested}" == *",stage-b-test-1-gpu-small-hcu,"* ]]; then
            run_stage_b=true
          fi

          if [[ "${run_stage_a}" == "false" && "${run_stage_b}" == "false" ]]; then
            echo "::error::Unknown HCU target_stage '${TARGET_STAGE}'."
            exit 1
          fi

          echo "run_stage_a=${run_stage_a}" >> "${GITHUB_OUTPUT}"
          echo "run_stage_b=${run_stage_b}" >> "${GITHUB_OUTPUT}"

      - name: Classify HCU wheel sync mode
        id: wheel
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_WHEEL_MODE: ${{ inputs.force_wheel_mode || false }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "${FORCE_WHEEL_MODE}" == "true" ]]; then
            echo "wheel_required=true" >> "${GITHUB_OUTPUT}"
            echo "gateway_wheel_required=false" >> "${GITHUB_OUTPUT}"
            echo "Wheel mode forced by workflow input."
            exit 0
          fi

          if [[ "${EVENT_NAME}" != "pull_request" || -z "${BASE_SHA}" ]]; then
            echo "wheel_required=false" >> "${GITHUB_OUTPUT}"
            echo "gateway_wheel_required=false" >> "${GITHUB_OUTPUT}"
            echo "Wheel mode disabled for non-PR run without force_wheel_mode."
            exit 0
          fi

          cd "${HCU_CI_CHECKOUT_DIR:-${GITHUB_WORKSPACE}}"

          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "${changed_files}"

          wheel_required=false
          gateway_wheel_required=false

          if echo "${changed_files}" | grep -Eq '^(\.github/workflows/release-pr-hcu\.yml$|sgl-kernel/|requirements_hcu\.txt$|python/pyproject.*\.toml|python/sglang/)'; then
            wheel_required=true
          fi

          if echo "${changed_files}" | grep -Eq '^sgl-model-gateway/'; then
            wheel_required=true
            gateway_wheel_required=true
          fi

          echo "wheel_required=${wheel_required}" >> "${GITHUB_OUTPUT}"
          echo "gateway_wheel_required=${gateway_wheel_required}" >> "${GITHUB_OUTPUT}"
          echo "wheel_required=${wheel_required}, gateway_wheel_required=${gateway_wheel_required}"

  call-gate:
    name: Call PR gate
    needs: check-changes
    if: github.event_name == 'pull_request' && needs.check-changes.outputs.hcu == 'true'
    runs-on: ${{ inputs.runner_label || vars.HCU_CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Fetch latest PR info
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput("labels", JSON.stringify(pr.data.labels.map(l => l.name)));
            core.setOutput("draft", pr.data.draft);
            core.setOutput("user", pr.data.user.login);

      - name: Log PR info
        run: |
          echo "===== HCU PR Gate Info ====="
          echo "PR Event: ${{ github.event_name }}"
          echo "PR Labels: ${{ steps.pr.outputs.labels }}"
          echo "PR Draft: ${{ steps.pr.outputs.draft }}"
          echo "PR User: ${{ steps.pr.outputs.user }}"
          echo "Require run-ci: true"
          echo "Auto run HCU CI: ${{ needs.check-changes.outputs.auto_run_ci }}"
          echo "============================"

      - name: Block draft PR
        if: fromJson(steps.pr.outputs.draft)
        run: |
          echo "PR is draft. Blocking HCU CI."
          exit 1

      - name: Require run-ci label or HCU auto-run
        env:
          AUTO_RUN_CI: ${{ needs.check-changes.outputs.auto_run_ci || 'false' }}
          HAS_RUN_CI_LABEL: ${{ contains(fromJson(steps.pr.outputs.labels), 'run-ci') }}
        run: |
          if [[ "${HAS_RUN_CI_LABEL}" == "true" ]]; then
            echo "Found run-ci label. Proceeding with HCU CI."
            exit 0
          fi

          if [[ "${AUTO_RUN_CI}" == "true" ]]; then
            echo "Auto-run HCU CI because HCU-impact paths changed."
            exit 0
          fi

          echo "Missing required label 'run-ci'. See https://docs.sglang.io/developer_guide/contribution_guide.html#how-to-trigger-ci-tests for more details."
          exit 1

  validate-config:
    name: Validate HCU config
    needs:
      - check-changes
      - call-gate
    if: always() && needs.check-changes.outputs.hcu == 'true' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped')
    runs-on: ${{ inputs.runner_label || vars.HCU_CI_RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      image: ${{ steps.resolve.outputs.image }}
      continue_on_error_flag: ${{ steps.resolve.outputs.continue_on_error_flag }}
    steps:
      - name: Checkout code
        if: github.event_name != 'workflow_dispatch'
        env:
          CHECKOUT_REF: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/hcu-sglang-${GITHUB_RUN_ID}-validate"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "HCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Checkout code for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CHECKOUT_REF: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/hcu-sglang-${GITHUB_RUN_ID}-validate"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "HCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Resolve HCU runner and image
        id: resolve
        env:
          INPUT_RUNNER_LABEL: ${{ inputs.runner_label || '' }}
          INPUT_IMAGE: ${{ inputs.image || '' }}
          VAR_RUNNER_LABEL: ${{ vars.HCU_CI_RUNNER_LABEL || '' }}
          VAR_IMAGE: ${{ vars.HCU_CI_IMAGE || '' }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error || false }}
        run: |
          runner_label="${INPUT_RUNNER_LABEL:-${VAR_RUNNER_LABEL}}"
          image="${INPUT_IMAGE:-${VAR_IMAGE}}"

          if [[ -z "${runner_label}" ]]; then
            echo "::error::HCU runner label is required. Set vars.HCU_CI_RUNNER_LABEL or workflow input runner_label."
            exit 1
          fi

          if [[ -z "${image}" ]]; then
            echo "::error::HCU CI image is required. Set vars.HCU_CI_IMAGE or workflow input image."
            exit 1
          fi

          continue_on_error_flag=""
          if [[ "${CONTINUE_ON_ERROR}" == "true" ]]; then
            continue_on_error_flag="--continue-on-error"
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            continue_on_error_flag="--continue-on-error"
          fi

          echo "runner_label=${runner_label}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "continue_on_error_flag=${continue_on_error_flag}" >> "${GITHUB_OUTPUT}"

      - name: Verify HCU registration
        if: github.event_name != 'workflow_dispatch'
        run: |
          cd "${HCU_CI_CHECKOUT_DIR}"
          python3.9 scripts/ci/hcu/verify_hcu_registration.py || python3 scripts/ci/hcu/verify_hcu_registration.py

      - name: Setup HCU validation container
        if: github.event_name == 'workflow_dispatch'
        env:
          HCU_CI_IMAGE: ${{ steps.resolve.outputs.image }}
          HCU_CI_CONTAINER_NAME: ci_sglang_hcu_${{ github.run_id }}_validate
          HCU_CI_SKIP_PULL: ${{ vars.HCU_CI_SKIP_PULL || '' }}
          HCU_CI_VISIBLE_DEVICES: ${{ vars.HCU_CI_VISIBLE_DEVICES || '' }}
        run: |
          GITHUB_WORKSPACE="${HCU_CI_CHECKOUT_DIR}" \
            bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_start_container.sh" \
              --image "${HCU_CI_IMAGE}" \
              --container-name "${HCU_CI_CONTAINER_NAME}"

      - name: Verify HCU registration in container
        if: github.event_name == 'workflow_dispatch'
        env:
          HCU_CI_CONTAINER_NAME: ci_sglang_hcu_${{ github.run_id }}_validate
        run: |
          bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_exec.sh" \
            --container-name "${HCU_CI_CONTAINER_NAME}" \
            -w /sglang-checkout \
            -- python3 scripts/ci/hcu/verify_hcu_registration.py

      - name: Cleanup HCU validation container
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          HCU_CI_CONTAINER_NAME: ci_sglang_hcu_${{ github.run_id }}_validate
        run: bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_cleanup_container.sh"

  wait-hcu-wheels:
    name: Wait HCU wheels
    needs:
      - check-changes
      - call-gate
      - validate-config
    if: always() && needs.check-changes.outputs.hcu == 'true' && needs.check-changes.outputs.wheel_required == 'true' && needs.validate-config.result == 'success' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped')
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    outputs:
      wheel_urls: ${{ steps.wait.outputs.wheel_urls }}
    env:
      HCU_WHEEL_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
      CHECKOUT_REF: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.sha }}
      GATEWAY_WHEEL_REQUIRED: ${{ needs.check-changes.outputs.gateway_wheel_required }}
    steps:
      - name: Checkout code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/hcu-sglang-${GITHUB_RUN_ID}-wait-wheels"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "HCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf "x-access-token:%s" "${GH_TOKEN}" | base64 | tr -d "\n")"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Resolve wheel target SHA
        id: sha
        run: |
          set -euo pipefail
          short_sha="$(git -C "${HCU_CI_CHECKOUT_DIR}" rev-parse --short=12 HEAD)"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "Using wheel short SHA: ${short_sha}"

      - name: Wait for current commit HCU wheels
        id: wait
        run: |
          set -euo pipefail
          short_sha="${{ steps.sha.outputs.short_sha }}"
          export CHECKOUT_REF="${short_sha}"
          echo "Waiting for HCU wheels with g${short_sha}"

          python3 - <<'PY_WAIT' | tee /tmp/hcu_wheel_urls.out
          import html.parser
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request

          base = os.environ["HCU_WHEEL_INDEX_URL"].rstrip("/") + "/"
          short_sha = os.environ["CHECKOUT_REF"][:12]
          gateway_required = os.environ.get("GATEWAY_WHEEL_REQUIRED", "false") == "true"
          timeout_s = int(os.environ.get("HCU_WHEEL_WAIT_TIMEOUT", "3600"))
          interval_s = int(os.environ.get("HCU_WHEEL_WAIT_INTERVAL", "60"))

          class LinkParser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  for key, value in attrs:
                      if key == "href":
                          self.links.append(value)

          def fetch_links(project):
              url = urllib.parse.urljoin(base, project.strip("/") + "/")
              with urllib.request.urlopen(url, timeout=30) as resp:
                  parser = LinkParser()
                  parser.feed(resp.read().decode("utf-8", errors="replace"))
              return [urllib.parse.urljoin(url, link) for link in parser.links]

          def find_wheel(projects, prefixes):
              marker = f"g{short_sha}"
              for project in projects:
                  try:
                      links = fetch_links(project)
                  except Exception as exc:
                      print(f"[wait-hcu-wheels] {project}: {type(exc).__name__}: {exc}", file=sys.stderr)
                      continue
                  for link in links:
                      filename = urllib.parse.unquote(link.rsplit("/", 1)[-1].split("#", 1)[0])
                      normalized = filename.replace("-", "_")
                      if not filename.endswith(".whl") or marker not in filename:
                          continue
                      if any(normalized.startswith(prefix.replace("-", "_")) for prefix in prefixes):
                          return link
              return None

          requirements = [
              ("sglang", ["sglang"], ["sglang_"]),
              ("sgl-kernel", ["sgl-kernel", "sglang-kernel", "sgl_kernel", "sglang_kernel"], ["sgl_kernel_", "sglang_kernel_"]),
          ]
          if gateway_required:
              requirements.append(("sgl-model-gateway", ["sgl-model-gateway", "sgl_model_gateway"], ["sgl_model_gateway_"]))

          deadline = time.time() + timeout_s
          found = {}
          while time.time() < deadline:
              missing = []
              for name, projects, prefixes in requirements:
                  if name in found:
                      continue
                  wheel = find_wheel(projects, prefixes)
                  if wheel:
                      found[name] = wheel
                      print(f"[wait-hcu-wheels] found {name}: {wheel}", file=sys.stderr)
                  else:
                      missing.append(name)
              if len(found) == len(requirements):
                  print(" ".join(found[name] for name, _, _ in requirements))
                  sys.exit(0)
              print(f"[wait-hcu-wheels] missing {missing}; sleep {interval_s}s", file=sys.stderr)
              time.sleep(interval_s)

          print(f"Timed out waiting for current commit wheels g{short_sha}; found={found}", file=sys.stderr)
          sys.exit(1)
          PY_WAIT
          wheel_urls="$(tail -n 1 /tmp/hcu_wheel_urls.out)"
          echo "wheel_urls=${wheel_urls}" >> "${GITHUB_OUTPUT}"

  stage-a-test-1-gpu-small-hcu:
    name: Stage A HCU smoke
    needs:
      - check-changes
      - call-gate
      - validate-config
      - wait-hcu-wheels
    if: always() && needs.check-changes.outputs.hcu == 'true' && needs.check-changes.outputs.run_stage_a == 'true' && needs.validate-config.result == 'success' && (needs.call-gate.result == 'success' || needs.call-gate.result == 'skipped') && (needs.wait-hcu-wheels.result == 'success' || needs.wait-hcu-wheels.result == 'skipped')
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    env:
      HCU_CI_IMAGE: ${{ needs.validate-config.outputs.image }}
      HCU_CI_CONTAINER_NAME: ci_sglang_hcu_${{ github.run_id }}_stage_a
      HCU_CI_SKIP_PULL: ${{ vars.HCU_CI_SKIP_PULL || '' }}
      HCU_CI_SKIP_DEPENDENCY_INSTALL: ${{ vars.HCU_CI_SKIP_DEPENDENCY_INSTALL || '' }}
      HCU_CI_SKIP_REQUIREMENTS_INSTALL: ${{ vars.HCU_CI_SKIP_REQUIREMENTS_INSTALL || '' }}
      HCU_CI_SKIP_SGLANG_BUILD: ${{ vars.HCU_CI_SKIP_SGLANG_BUILD || '' }}
      HCU_CI_VISIBLE_DEVICES: ${{ vars.HCU_CI_VISIBLE_DEVICES || '' }}
      HCU_CI_INSTALL_WHEEL_URLS: ${{ needs.wait-hcu-wheels.outputs.wheel_urls || '' }}
      HCU_CI_USE_INSTALLED_WHEELS: ${{ needs.check-changes.outputs.wheel_required == 'true' && '1' || '' }}
    steps:
      - name: Checkout code
        env:
          CHECKOUT_REF: ${{ inputs.pr_head_sha || inputs.ref || github.event.pull_request.head.sha || github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/hcu-sglang-${GITHUB_RUN_ID}-stage-a"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "HCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Setup HCU container
        run: |
          GITHUB_WORKSPACE="${HCU_CI_CHECKOUT_DIR}" \
            bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_start_container.sh" \
              --image "${HCU_CI_IMAGE}" \
              --container-name "${HCU_CI_CONTAINER_NAME}"

      - name: Install dependencies
        run: bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_install_dependency.sh"

      - name: Run stage-a-test-1-gpu-small-hcu
        timeout-minutes: 30
        run: |
          bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_exec.sh" -w /sglang-checkout/test --container-name "${HCU_CI_CONTAINER_NAME}" -- \
            python3 run_suite.py \
              --hw hcu \
              --suite stage-a-test-1-gpu-small-hcu \
              --include-file registered/hcu/interface/test_hcu_smoke.py \
              --timeout-per-file 120 \
              ${{ needs.validate-config.outputs.continue_on_error_flag }}

      - name: Cleanup HCU container
        if: always()
        run: bash "${HCU_CI_CHECKOUT_DIR}/scripts/ci/hcu/hcu_ci_cleanup_container.sh"

  stage-b-test-1-gpu-small-hcu:
    name: Stage B HCU required (${{ matrix.name }})
    needs:
