  pr-test-hcu-finish:
    name: PR Test (HCU) finish
    needs:
      - check-changes
      - call-gate
      - validate-config
      - wait-hcu-wheels
      - stage-a-test-1-gpu-small-hcu
      - stage-b-test-1-gpu-small-hcu
    if: always()
    runs-on: ${{ inputs.runner_label || vars.HCU_CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Check all dependent job statuses
        run: |
          json_needs='${{ toJson(needs) }}'
          job_names=$(echo "${json_needs}" | jq -r 'keys_unsorted[]')

          for job in ${job_names}; do
            result=$(echo "${json_needs}" | jq -r --arg j "${job}" '.[$j].result')
            echo "${job}: ${result}"

            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done

          echo "All required HCU jobs completed successfully or were skipped."
