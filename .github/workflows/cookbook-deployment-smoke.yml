name: Read-only BW1100 two-node discovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-ci-16gpu-readonly-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: bw1100
    timeout-minutes: 15
    steps:
      - name: Checkout pinned node discovery implementation
        uses: actions/checkout@v4
        with:
          repository: guochenyang99/ci-model-test
          ref: 575d1befbf78ba2cc07282c67f10e7436db4d836
          token: ${{ secrets.MODEL_SMOKE_REPO_TOKEN }}
          persist-credentials: false
          path: model-ci-tools
      - name: Inspect local and remote node admission without starting models
        uses: ./model-ci-tools/.github/actions/multinode-preflight
