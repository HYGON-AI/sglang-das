name: Cookbook deployment smoke

on:
  workflow_call:
    inputs:
      image:
        description: Exact dated image built and pushed by the caller
        type: string
        required: true
      mode:
        description: preflight or execute
        type: string
        default: execute
      cases:
        description: Exact cookbook section; empty tests all single-host deployments
        type: string
        default: ''
    secrets:
      MODEL_SMOKE_REPO_TOKEN:
        required: true
      DASHHUB_CI_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      mode:
        description: First run preflight; then execute
        type: choice
        options: [preflight, execute]
        default: preflight
      image:
        description: SGLang image to test (full reference); empty uses the newest dated jenkins/model_test_env/sglang tag
        type: string
        default: ''
      cases:
        description: Exact cookbook section; empty tests all single-host deployments
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cookbook-deployment-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: bw1100
    timeout-minutes: 840
    steps:
      - name: Checkout private test controller
        uses: actions/checkout@v4
        with:
          repository: guochenyang99/ci-model-test
          # The maintained main branch supplies all test behavior.
          ref: main
          token: ${{ secrets.MODEL_SMOKE_REPO_TOKEN }}
          persist-credentials: false
          # Fresh code-only directory bypasses reports left by the previous controller.
          path: model-ci-tools
      - name: Invoke maintained test controller
        uses: ./model-ci-tools/.github/actions/deployment-smoke
        with:
          image: ${{ inputs.image || '' }}
          dashhub-token: ${{ secrets.DASHHUB_CI_TOKEN }}
          cases: ${{ inputs.cases || '' }}
          mode: ${{ inputs.mode || 'execute' }}
