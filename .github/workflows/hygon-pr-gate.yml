name: HYGON PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - v0.5.12_dev

permissions:
  contents: read

concurrency:
  group: hygon-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: HYGON PR Gate
    uses: HYGON-AI/open-source-governance/.github/workflows/pr-quality-gate.yml@055043c78beafad4f1315b9d3ad21cbf3748a54e
    permissions:
      contents: read
