name: Release PR HCU Wheels

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    paths:
      - 'python/**'
      - 'sgl-kernel/**'
      - 'sgl-model-gateway/**'
      - 'requirements_hcu.txt'
      - '.github/workflows/release-pr-hcu.yml'

  # ---- 手动触发，可传参 ----
  workflow_dispatch:
    inputs:
      torch_version:
        description: 'PyTorch version to install'
        required: false
        default: '2.10.0'
        type: string
      skip_gateway:
        description: 'Skip sgl-model-gateway build'
        required: false
        default: false
        type: boolean

jobs:
  compile:
    # ---- 并发控制: 同一分支 + 同一 Python 版本的 job 只保留最新一个 ----
    concurrency:
      group: release-pr-hcu-${{ github.ref }}-py${{ matrix.python-version }}
      cancel-in-progress: true
    # ---- 自托管 HCU runner，在 Docker 容器内执行 ----
    runs-on: [self-hosted, hcu, nmz4]
    timeout-minutes: 180

    container:
      image: harbor.sourcefind.cn:5443/dcu/admin/base/dev:rockylinux8.6-mpi5.0-gcc10.3-cmake3.29-py3.10-mkl2020.4.304
      options: >
        --device=/dev/kfd --device=/dev/dri/ --group-add video
        -v /opt/hyhal/:/opt/hyhal/:ro
        --shm-size=80G
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged=true
        -v /home/github/sgl_whl_temp:/home/github/sgl_whl_temp

    # ---- Matrix: 3 个 Python 版本并行编译 ----
    strategy:
      matrix:
        python-version: ['3.10']

    env:
      TORCH_VERSION: ${{ inputs.torch_version || '2.10.0' }}
      SKIP_GATEWAY: ${{ inputs.skip_gateway || false }}
      PIP_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
      PIP_TRUSTED_HOST: 10.16.1.201
      RESOURCE_SERVER: http://10.16.1.201:8000/
      HCU_RUNNER_HOST_UID: ${{ vars.HCU_RUNNER_HOST_UID || '1000' }}
      HCU_RUNNER_HOST_GID: ${{ vars.HCU_RUNNER_HOST_GID || '1000' }}
      WHEEL_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HCU_WHEEL_STAGING_ROOT: /home/github/sgl_whl_temp

    steps:
      # =======================================================================
      # 环境准备
      # =======================================================================

      - name: Normalize workspace ownership before checkout
        run: |
          chown -R "${HCU_RUNNER_HOST_UID}:${HCU_RUNNER_HOST_GID}" "${GITHUB_WORKSPACE}" || true

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WHEEL_COMMIT_SHA }}
          submodules: 'recursive'

      # 容器内已预装 Python 3.10 + DTK/ROCm + gcc + cmake
      - name: Install build deps
        run: |
          pip install torch==${TORCH_VERSION} build scikit-build-core cmake ninja wheel setuptools setuptools-scm setuptools-rust maturin ciupload
          wget ${RESOURCE_SERVER}/Jenkins/CompileDep/sglang/protoc-24.4-linux-x86_64.zip
          unzip protoc-24.4-linux-x86_64.zip -d /usr/local/
          chmod +x /usr/local/bin/protoc
          ln -s /usr/local/bin/protoc /usr/bin/protoc
          wget ${RESOURCE_SERVER}/Jenkins/CompileDep/sglang/rustup-init.sh
          export RUSTUP_DIST_SERVER=https://mirrors.tuna.tsinghua.edu.cn/rustup
          export RUSTUP_UPDATE_ROOT=https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup
          bash rustup-init.sh -y
          rm -rf ${HOME}/.cargo/config
          mkdir -p ${HOME}/.cargo
          cat > ${HOME}/.cargo/config << 'EOF'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'

          [source.tuna-sparse]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"

          [net]
          retry = 5
          git-fetch-with-cli = true

          [http]
          low-speed-limit = 1
          EOF

      - name: Install DTK
        run: |
          DTK_PKG_URL=${RESOURCE_SERVER}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
          cd /opt
          wget -q $DTK_PKG_URL
          tar -xzf $(basename $DTK_PKG_URL)
          mv dtk-* dtk

      # =======================================================================
      # 路径检测: 决定哪些组件需要编译
      # =======================================================================

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            sgl-kernel:
              - 'sgl-kernel/**'
            sglang:
              - 'python/**'
            gateway:
              - 'sgl-model-gateway/**'

      # =======================================================================
      # 编译阶段: 按检测结果增量编译
      # workflow_dispatch 时忽略检测结果，全量编译
      # =======================================================================

      - name: Build sgl-kernel (HIP)
        run: |
          source /opt/dtk/env.sh
          cd sgl-kernel && python setup_hip.py bdist_wheel
          echo "=== sgl-kernel wheel ==="
          ls -lh dist/*.whl

      - name: Build sglang python package
        # if: steps.changes.outputs.sglang == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.5.12"
        run: |
          source /opt/dtk/env.sh
          source $HOME/.cargo/env
          cd python
          export SETUPTOOLS_SCM_PRETEND_VERSION="${SETUPTOOLS_SCM_PRETEND_VERSION}"
          python -m build --wheel --no-isolation -Cfeatures=all_hip
          echo "=== sglang wheel ==="
          ls -lh dist/*.whl

      - name: Build sgl-model-gateway
        if: ${{ env.SKIP_GATEWAY != 'true' && (steps.changes.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch') }}
        run: |
          source /opt/dtk/env.sh
          source $HOME/.cargo/env
          export RUSTUP_DIST_SERVER=https://mirrors.ustc.edu.cn/rust-static
          export RUSTUP_UPDATE_ROOT=https://mirrors.ustc.edu.cn/rust-static/rustup
          cd sgl-model-gateway && cargo build --release
          cd bindings/python && maturin build --release --skip-auditwheel
          echo "=== sgl-model-gateway wheel ==="
          ls -lh target/wheels/*.whl

      # =======================================================================
      # 修复 (auditwheel) & 保存 PR wheel 到本地 staging
      # =======================================================================

      - name: Apply DAS local version to wheels
        run: |
          source /opt/dtk/env.sh
          DTK_PKG_URL=${RESOURCE_SERVER}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
          DTK_VER=$(echo $DTK_PKG_URL | grep -oP 'dtk\K[0-9]+\.[0-9]+' | tr -d '.')
          TORCH_VER=$(echo $TORCH_VERSION | tr -d '.')
          LOCAL_VER="das.dtk${DTK_VER}.torch${TORCH_VER}.$(date +%y%m%d%H%M).g$(printf '%s' "${WHEEL_COMMIT_SHA}" | cut -c1-12)"
          echo "Local version: ${LOCAL_VER}"
          mkdir -p output
          for whl in sgl-kernel/dist/*.whl python/dist/*.whl sgl-model-gateway/bindings/python/target/wheels/*.whl; do
            [ -f "$whl" ] || continue
            CIUpload --repair --torch_version $TORCH_VERSION --set_local_version $LOCAL_VER --outputdir output -f "$whl"
          done
          echo "=== Repaired wheels ==="
          ls -lh output/

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          STAGING_ROOT="${HCU_WHEEL_STAGING_ROOT:-/home/github/sgl_whl_temp}"
          STAGING_DIR="${STAGING_ROOT}/${GITHUB_REPOSITORY_OWNER}_${REPO_NAME}/pr-${GITHUB_RUN_ID}/${WHEEL_COMMIT_SHA}"
          WHEEL_DIR="${STAGING_DIR}/wheels"

          echo "Saving HCU PR wheels to ${WHEEL_DIR}"
          rm -rf "${WHEEL_DIR}"
          mkdir -p "${WHEEL_DIR}"
          cp -v output/*.whl "${WHEEL_DIR}/"

          export STAGING_DIR LOCAL_VER
          python3 - <<'PY_MANIFEST'
          import json
          import os
          import pathlib

          staging_dir = pathlib.Path(os.environ["STAGING_DIR"])
          wheel_dir = staging_dir / "wheels"
          wheels = sorted(str(path.relative_to(staging_dir)) for path in wheel_dir.glob("*.whl"))
          manifest = {
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "commit_sha": os.environ.get("WHEEL_COMMIT_SHA", ""),
              "torch_version": os.environ.get("TORCH_VERSION", ""),
              "local_version": os.environ.get("LOCAL_VER", ""),
              "wheels": wheels,
          }
          (staging_dir / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY_MANIFEST

          touch "${STAGING_DIR}/READY"
          chown -R "${HCU_RUNNER_HOST_UID}:${HCU_RUNNER_HOST_GID}" "${STAGING_DIR}" || true
          echo "HCU PR wheels are staged locally at ${STAGING_DIR}"

      - name: Report staged PR wheels
        run: |
          echo "HCU PR wheels are staged locally under /home/github/sgl_whl_temp."
          echo "Skipping devpi and GitHub artifact upload for PR wheels."

      - name: Normalize workspace ownership
        if: always()
        run: |
          chown -R "${HCU_RUNNER_HOST_UID}:${HCU_RUNNER_HOST_GID}" "${GITHUB_WORKSPACE}" || true
