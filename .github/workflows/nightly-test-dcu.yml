name: Nightly Test (DCU)

on:
  schedule:
    - cron: "30 18 * * *" # 02:30 Beijing Time daily
  pull_request:
    paths:
      - ".github/workflows/nightly-test-dcu.yml"
      - ".github/workflows/release-pypi-nightly-dcu.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref, branch, tag, or SHA to test"
        required: false
        type: string
        default: ""
      runner_label:
        description: "DCU runner label override"
        required: false
        type: string
        default: ""
      image:
        description: "DCU CI container image override"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue running remaining files after a test failure"
        required: false
        type: boolean
        default: true
      force_wheel_mode:
        description: "Build, wait for, and install current commit DCU wheels"
        required: false
        type: boolean
        default: true
      job_filter:
        description: "Run one DCU nightly job or all jobs"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - nightly-dcu-core
          - nightly-dcu-1gpu
          - nightly-dcu-accuracy
          - nightly-dcu-vlm
          - nightly-dcu-long-scheduler
          - nightly-dcu-long-decoding
          - nightly-dcu-2gpu

permissions:
  contents: read

concurrency:
  group: nightly-test-dcu-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate-config:
    name: Validate DCU nightly config
    runs-on: ${{ inputs.runner_label || vars.DCU_CI_RUNNER_LABEL }}
    outputs:
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      image: ${{ steps.resolve.outputs.image }}
      continue_on_error_flag: ${{ steps.resolve.outputs.continue_on_error_flag }}
      job_filter: ${{ steps.resolve.outputs.job_filter }}
      target_ref: ${{ steps.resolve.outputs.target_ref }}
      wheel_mode: ${{ steps.resolve.outputs.wheel_mode }}
    steps:
      - name: Resolve DCU runner, image, ref, and filters
        id: resolve
        env:
          INPUT_RUNNER_LABEL: ${{ inputs.runner_label || '' }}
          INPUT_IMAGE: ${{ inputs.image || '' }}
          INPUT_REF: ${{ inputs.ref || '' }}
          INPUT_JOB_FILTER: ${{ inputs.job_filter || 'all' }}
          VAR_RUNNER_LABEL: ${{ vars.DCU_CI_RUNNER_LABEL || '' }}
          VAR_IMAGE: ${{ vars.DCU_CI_IMAGE || '' }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error || '' }}
          FORCE_WHEEL_MODE: ${{ inputs.force_wheel_mode || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          runner_label="${INPUT_RUNNER_LABEL:-${VAR_RUNNER_LABEL}}"
          if [[ "${runner_label}" == "dcu-ci-pr" ]]; then
            echo "Routing validation runner label dcu-ci-pr to dcu-ci-pr-2 for nmz4 test runner."
            runner_label="dcu-ci-pr-2"
          fi
          image="${INPUT_IMAGE:-${VAR_IMAGE}}"
          target_ref="${INPUT_REF:-${PR_HEAD_SHA:-${GITHUB_SHA_VALUE}}}"
          continue_on_error="${CONTINUE_ON_ERROR:-true}"
          job_filter="${INPUT_JOB_FILTER:-all}"
          force_wheel_mode="${FORCE_WHEEL_MODE:-false}"

          if [[ -z "${runner_label}" ]]; then
            echo "::error::DCU runner label is required. Set vars.DCU_CI_RUNNER_LABEL or workflow input runner_label."
            exit 1
          fi

          if [[ -z "${image}" ]]; then
            echo "::error::DCU CI image is required. Set vars.DCU_CI_IMAGE or workflow input image."
            exit 1
          fi

          continue_on_error_flag=""
          if [[ "${continue_on_error}" == "true" || "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            continue_on_error_flag="--continue-on-error"
          fi

          wheel_mode="false"
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${GITHUB_EVENT_NAME}" == "pull_request" || "${force_wheel_mode}" == "true" ]]; then
            wheel_mode="true"
          fi

          echo "runner_label=${runner_label}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "target_ref=${target_ref}" >> "${GITHUB_OUTPUT}"
          echo "continue_on_error_flag=${continue_on_error_flag}" >> "${GITHUB_OUTPUT}"
          echo "job_filter=${job_filter}" >> "${GITHUB_OUTPUT}"
          echo "wheel_mode=${wheel_mode}" >> "${GITHUB_OUTPUT}"

      - name: Checkout code
        env:
          CHECKOUT_REF: ${{ steps.resolve.outputs.target_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-nightly-validate"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Setup DCU validation container
        env:
          DCU_CI_IMAGE: ${{ steps.resolve.outputs.image }}
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_nightly_${{ github.run_id }}_validate
          DCU_CI_SKIP_PULL: ${{ vars.DCU_CI_SKIP_PULL || '' }}
          DCU_CI_VISIBLE_DEVICES: ${{ vars.DCU_CI_VISIBLE_DEVICES || '' }}
        run: |
          GITHUB_WORKSPACE="${DCU_CI_CHECKOUT_DIR}" \
            bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_start_container.sh" \
              --image "${DCU_CI_IMAGE}" \
              --container-name "${DCU_CI_CONTAINER_NAME}"

      - name: Verify DCU registration in container
        env:
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_nightly_${{ github.run_id }}_validate
        run: |
          bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_exec.sh" \
            --container-name "${DCU_CI_CONTAINER_NAME}" \
            -w /sglang-checkout \
            -- python3 scripts/ci/dcu/verify_dcu_registration.py

      - name: Cleanup DCU validation container
        if: always()
        env:
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_nightly_${{ github.run_id }}_validate
        run: bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_cleanup_container.sh"

  build-dcu-wheels:
    name: Build DCU nightly wheels
    needs: validate-config
    if: needs.validate-config.outputs.wheel_mode == 'true'
    uses: ./.github/workflows/release-pypi-nightly-dcu.yml
    with:
      ref: ${{ needs.validate-config.outputs.target_ref }}
      skip_gateway: true
    secrets: inherit

  wait-dcu-wheels:
    name: Wait DCU wheels
    needs:
      - validate-config
      - build-dcu-wheels
    if: >
      always() &&
      needs.validate-config.result == 'success' &&
      needs.validate-config.outputs.wheel_mode == 'true' &&
      needs.build-dcu-wheels.result == 'success'
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    outputs:
      wheel_urls: ${{ steps.wait.outputs.wheel_urls }}
    env:
      DCU_WHEEL_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
      CHECKOUT_REF: ${{ needs.validate-config.outputs.target_ref }}
    steps:
      - name: Checkout code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-nightly-wait-wheels"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Resolve wheel target SHA
        id: sha
        run: |
          set -euo pipefail
          short_sha="$(git -C "${DCU_CI_CHECKOUT_DIR}" rev-parse --short=12 HEAD)"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "Using wheel short SHA: ${short_sha}"

      - name: Wait for current commit DCU wheels
        id: wait
        run: |
          set -euo pipefail
          short_sha="${{ steps.sha.outputs.short_sha }}"
          export CHECKOUT_REF="${short_sha}"
          echo "Waiting for DCU wheels with g${short_sha}"

          python3 - <<'PY_WAIT' | tee /tmp/dcu_nightly_wheel_urls.out
          import html.parser
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request

          base = os.environ["DCU_WHEEL_INDEX_URL"].rstrip("/") + "/"
          short_sha = os.environ["CHECKOUT_REF"][:12]
          timeout_s = int(os.environ.get("DCU_WHEEL_WAIT_TIMEOUT", "3600"))
          interval_s = int(os.environ.get("DCU_WHEEL_WAIT_INTERVAL", "60"))

          class LinkParser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag != "a":
                      return
                  for key, value in attrs:
                      if key == "href":
                          self.links.append(value)

          def fetch_links(project):
              url = urllib.parse.urljoin(base, project.strip("/") + "/")
              with urllib.request.urlopen(url, timeout=30) as resp:
                  parser = LinkParser()
                  parser.feed(resp.read().decode("utf-8", errors="replace"))
              return [urllib.parse.urljoin(url, link) for link in parser.links]

          def find_wheel(projects, prefixes):
              marker = f"g{short_sha}"
              for project in projects:
                  try:
                      links = fetch_links(project)
                  except Exception as exc:
                      print(f"[wait-dcu-wheels] {project}: {type(exc).__name__}: {exc}", file=sys.stderr)
                      continue
                  for link in links:
                      filename = urllib.parse.unquote(link.rsplit("/", 1)[-1].split("#", 1)[0])
                      normalized = filename.replace("-", "_")
                      if not filename.endswith(".whl") or marker not in filename:
                          continue
                      if any(normalized.startswith(prefix.replace("-", "_")) for prefix in prefixes):
                          return link
              return None

          requirements = [
              ("sglang", ["sglang"], ["sglang_"]),
              ("sgl-kernel", ["sgl-kernel", "sglang-kernel", "sgl_kernel", "sglang_kernel"], ["sgl_kernel_", "sglang_kernel_"]),
          ]

          deadline = time.time() + timeout_s
          found = {}
          while time.time() < deadline:
              missing = []
              for name, projects, prefixes in requirements:
                  if name in found:
                      continue
                  wheel = find_wheel(projects, prefixes)
                  if wheel:
                      found[name] = wheel
                      print(f"[wait-dcu-wheels] found {name}: {wheel}", file=sys.stderr)
                  else:
                      missing.append(name)
              if len(found) == len(requirements):
                  print(" ".join(found[name] for name, _, _ in requirements))
                  sys.exit(0)
              print(f"[wait-dcu-wheels] missing {missing}; sleep {interval_s}s", file=sys.stderr)
              time.sleep(interval_s)

          print(f"Timed out waiting for current commit wheels g{short_sha}; found={found}", file=sys.stderr)
          sys.exit(1)
          PY_WAIT
          wheel_urls="$(tail -n 1 /tmp/dcu_nightly_wheel_urls.out)"
          echo "wheel_urls=${wheel_urls}" >> "${GITHUB_OUTPUT}"
          echo "DCU_CI_INSTALL_WHEEL_URLS=${wheel_urls}"

  nightly-dcu:
    name: Nightly DCU (${{ matrix.name }})
    needs:
      - validate-config
      - build-dcu-wheels
      - wait-dcu-wheels
    if: >
      always() &&
      needs.validate-config.result == 'success' &&
      (needs.build-dcu-wheels.result == 'success' || needs.build-dcu-wheels.result == 'skipped') &&
      (needs.wait-dcu-wheels.result == 'success' || needs.wait-dcu-wheels.result == 'skipped')
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: core-0
            group: nightly-dcu-core
            suite: nightly-dcu
            nightly: "true"
            part: 0
            parts: 3
            timeout_per_file: 3000
            timeout_minutes: 180
            include_files: ""
          - name: core-1
            group: nightly-dcu-core
            suite: nightly-dcu
            nightly: "true"
            part: 1
            parts: 3
            timeout_per_file: 3000
            timeout_minutes: 180
            include_files: ""
          - name: core-2
            group: nightly-dcu-core
            suite: nightly-dcu
            nightly: "true"
            part: 2
            parts: 3
            timeout_per_file: 3000
            timeout_minutes: 180
            include_files: ""
          - name: one-gpu
            group: nightly-dcu-1gpu
            suite: nightly-dcu-1-gpu
            nightly: "true"
            part: 0
            parts: 1
            timeout_per_file: 1200
            timeout_minutes: 90
            include_files: ""
          - name: accuracy-0
            group: nightly-dcu-accuracy
            suite: nightly-dcu-accuracy
            nightly: "true"
            part: 0
            parts: 2
            timeout_per_file: 4200
            timeout_minutes: 180
            include_files: ""
          - name: accuracy-1
            group: nightly-dcu-accuracy
            suite: nightly-dcu-accuracy
            nightly: "true"
            part: 1
            parts: 2
            timeout_per_file: 4200
            timeout_minutes: 180
            include_files: ""
          - name: vlm
            group: nightly-dcu-vlm
            suite: nightly-dcu-vlm
            nightly: "true"
            part: 0
            parts: 1
            timeout_per_file: 7800
            timeout_minutes: 300
            include_files: ""
          - name: long-scheduler
            group: nightly-dcu-long-scheduler
            suite: stage-b-test-1-gpu-small-dcu
            nightly: "false"
            part: 0
            parts: 1
            timeout_per_file: 1800
            timeout_minutes: 120
            include_files: >-
              registered/scheduler/test_abort.py
              registered/scheduler/test_priority_scheduling.py
              registered/scheduler/test_no_chunked_prefill.py
              registered/tokenizer/test_skip_tokenizer_init.py
          - name: long-decoding
            group: nightly-dcu-long-decoding
            suite: stage-b-test-1-gpu-small-dcu
            nightly: "false"
            part: 0
            parts: 1
            timeout_per_file: 1800
            timeout_minutes: 90
            include_files: >-
              registered/constrained_decoding/test_constrained_decoding.py
              registered/openai_server/features/test_json_mode.py
          - name: two-gpu
            group: nightly-dcu-2gpu
            suite: stage-b-test-2-gpu-large-dcu
            nightly: "false"
            part: 0
            parts: 1
            timeout_per_file: 1800
            timeout_minutes: 90
            include_files: registered/distributed/test_data_parallelism.py
    env:
      DCU_CI_IMAGE: ${{ needs.validate-config.outputs.image }}
      DCU_CI_CONTAINER_NAME: ci_sglang_dcu_nightly_${{ github.run_id }}_${{ matrix.name }}
      DCU_CI_SKIP_PULL: ${{ vars.DCU_CI_SKIP_PULL || '' }}
      DCU_CI_SKIP_DEPENDENCY_INSTALL: ${{ vars.DCU_CI_SKIP_DEPENDENCY_INSTALL || '' }}
      DCU_CI_SKIP_REQUIREMENTS_INSTALL: ${{ vars.DCU_CI_SKIP_REQUIREMENTS_INSTALL || '' }}
      DCU_CI_SKIP_SGLANG_BUILD: ${{ vars.DCU_CI_SKIP_SGLANG_BUILD || '' }}
      DCU_CI_VISIBLE_DEVICES: ${{ vars.DCU_CI_VISIBLE_DEVICES || '' }}
      DCU_CI_INSTALL_WHEEL_URLS: ${{ needs.wait-dcu-wheels.outputs.wheel_urls || '' }}
      DCU_CI_USE_INSTALLED_WHEELS: ${{ needs.validate-config.outputs.wheel_mode == 'true' && '1' || '' }}
    steps:
      - name: Check job filter
        id: filter
        env:
          JOB_FILTER: ${{ needs.validate-config.outputs.job_filter }}
          MATRIX_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          if [[ "${JOB_FILTER}" == "all" || "${JOB_FILTER}" == "${MATRIX_GROUP}" ]]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            echo "Running group ${MATRIX_GROUP}"
          else
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping group ${MATRIX_GROUP}; selected job_filter=${JOB_FILTER}"
          fi

      - name: Checkout code
        if: steps.filter.outputs.should_run == 'true'
        env:
          CHECKOUT_REF: ${{ needs.validate-config.outputs.target_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-nightly-${{ matrix.name }}"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Setup DCU container
        if: steps.filter.outputs.should_run == 'true'
        run: |
          GITHUB_WORKSPACE="${DCU_CI_CHECKOUT_DIR}" \
            bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_start_container.sh" \
              --image "${DCU_CI_IMAGE}" \
              --container-name "${DCU_CI_CONTAINER_NAME}"

      - name: Install dependencies
        if: steps.filter.outputs.should_run == 'true'
        run: bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_install_dependency.sh"

      - name: Run nightly DCU suite
        if: steps.filter.outputs.should_run == 'true'
        env:
          INCLUDE_FILES: ${{ matrix.include_files }}
          CONTINUE_ON_ERROR_FLAG: ${{ needs.validate-config.outputs.continue_on_error_flag }}
        run: |
          set -euo pipefail

          cmd=(
            python3 run_suite.py
            --hw dcu
            --suite "${{ matrix.suite }}"
            --auto-partition-id "${{ matrix.part }}"
            --auto-partition-size "${{ matrix.parts }}"
            --timeout-per-file "${{ matrix.timeout_per_file }}"
          )

          if [[ "${{ matrix.nightly }}" == "true" ]]; then
            cmd+=(--nightly)
          fi

          if [[ -n "${CONTINUE_ON_ERROR_FLAG}" ]]; then
            cmd+=("${CONTINUE_ON_ERROR_FLAG}")
          fi

          if [[ -n "${INCLUDE_FILES}" ]]; then
            for include_file in ${INCLUDE_FILES}; do
              cmd+=(--include-file "${include_file}")
            done
          fi

          echo "Running ${{ matrix.suite }} partition ${{ matrix.part }}/${{ matrix.parts }} nightly=${{ matrix.nightly }}"
          bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_exec.sh" -w /sglang-checkout/test --container-name "${DCU_CI_CONTAINER_NAME}" -- \
            "${cmd[@]}"

      - name: Cleanup DCU container
        if: always() && steps.filter.outputs.should_run == 'true'
        run: bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_cleanup_container.sh"

  nightly-dcu-finish:
    name: Nightly DCU finish
    needs:
      - validate-config
      - build-dcu-wheels
      - wait-dcu-wheels
      - nightly-dcu
    if: always()
    runs-on: ${{ needs.validate-config.outputs.runner_label || vars.DCU_CI_RUNNER_LABEL }}
    steps:
      - name: Check all dependent job statuses
        env:
          WHEEL_MODE: ${{ needs.validate-config.outputs.wheel_mode || 'false' }}
        run: |
          set -euo pipefail
          json_needs='${{ toJson(needs) }}'
          job_names=$(echo "${json_needs}" | jq -r 'keys_unsorted[]')

          for job in ${job_names}; do
            result=$(echo "${json_needs}" | jq -r --arg j "${job}" '.[$j].result')
            echo "${job}: ${result}"

            if [[ "${job}" == "build-dcu-wheels" && "${result}" == "skipped" && "${WHEEL_MODE}" != "true" ]]; then
              continue
            fi

            if [[ "${job}" == "wait-dcu-wheels" && "${result}" == "skipped" && "${WHEEL_MODE}" != "true" ]]; then
              continue
            fi

            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done

          echo "All DCU nightly jobs completed successfully or were intentionally skipped."
