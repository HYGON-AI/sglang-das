name: Nightly Test (DCU)

on:
  schedule:
    - cron: "30 18 * * *" # 02:30 Beijing Time daily
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref, branch, tag, or SHA to test"
        required: false
        type: string
        default: ""
      runner_label:
        description: "DCU runner label override"
        required: false
        type: string
        default: ""
      image:
        description: "DCU CI container image override"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue running remaining files after a test failure"
        required: false
        type: boolean
        default: true
      job_filter:
        description: "Run one DCU nightly module or all modules"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - nightly-dcu-core
          - nightly-dcu-core-functional
          - nightly-dcu-1gpu
          - nightly-dcu-accuracy
          - nightly-dcu-accuracy-text
          - nightly-dcu-vlm
          - nightly-dcu-perf-text
          - nightly-dcu-large-model-4gpu
          - nightly-dcu-large-model-8gpu
          - nightly-dcu-quant-opt
          - nightly-dcu-functional-long
          - nightly-dcu-api-models
          - nightly-dcu-long-scheduler
          - nightly-dcu-long-decoding
          - nightly-dcu-2gpu

permissions:
  contents: read

concurrency:
  group: nightly-test-dcu-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate-config:
    name: Validate DCU nightly config
    runs-on: ${{ inputs.runner_label || vars.DCU_CI_RUNNER_LABEL }}
    outputs:
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      image: ${{ steps.resolve.outputs.image }}
      continue_on_error_flag: ${{ steps.resolve.outputs.continue_on_error_flag }}
      job_filter: ${{ steps.resolve.outputs.job_filter }}
      target_ref: ${{ steps.resolve.outputs.target_ref }}
    steps:
      - name: Resolve DCU runner, image, ref, and filters
        id: resolve
        env:
          INPUT_RUNNER_LABEL: ${{ inputs.runner_label || '' }}
          INPUT_IMAGE: ${{ inputs.image || '' }}
          INPUT_REF: ${{ inputs.ref || '' }}
          INPUT_JOB_FILTER: ${{ inputs.job_filter || 'all' }}
          VAR_RUNNER_LABEL: ${{ vars.DCU_CI_RUNNER_LABEL || '' }}
          VAR_IMAGE: ${{ vars.DCU_CI_IMAGE || '' }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error || '' }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          runner_label="${INPUT_RUNNER_LABEL:-${VAR_RUNNER_LABEL}}"
          if [[ "${runner_label}" == "dcu-ci-pr" ]]; then
            echo "Routing validation runner label dcu-ci-pr to dcu-ci-pr-2 for nmz4 test runner."
            runner_label="dcu-ci-pr-2"
          fi
          image="${INPUT_IMAGE:-${VAR_IMAGE}}"
          target_ref="${INPUT_REF:-${GITHUB_SHA_VALUE}}"
          continue_on_error="${CONTINUE_ON_ERROR:-true}"
          job_filter="${INPUT_JOB_FILTER:-all}"

          case "${job_filter}" in
            nightly-dcu-core)
              job_filter="nightly-dcu-core-functional"
              ;;
            nightly-dcu-accuracy)
              job_filter="nightly-dcu-accuracy-text"
              ;;
            nightly-dcu-long-scheduler|nightly-dcu-long-decoding)
              job_filter="nightly-dcu-functional-long"
              ;;
          esac

          if [[ -z "${runner_label}" ]]; then
            echo "::error::DCU runner label is required. Set vars.DCU_CI_RUNNER_LABEL or workflow input runner_label."
            exit 1
          fi

          if [[ -z "${image}" ]]; then
            echo "::error::DCU CI image is required. Set vars.DCU_CI_IMAGE or workflow input image."
            exit 1
          fi

          continue_on_error_flag=""
          if [[ "${continue_on_error}" == "true" || "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            continue_on_error_flag="--continue-on-error"
          fi

          echo "runner_label=${runner_label}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "target_ref=${target_ref}" >> "${GITHUB_OUTPUT}"
          echo "continue_on_error_flag=${continue_on_error_flag}" >> "${GITHUB_OUTPUT}"
          echo "job_filter=${job_filter}" >> "${GITHUB_OUTPUT}"

      - name: Checkout code
        env:
          CHECKOUT_REF: ${{ steps.resolve.outputs.target_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-nightly-validate"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Setup DCU validation container
        env:
          DCU_CI_IMAGE: ${{ steps.resolve.outputs.image }}
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_nightly_${{ github.run_id }}_validate
          DCU_CI_SKIP_PULL: ${{ vars.DCU_CI_SKIP_PULL || '' }}
          DCU_CI_VISIBLE_DEVICES: ${{ vars.DCU_CI_VISIBLE_DEVICES || '' }}
        run: |
          GITHUB_WORKSPACE="${DCU_CI_CHECKOUT_DIR}" \
            bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_start_container.sh" \
              --image "${DCU_CI_IMAGE}" \
              --container-name "${DCU_CI_CONTAINER_NAME}"

      - name: Verify DCU registration in container
        env:
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_nightly_${{ github.run_id }}_validate
        run: |
          bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_exec.sh" \
            --container-name "${DCU_CI_CONTAINER_NAME}" \
            -w /sglang-checkout \
            -- python3 scripts/ci/dcu/verify_dcu_registration.py

      - name: Cleanup DCU validation container
        if: always()
        env:
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_nightly_${{ github.run_id }}_validate
        run: bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_cleanup_container.sh"

  probe-dcu-wheels:
    name: Probe staged DCU wheels
    needs: validate-config
    if: needs.validate-config.result == 'success'
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    outputs:
      full_sha: ${{ steps.probe.outputs.full_sha }}
      short_sha: ${{ steps.probe.outputs.short_sha }}
      wheel_available: ${{ steps.probe.outputs.wheel_available }}
      wheel_urls: ${{ steps.probe.outputs.wheel_urls }}
    env:
      CHECKOUT_REF: ${{ needs.validate-config.outputs.target_ref }}
      DCU_WHEEL_STAGING_ROOT: /home/github/sgl_whl_temp
      DCU_WHEEL_STAGING_CONTAINER_ROOT: /dcu-wheel-staging
    steps:
      - name: Checkout code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-nightly-probe-wheels"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Probe local staged wheels
        id: probe
        run: |
          set -euo pipefail
          full_sha="$(git -C "${DCU_CI_CHECKOUT_DIR}" rev-parse HEAD)"
          short_sha="$(git -C "${DCU_CI_CHECKOUT_DIR}" rev-parse --short=12 HEAD)"
          export DCU_WHEEL_TARGET_SHA="${full_sha}"
          export DCU_WHEEL_TARGET_SHORT_SHA="${short_sha}"
          echo "full_sha=${full_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"

          python3 - <<'PY_PROBE' | tee /tmp/dcu_nightly_probe_wheels.out
          import os
          import pathlib
          import sys

          root = pathlib.Path(os.environ.get("DCU_WHEEL_STAGING_ROOT", "/home/github/sgl_whl_temp"))
          container_root = pathlib.Path(os.environ.get("DCU_WHEEL_STAGING_CONTAINER_ROOT", "/dcu-wheel-staging"))
          target_sha = os.environ["DCU_WHEEL_TARGET_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo_name = repo.split("/", 1)
          repo_key = f"{owner}_{repo_name}"
          def candidate_dirs():
              base = root / repo_key
              return sorted(
                  [path for path in base.glob(f"pr-*/{target_sha}") if path.is_dir()],
                  key=lambda path: path.stat().st_mtime,
                  reverse=True,
              )

          def wheel_kind(path: pathlib.Path):
              name = path.name.replace("-", "_")
              if name.startswith(("sgl_kernel_", "sglang_kernel_")):
                  return "sgl-kernel"
              if name.startswith("sglang_"):
                  return "sglang"
              return None

          def to_container_path(path: pathlib.Path) -> str:
              return str(container_root / path.relative_to(root))

          candidates = candidate_dirs()
          if not candidates:
              print("wheel_available=false")
              print(f"[probe-dcu-wheels] no staged dirs under {root / repo_key}/pr-*/{target_sha}", file=sys.stderr)
              sys.exit(0)

          for staging_dir in candidates:
              ready = staging_dir / "READY"
              wheel_dir = staging_dir / "wheels"
              if not ready.exists() or not wheel_dir.is_dir():
                  print(f"[probe-dcu-wheels] skipping incomplete staging dir {staging_dir}", file=sys.stderr)
                  continue
              found = {}
              for wheel in sorted(wheel_dir.glob("*.whl")):
                  kind = wheel_kind(wheel)
                  if kind and kind not in found:
                      found[kind] = wheel
              missing = [name for name in ("sglang", "sgl-kernel") if name not in found]
              if not missing:
                  wheel_urls = " ".join(to_container_path(found[name]) for name in ("sglang", "sgl-kernel"))
                  print("wheel_available=true")
                  print(f"wheel_urls={wheel_urls}")
                  print(f"[probe-dcu-wheels] reusing staged wheels from {staging_dir}: {wheel_urls}", file=sys.stderr)
                  sys.exit(0)
              print(f"[probe-dcu-wheels] {staging_dir} missing {missing}; found={list(found)}", file=sys.stderr)

          print("wheel_available=false")
          PY_PROBE

          wheel_available="$(grep '^wheel_available=' /tmp/dcu_nightly_probe_wheels.out | tail -n 1 | cut -d= -f2-)"
          wheel_urls="$(grep '^wheel_urls=' /tmp/dcu_nightly_probe_wheels.out | tail -n 1 | cut -d= -f2- || true)"
          echo "wheel_available=${wheel_available:-false}" >> "${GITHUB_OUTPUT}"
          echo "wheel_urls=${wheel_urls}" >> "${GITHUB_OUTPUT}"

  build-dcu-wheels:
    name: Build DCU nightly wheels
    needs:
      - validate-config
      - probe-dcu-wheels
    if: needs.validate-config.result == 'success' && needs.probe-dcu-wheels.outputs.wheel_available != 'true'
    runs-on: [self-hosted, dcu, nmz4]
    timeout-minutes: 180
    container:
      image: harbor.sourcefind.cn:5443/dcu/admin/base/dev:rockylinux8.6-mpi5.0-gcc10.3-cmake3.29-py3.10-mkl2020.4.304
      options: >
        --device=/dev/kfd --device=/dev/dri/ --group-add video
        -v /opt/hyhal/:/opt/hyhal/:ro
        --shm-size=80G
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged=true
        -v /home/github/sgl_whl_temp:/home/github/sgl_whl_temp
    env:
      TORCH_VERSION: '2.10.0'
      PIP_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
      PIP_TRUSTED_HOST: 10.16.1.201
      RESOURCE_SERVER: http://10.16.1.201:8000/
      DCU_RUNNER_HOST_UID: ${{ vars.DCU_RUNNER_HOST_UID || '1000' }}
      DCU_RUNNER_HOST_GID: ${{ vars.DCU_RUNNER_HOST_GID || '1000' }}
      WHEEL_COMMIT_SHA: ${{ needs.probe-dcu-wheels.outputs.full_sha }}
      DCU_WHEEL_STAGING_ROOT: /home/github/sgl_whl_temp
    steps:
      - name: Normalize workspace ownership before checkout
        run: |
          chown -R "${DCU_RUNNER_HOST_UID}:${DCU_RUNNER_HOST_GID}" "${GITHUB_WORKSPACE}" || true

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WHEEL_COMMIT_SHA }}
          submodules: 'recursive'

      - name: Install build deps
        run: |
          pip install torch==${TORCH_VERSION} build scikit-build-core cmake ninja wheel setuptools setuptools-scm setuptools-rust maturin ciupload
          wget ${RESOURCE_SERVER}/Jenkins/CompileDep/sglang/protoc-24.4-linux-x86_64.zip
          unzip protoc-24.4-linux-x86_64.zip -d /usr/local/
          chmod +x /usr/local/bin/protoc
          ln -s /usr/local/bin/protoc /usr/bin/protoc
          wget ${RESOURCE_SERVER}/Jenkins/CompileDep/sglang/rustup-init.sh
          export RUSTUP_DIST_SERVER=https://mirrors.tuna.tsinghua.edu.cn/rustup
          export RUSTUP_UPDATE_ROOT=https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup
          bash rustup-init.sh -y
          rm -rf ${HOME}/.cargo/config
          mkdir -p ${HOME}/.cargo
          cat > ${HOME}/.cargo/config << 'EOF'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'

          [source.tuna-sparse]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"

          [net]
          retry = 5
          git-fetch-with-cli = true

          [http]
          low-speed-limit = 1
          EOF

      - name: Install DTK
        run: |
          DTK_PKG_URL=${RESOURCE_SERVER}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
          cd /opt
          wget -q $DTK_PKG_URL
          tar -xzf $(basename $DTK_PKG_URL)
          mv dtk-* dtk

      - name: Build sgl-kernel (HIP)
        run: |
          source /opt/dtk/env.sh
          cd sgl-kernel && python setup_hip.py bdist_wheel
          echo "=== sgl-kernel wheel ==="
          ls -lh dist/*.whl

      - name: Build sglang python package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.5.12"
        run: |
          source /opt/dtk/env.sh
          source $HOME/.cargo/env
          cd python
          export SETUPTOOLS_SCM_PRETEND_VERSION="${SETUPTOOLS_SCM_PRETEND_VERSION}"
          python -m build --wheel --no-isolation -Cfeatures=all_hip
          echo "=== sglang wheel ==="
          ls -lh dist/*.whl

      - name: Repair and stage DCU wheels
        run: |
          source /opt/dtk/env.sh
          DTK_PKG_URL=${RESOURCE_SERVER}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
          DTK_VER=$(echo $DTK_PKG_URL | grep -oP 'dtk\K[0-9]+\.[0-9]+' | tr -d '.')
          TORCH_VER=$(echo $TORCH_VERSION | tr -d '.')
          LOCAL_VER="das.dtk${DTK_VER}.torch${TORCH_VER}.$(date +%y%m%d%H%M).g$(printf '%s' "${WHEEL_COMMIT_SHA}" | cut -c1-12)"
          echo "Local version: ${LOCAL_VER}"
          mkdir -p output
          for whl in sgl-kernel/dist/*.whl python/dist/*.whl; do
            [ -f "$whl" ] || continue
            CIUpload --repair --torch_version $TORCH_VERSION --set_local_version $LOCAL_VER --outputdir output -f "$whl"
          done
          echo "=== Repaired wheels ==="
          ls -lh output/

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          STAGING_ROOT="${DCU_WHEEL_STAGING_ROOT:-/home/github/sgl_whl_temp}"
          STAGING_DIR="${STAGING_ROOT}/${GITHUB_REPOSITORY_OWNER}_${REPO_NAME}/pr-nightly-${GITHUB_RUN_ID}/${WHEEL_COMMIT_SHA}"
          WHEEL_DIR="${STAGING_DIR}/wheels"

          echo "Saving DCU nightly wheels to ${WHEEL_DIR}"
          rm -rf "${WHEEL_DIR}"
          mkdir -p "${WHEEL_DIR}"
          cp -v output/*.whl "${WHEEL_DIR}/"

          export STAGING_DIR LOCAL_VER
          python3 - <<'PY_MANIFEST'
          import json
          import os
          import pathlib

          staging_dir = pathlib.Path(os.environ["STAGING_DIR"])
          wheel_dir = staging_dir / "wheels"
          wheels = sorted(str(path.relative_to(staging_dir)) for path in wheel_dir.glob("*.whl"))
          manifest = {
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "commit_sha": os.environ.get("WHEEL_COMMIT_SHA", ""),
              "torch_version": os.environ.get("TORCH_VERSION", ""),
              "local_version": os.environ.get("LOCAL_VER", ""),
              "source": "nightly-test-dcu",
              "wheels": wheels,
          }
          (staging_dir / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY_MANIFEST

          touch "${STAGING_DIR}/READY"
          chown -R "${DCU_RUNNER_HOST_UID}:${DCU_RUNNER_HOST_GID}" "${STAGING_DIR}" || true
          echo "DCU nightly wheels are staged locally at ${STAGING_DIR}"

  wait-dcu-wheels:
    name: Wait DCU wheels
    needs:
      - validate-config
      - probe-dcu-wheels
      - build-dcu-wheels
    if: >
      always() &&
      needs.validate-config.result == 'success' &&
      needs.probe-dcu-wheels.result == 'success' &&
      (needs.build-dcu-wheels.result == 'success' || needs.build-dcu-wheels.result == 'skipped')
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    outputs:
      wheel_urls: ${{ steps.wait.outputs.wheel_urls }}
    env:
      DCU_WHEEL_STAGING_ROOT: /home/github/sgl_whl_temp
      DCU_WHEEL_STAGING_CONTAINER_ROOT: /dcu-wheel-staging
      DCU_WHEEL_TARGET_SHA: ${{ needs.probe-dcu-wheels.outputs.full_sha }}
      DCU_WHEEL_TARGET_SHORT_SHA: ${{ needs.probe-dcu-wheels.outputs.short_sha }}
      PROBE_WHEEL_AVAILABLE: ${{ needs.probe-dcu-wheels.outputs.wheel_available }}
      PROBE_WHEEL_URLS: ${{ needs.probe-dcu-wheels.outputs.wheel_urls }}
    steps:
      - name: Wait for current commit DCU wheels
        id: wait
        run: |
          set -euo pipefail
          if [[ "${PROBE_WHEEL_AVAILABLE}" == "true" ]]; then
            echo "Reusing existing staged DCU wheels for ${DCU_WHEEL_TARGET_SHA}: ${PROBE_WHEEL_URLS}"
            echo "wheel_urls=${PROBE_WHEEL_URLS}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Waiting for newly staged DCU wheels for ${DCU_WHEEL_TARGET_SHA}"
          echo "Host staging root: ${DCU_WHEEL_STAGING_ROOT}"
          python3 - <<'PY_WAIT' | tee /tmp/dcu_nightly_wheel_paths.out
          import os
          import pathlib
          import sys
          import time

          root = pathlib.Path(os.environ.get("DCU_WHEEL_STAGING_ROOT", "/home/github/sgl_whl_temp"))
          container_root = pathlib.Path(os.environ.get("DCU_WHEEL_STAGING_CONTAINER_ROOT", "/dcu-wheel-staging"))
          target_sha = os.environ["DCU_WHEEL_TARGET_SHA"]
          short_sha = os.environ.get("DCU_WHEEL_TARGET_SHORT_SHA", target_sha[:12])
          repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo_name = repo.split("/", 1)
          repo_key = f"{owner}_{repo_name}"
          timeout_s = int(os.environ.get("DCU_WHEEL_WAIT_TIMEOUT", "3600"))
          interval_s = int(os.environ.get("DCU_WHEEL_WAIT_INTERVAL", "60"))

          def candidate_dirs():
              base = root / repo_key
              return sorted(
                  [path for path in base.glob(f"pr-*/{target_sha}") if path.is_dir()],
                  key=lambda path: path.stat().st_mtime,
                  reverse=True,
              )

          def wheel_kind(path: pathlib.Path):
              name = path.name.replace("-", "_")
              if name.startswith(("sgl_kernel_", "sglang_kernel_")):
                  return "sgl-kernel"
              if name.startswith("sglang_"):
                  return "sglang"
              return None

          def to_container_path(path: pathlib.Path) -> str:
              return str(container_root / path.relative_to(root))

          deadline = time.time() + timeout_s
          while time.time() < deadline:
              candidates = candidate_dirs()
              if not candidates:
                  print(f"[wait-dcu-wheels] no staged dirs under {root / repo_key}/pr-*/{target_sha}", file=sys.stderr)
              for staging_dir in candidates:
                  ready = staging_dir / "READY"
                  wheel_dir = staging_dir / "wheels"
                  if not ready.exists():
                      print(f"[wait-dcu-wheels] {staging_dir} has no READY", file=sys.stderr)
                      continue
                  if not wheel_dir.is_dir():
                      print(f"[wait-dcu-wheels] {staging_dir} has no wheels directory", file=sys.stderr)
                      continue
                  found = {}
                  for wheel in sorted(wheel_dir.glob("*.whl")):
                      kind = wheel_kind(wheel)
                      if kind and kind not in found:
                          found[kind] = wheel
                  missing = [name for name in ("sglang", "sgl-kernel") if name not in found]
                  if not missing:
                      paths = [to_container_path(found[name]) for name in ("sglang", "sgl-kernel")]
                      print(f"[wait-dcu-wheels] found staged wheels in {staging_dir}: {' '.join(paths)}", file=sys.stderr)
                      print(" ".join(paths))
                      sys.exit(0)
                  print(f"[wait-dcu-wheels] {staging_dir} missing {missing}; found={list(found)}", file=sys.stderr)
              print(f"[wait-dcu-wheels] waiting for local staged wheels for {short_sha}; sleep {interval_s}s", file=sys.stderr)
              time.sleep(interval_s)

          print(f"Timed out waiting for locally staged DCU wheels for {target_sha}", file=sys.stderr)
          sys.exit(1)
          PY_WAIT

          wheel_urls="$(tail -n 1 /tmp/dcu_nightly_wheel_paths.out)"
          if [[ -z "${wheel_urls}" ]]; then
            echo "No local staged wheel paths were produced." >&2
            exit 1
          fi
          echo "wheel_urls=${wheel_urls}" >> "${GITHUB_OUTPUT}"
          echo "DCU_CI_INSTALL_WHEEL_URLS=${wheel_urls}"

  nightly-dcu:
    name: Nightly DCU (${{ matrix.name }})
    needs:
      - validate-config
      - probe-dcu-wheels
      - build-dcu-wheels
      - wait-dcu-wheels
    if: >
      always() &&
      needs.validate-config.result == 'success' &&
      needs.probe-dcu-wheels.result == 'success' &&
      (needs.build-dcu-wheels.result == 'success' || needs.build-dcu-wheels.result == 'skipped') &&
