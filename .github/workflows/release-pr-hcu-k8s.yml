# Shadow run of release-pr-hcu.yml on the ARC K8s hygon-build pool.
#
# Builds the same HCU PR wheels as release-pr-hcu.yml (which still uses the
# [ci, bw1100] host runners) so the two can be compared. hygon-build has no
# card; its job template mounts /opt/hyhal read-only and /ci_public, so the
# docker device, privileged and volume options are gone. Wheels are staged
# under the same /ci_public layout, keyed by this run's ID.
#
# pr-test-hcu-k8s.yml calls this after its PR gate and passes wheel_paths to
# its test jobs, so tests always wait for and use this run's wheels. There is
# no pull_request_target trigger, so a PR is not built twice.
# Rollback: delete this file and the build-wheels job in pr-test-hcu-k8s.yml.
name: Release PR HCU Wheels (K8s)

permissions:
  contents: read
  pull-requests: read

on:
  workflow_call:
    inputs:
      commit_sha:
        description: 'Commit or ref to build; empty uses the PR head SHA'
        required: false
        default: ''
        type: string
      target_branch:
        description: 'Build target; empty uses the PR base branch'
        required: false
        default: ''
        type: string
      torch_version:
        description: 'PyTorch version override; empty selects the target branch default'
        required: false
        default: ''
        type: string
      skip_gateway:
        description: 'Skip sgl-model-gateway build'
        required: false
        default: false
        type: boolean
    outputs:
      wheel_paths:
        description: 'Space-separated paths of the staged wheels under /ci_public'
        value: ${{ jobs.compile.outputs.wheel_paths }}

  # ---- 手动触发，可传参 ----
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Build target for manual validation; required on temporary branches (e.g. main)'
        required: false
        default: ''
        type: string
      torch_version:
        description: 'PyTorch version override; empty selects the target branch default'
        required: false
        default: ''
        type: string
      skip_gateway:
        description: 'Skip sgl-model-gateway build'
        required: false
        default: false
        type: boolean

jobs:
  # container.image is fixed when the job starts, so pin the tag to a digest
  # in a helper job first.
  resolve-image:
    concurrency:
      group: release-pr-hcu-k8s-resolve-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: hygon-cpu
    timeout-minutes: 10
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Resolve immutable HCU image
        id: image
        env:
          # Select by PR base, not by the untrusted source branch. Dispatch uses its selected ref.
          IMAGE: ${{ ((github.event.pull_request.base.ref || inputs.target_branch || github.ref_name) == 'main' || (github.event.pull_request.base.ref || inputs.target_branch || github.ref_name) == 'release/20260825_v0.5.18' || (github.event.pull_request.base.ref || inputs.target_branch || github.ref_name) == 'feat/20260920_deepseek-v4.1') && (vars.HCU_CI_IMAGE_0518 || '10.16.1.152:5000/jenkins/model_test_env/sglang:0.5.18-latest') || vars.HCU_CI_RELEASE_IMAGE }}
        run: |
          set -euo pipefail
          image="${IMAGE}"
          if [[ -z "${image}" ]]; then
            echo "::error::HCU build image is empty. Set vars.HCU_CI_IMAGE_0518 / vars.HCU_CI_RELEASE_IMAGE."
            exit 1
          fi

          if [[ "${image}" != *@sha256:* ]]; then
            registry="${image%%/*}"
            path="${image#*/}"
            if [[ "${path##*/}" == *:* ]]; then
              repo="${path%:*}"
              tag="${path##*:}"
            else
              repo="${path}"
              tag=latest
            fi
            digest=""
            for scheme in http https; do
              digest="$(curl -fsSkI --max-time 30 \
                -H 'Accept: application/vnd.oci.image.index.v1+json' \
                -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
                -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
                -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
                "${scheme}://${registry}/v2/${repo}/manifests/${tag}" \
                | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" {print $2}')" || true
              if [[ -n "${digest}" ]]; then
                break
              fi
            done
            if [[ -n "${digest}" ]]; then
              image="${registry}/${repo}@${digest}"
            else
              echo "::warning::Could not resolve a digest for ${image}; using the tag as is."
            fi
          fi

          echo "Using HCU image: ${image}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

  compile:
    needs: resolve-image
    outputs:
      wheel_paths: ${{ steps.stage.outputs.wheel_paths }}
    # ---- 并发控制: 同一分支 + 同一 Python 版本的 job 只保留最新一个 ----
    concurrency:
      group: release-pr-hcu-k8s-${{ github.event.pull_request.number || github.ref }}-py${{ matrix.python-version }}
      cancel-in-progress: true
    # ---- K8s 编译池，不占卡；job 直接运行在 container.image 中 ----
    runs-on: hygon-build
    # Includes up to 15 minutes waiting for build resources.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    container:
      image: ${{ needs.resolve-image.outputs.image }}

    # ---- Matrix: 3 个 Python 版本并行编译 ----
    strategy:
      matrix:
        python-version: ['3.10']

    env:
      TORCH_VERSION: ${{ inputs.torch_version || (((github.event.pull_request.base.ref || inputs.target_branch || github.ref_name) == 'main' || (github.event.pull_request.base.ref || inputs.target_branch || github.ref_name) == 'release/20260825_v0.5.18' || (github.event.pull_request.base.ref || inputs.target_branch || github.ref_name) == 'feat/20260920_deepseek-v4.1') && '2.11.0' || '2.10.0') }}
      SGLANG_PACKAGE_VERSION: ${{ ((github.event.pull_request.base.ref || inputs.target_branch || github.ref_name) == 'main' || (github.event.pull_request.base.ref || inputs.target_branch || github.ref_name) == 'release/20260825_v0.5.18' || (github.event.pull_request.base.ref || inputs.target_branch || github.ref_name) == 'feat/20260920_deepseek-v4.1') && '0.5.18' || '0.5.15.post1' }}
      SKIP_GATEWAY: ${{ inputs.skip_gateway || false }}
      PIP_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
      PIP_TRUSTED_HOST: 10.16.1.201
      RESOURCE_SERVER: http://10.16.1.201:8000/
      # Resolved to the full SHA after checkout; the manifest and the test
      # side compare it with `git rev-parse HEAD`.
      WHEEL_REF: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.sha }}
      HCU_WHEEL_STAGING_ROOT: /ci_public/sglang-das/hcu-wheel-staging

    # Workspace ownership and safe.directory steps from release-pr-hcu.yml are
    # dropped: the job Pod and its workspace are deleted after the job, and the
    # job template already sets safe.directory.
    steps:
      - name: Validate manual build target
        if: github.event_name == 'workflow_dispatch'
        env:
          BUILD_TARGET: ${{ inputs.target_branch || github.ref_name }}
        run: |
          case "${BUILD_TARGET}" in
            main|release/20260825_v0.5.18|feat/20260920_deepseek-v4.1|v0.5.12_dev|v0.5.15.post1_dev) ;;
            *) echo "::error::Set target_branch to the intended base branch for manual builds."; exit 1 ;;
          esac

      - name: Verify image Torch version before building extensions
        run: |
          python3 - <<'PY'
          import os
          import torch

          expected = os.environ["TORCH_VERSION"]
          actual = torch.__version__
          print(f"Build Torch: {actual}; expected: {expected}")
          if actual.split("+", 1)[0] != expected.split("+", 1)[0]:
              raise SystemExit(
                  "HCU build image and TORCH_VERSION do not match. "
                  "Select a matching HCU image instead of replacing its Torch installation."
              )
          PY

      # =======================================================================
      # 环境准备
      # =======================================================================

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.WHEEL_REF }}
          submodules: 'recursive'
          persist-credentials: false

      - name: Resolve wheel commit SHA
        run: |
          echo "WHEEL_COMMIT_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      # 容器内已预装 Python 3.10 + DTK/ROCm + gcc + cmake
      - name: Install build deps
        run: |
          pip install build scikit-build-core cmake ninja wheel setuptools setuptools-scm setuptools-rust maturin ciupload
          wget ${RESOURCE_SERVER}/Jenkins/CompileDep/sglang/protoc-24.4-linux-x86_64.zip
          unzip protoc-24.4-linux-x86_64.zip -d /usr/local/
          chmod +x /usr/local/bin/protoc
          ln -s /usr/local/bin/protoc /usr/bin/protoc
          wget ${RESOURCE_SERVER}/Jenkins/CompileDep/sglang/rustup-init.sh
          export RUSTUP_DIST_SERVER=https://mirrors.tuna.tsinghua.edu.cn/rustup
          export RUSTUP_UPDATE_ROOT=https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup
          bash rustup-init.sh -y
          rm -rf ${HOME}/.cargo/config
          mkdir -p ${HOME}/.cargo
          cat > ${HOME}/.cargo/config << 'EOF'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'

          [source.tuna-sparse]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"

          [net]
          retry = 5
          git-fetch-with-cli = true

          [http]
          low-speed-limit = 1
          EOF

      - name: Install DTK
        run: |
          DTK_PKG_URL=${RESOURCE_SERVER}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
          cd /opt
          wget -q $DTK_PKG_URL
          tar -xzf $(basename $DTK_PKG_URL)
          mv dtk-* dtk

      # =======================================================================
      # 路径检测: 决定哪些组件需要编译
      # =======================================================================

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            sgl-kernel:
              - 'python/sglang/kernels/aot/**'
            sglang:
              - 'python/**'
              - 'rust/**'
            gateway:
              - 'sgl-model-gateway/**'

      # =======================================================================
      # 编译阶段: 按检测结果增量编译
      # workflow_dispatch 时忽略检测结果，全量编译
      # =======================================================================

      - name: Build sgl-kernel (HIP)
        run: |
          source /opt/dtk/env.sh
          if [[ -f sgl-kernel/setup_hip.py ]]; then
            cd sgl-kernel && python setup_hip.py bdist_wheel
          else
            cd python/sglang/kernels/aot && python setup_hip.py bdist_wheel
          fi
          echo "=== sgl-kernel wheel ==="
          ls -lh dist/*.whl

      - name: Build sglang python package
        # if: steps.changes.outputs.sglang == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ env.SGLANG_PACKAGE_VERSION }}
        run: |
          source /opt/dtk/env.sh
          source $HOME/.cargo/env
          cd python
          # Use the existing HCU build metadata, as the HCU nightly publisher does.
          [ -f pyproject_hcu.toml ] && cp pyproject_hcu.toml pyproject.toml
          export SETUPTOOLS_SCM_PRETEND_VERSION="${SETUPTOOLS_SCM_PRETEND_VERSION}"
          export CARGO="$HOME/.cargo/bin/cargo"
          export RUSTC="$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/rustc"
          python -m build --wheel --no-isolation -Cfeatures=all_hip
          echo "=== sglang wheel ==="
          ls -lh dist/*.whl

      - name: Build sgl-model-gateway
        if: ${{ env.SKIP_GATEWAY != 'true' && (steps.changes.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch') }}
        run: |
          source /opt/dtk/env.sh
          source $HOME/.cargo/env
          export RUSTUP_DIST_SERVER=https://mirrors.ustc.edu.cn/rust-static
          export RUSTUP_UPDATE_ROOT=https://mirrors.ustc.edu.cn/rust-static/rustup
          cd sgl-model-gateway && cargo build --release --features vendored-openssl
          cd bindings/python && maturin build --release --skip-auditwheel --features vendored-openssl --out "${GITHUB_WORKSPACE}/sgl-model-gateway/target/wheels"
          echo "=== sgl-model-gateway wheel ==="
          ls -lh "${GITHUB_WORKSPACE}"/sgl-model-gateway/target/wheels/*.whl

      # =======================================================================
      # 修复 (auditwheel) & 保存 PR wheel 到本地 staging
      # =======================================================================

      - name: Apply DAS local version to wheels
        id: stage
        run: |
          source /opt/dtk/env.sh
          DTK_PKG_URL=${RESOURCE_SERVER}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
          DTK_VER=$(echo $DTK_PKG_URL | grep -oP 'dtk\K[0-9]+\.[0-9]+' | tr -d '.')
          mkdir -p output
          shopt -s nullglob
          wheels=(sgl-kernel/dist/*.whl python/sglang/kernels/aot/dist/*.whl python/dist/*.whl sgl-model-gateway/target/wheels/*.whl)
          if (( ${#wheels[@]} == 0 )); then
            echo "No HCU wheels were built" >&2
            exit 1
          fi
          CIUpload REPAIR \
            --dtk_version "${DTK_VER}" \
            --torch_version "${TORCH_VERSION}" \
            --git_commit "${WHEEL_COMMIT_SHA}" \
            --outputdir output \
            -f "${wheels[@]}"
          echo "=== Repaired wheels ==="
          ls -lh output/

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          STAGING_ROOT="${HCU_WHEEL_STAGING_ROOT:-/ci_public/sglang-das/hcu-wheel-staging}"
          STAGING_DIR="${STAGING_ROOT}/${GITHUB_REPOSITORY_OWNER}_${REPO_NAME}/pr-${GITHUB_RUN_ID}/${WHEEL_COMMIT_SHA}"
          WHEEL_DIR="${STAGING_DIR}/wheels"

          echo "Saving HCU PR wheels to ${WHEEL_DIR}"
          rm -rf "${WHEEL_DIR}"
          mkdir -p "${WHEEL_DIR}"
          cp -v output/*.whl "${WHEEL_DIR}/"

          export STAGING_DIR
          python3 - <<'PY_MANIFEST'
          from email.parser import Parser
          import json
          import os
          import pathlib
          import zipfile

          staging_dir = pathlib.Path(os.environ["STAGING_DIR"])
          wheel_dir = staging_dir / "wheels"
          wheel_paths = sorted(wheel_dir.glob("*.whl"))
          wheel_local_versions = {}
          for path in wheel_paths:
              with zipfile.ZipFile(path) as archive:
                  metadata_names = [
                      name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
                  ]
                  if len(metadata_names) != 1:
                      raise RuntimeError(f"Expected one METADATA file in {path.name}")
                  metadata = Parser().parsestr(
                      archive.read(metadata_names[0]).decode("utf-8")
                  )
              version = metadata.get("Version", "")
              # Validate the repaired wheel, not just its externally visible filename.
              filename_version = path.name.split("-")[1]
              if filename_version != version:
                  raise RuntimeError(f"Wheel filename/METADATA mismatch: {path.name}: {version}")
              if metadata.get("Name", "").lower().replace("_", "-") == "sglang":
                  expected = os.environ["SGLANG_PACKAGE_VERSION"]
                  if version.partition("+")[0] != expected:
                      raise RuntimeError(f"Incorrect SGLang package version: {version}; expected {expected}")
              _, separator, local_version = version.partition("+")
              if not separator or not local_version:
                  raise RuntimeError(f"Missing local version in {path.name}: {version}")
              wheel_local_versions[path.name] = local_version
          unique_local_versions = set(wheel_local_versions.values())
          local_version = next(iter(unique_local_versions)) if len(unique_local_versions) == 1 else None
          wheels = [str(path.relative_to(staging_dir)) for path in wheel_paths]
          manifest = {
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "commit_sha": os.environ.get("WHEEL_COMMIT_SHA", ""),
              "torch_version": os.environ.get("TORCH_VERSION", ""),
              "local_version": local_version,
              "wheel_local_versions": wheel_local_versions,
              "wheels": wheels,
          }
          (staging_dir / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY_MANIFEST

          touch "${STAGING_DIR}/READY"
          echo "HCU PR wheels are staged locally at ${STAGING_DIR}"
          staged_wheels=("${WHEEL_DIR}"/*.whl)
          echo "wheel_paths=${staged_wheels[*]}" >> "${GITHUB_OUTPUT}"

      - name: Report staged PR wheels
        run: |
          echo "HCU PR wheels are staged locally under /ci_public/sglang-das/hcu-wheel-staging."
          echo "Skipping devpi and GitHub artifact upload for PR wheels."