            nightly: "true"
            part: 0
            parts: 2
            timeout_per_file: 2400
            timeout_minutes: 150
          - name: perf-1
            suite: nightly-dcu-perf
            nightly: "true"
            part: 1
            parts: 2
            timeout_per_file: 2400
            timeout_minutes: 150
          - name: vlm-0
            suite: nightly-dcu-vlm
            nightly: "true"
            part: 0
            parts: 2
            timeout_per_file: 7800
