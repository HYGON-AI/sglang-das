name: DCU Full Enabled

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref, branch, tag, or SHA to test"
        required: false
        type: string
        default: ""
      runner_label:
        description: "DCU runner label override"
        required: false
        type: string
        default: ""
      image:
        description: "DCU CI container image override"
        required: false
        type: string
        default: ""
      continue_on_error:
        description: "Continue running remaining files after a test failure"
        required: false
        type: boolean
        default: true
      force_wheel_mode:
        description: "Force waiting for and installing current commit DCU wheels"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dcu-full-enabled-${{ github.event_name }}-${{ github.head_ref || github.ref_name || 'default' }}-${{ inputs.ref || 'current' }}
  cancel-in-progress: true

jobs:
  check-full-trigger:
    name: Check full trigger
    runs-on: ${{ inputs.runner_label || vars.DCU_CI_RUNNER_LABEL }}
    outputs:
      should_run: ${{ steps.trigger.outputs.should_run }}
    steps:
      - name: Check run-dcu-full label
        id: trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-dcu-full') || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${HAS_FULL_LABEL}" != "true" ]]; then
            echo "DCU full enabled run is disabled. Add the 'run-dcu-full' label to this PR, or use the temporary 'run-ci' compatibility gate on the dcu-ci-pr validation branch."
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_ACTION}" == "labeled" && "${EVENT_LABEL}" != "run-dcu-full" ]]; then
            echo "Ignoring unrelated label event: ${EVENT_LABEL}"
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "should_run=true" >> "${GITHUB_OUTPUT}"

  validate-config:
    name: Validate DCU full config
    needs: check-full-trigger
    if: needs.check-full-trigger.outputs.should_run == 'true'
    runs-on: ${{ inputs.runner_label || vars.DCU_CI_RUNNER_LABEL }}
    outputs:
      runner_label: ${{ steps.resolve.outputs.runner_label }}
      image: ${{ steps.resolve.outputs.image }}
      continue_on_error_flag: ${{ steps.resolve.outputs.continue_on_error_flag }}
    steps:
      - name: Checkout code
        env:
          CHECKOUT_REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-full-validate"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Resolve DCU runner and image
        id: resolve
        env:
          INPUT_RUNNER_LABEL: ${{ inputs.runner_label || '' }}
          INPUT_IMAGE: ${{ inputs.image || '' }}
          VAR_RUNNER_LABEL: ${{ vars.DCU_CI_RUNNER_LABEL || '' }}
          VAR_IMAGE: ${{ vars.DCU_CI_IMAGE || '' }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error || '' }}
        run: |
          runner_label="${INPUT_RUNNER_LABEL:-${VAR_RUNNER_LABEL}}"
          if [[ "${runner_label}" == "dcu-ci-pr" ]]; then
            echo "Routing validation runner label dcu-ci-pr to dcu-ci-pr-2 for nmz4 test runner."
            runner_label="dcu-ci-pr-2"
          fi
          image="${INPUT_IMAGE:-${VAR_IMAGE}}"
          continue_on_error="${CONTINUE_ON_ERROR:-true}"

          if [[ -z "${runner_label}" ]]; then
            echo "::error::DCU runner label is required. Set vars.DCU_CI_RUNNER_LABEL or workflow input runner_label."
            exit 1
          fi

          if [[ -z "${image}" ]]; then
            echo "::error::DCU CI image is required. Set vars.DCU_CI_IMAGE or workflow input image."
            exit 1
          fi

          continue_on_error_flag=""
          if [[ "${continue_on_error}" == "true" ]]; then
            continue_on_error_flag="--continue-on-error"
          fi

          echo "runner_label=${runner_label}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "continue_on_error_flag=${continue_on_error_flag}" >> "${GITHUB_OUTPUT}"

      - name: Setup DCU validation container
        env:
          DCU_CI_IMAGE: ${{ steps.resolve.outputs.image }}
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_full_${{ github.run_id }}_validate
          DCU_CI_SKIP_PULL: ${{ vars.DCU_CI_SKIP_PULL || '' }}
          DCU_CI_VISIBLE_DEVICES: ${{ vars.DCU_CI_VISIBLE_DEVICES || '' }}
        run: |
          GITHUB_WORKSPACE="${DCU_CI_CHECKOUT_DIR}" \
            bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_start_container.sh" \
              --image "${DCU_CI_IMAGE}" \
              --container-name "${DCU_CI_CONTAINER_NAME}"

      - name: Verify DCU registration in container
        env:
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_full_${{ github.run_id }}_validate
        run: |
          bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_exec.sh" \
            --container-name "${DCU_CI_CONTAINER_NAME}" \
            -w /sglang-checkout \
            -- python3 scripts/ci/dcu/verify_dcu_registration.py

      - name: Cleanup DCU validation container
        if: always()
        env:
          DCU_CI_CONTAINER_NAME: ci_sglang_dcu_full_${{ github.run_id }}_validate
        run: bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_cleanup_container.sh"

  wait-dcu-wheels:
    name: Wait DCU wheels
    needs: validate-config
    if: needs.validate-config.result == 'success' && inputs.force_wheel_mode == true
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    outputs:
      wheel_urls: ${{ steps.wait.outputs.wheel_urls }}
    env:
      DCU_WHEEL_STAGING_ROOT: /home/github/sgl_whl_temp
      DCU_WHEEL_STAGING_CONTAINER_ROOT: /dcu-wheel-staging
      CHECKOUT_REF: ${{ inputs.ref || github.sha }}
    steps:
      - name: Checkout code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-full-wait-wheels"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Resolve wheel target SHA
        id: sha
        run: |
          set -euo pipefail
          full_sha="$(git -C "${DCU_CI_CHECKOUT_DIR}" rev-parse HEAD)"
          short_sha="$(git -C "${DCU_CI_CHECKOUT_DIR}" rev-parse --short=12 HEAD)"
          echo "full_sha=${full_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "Using wheel SHA: ${full_sha} (${short_sha})"

      - name: Wait for current commit DCU wheels
        id: wait
        run: |
          set -euo pipefail
          full_sha="${{ steps.sha.outputs.full_sha }}"
          short_sha="${{ steps.sha.outputs.short_sha }}"
          export DCU_WHEEL_TARGET_SHA="${full_sha}"
          export DCU_WHEEL_TARGET_SHORT_SHA="${short_sha}"
          echo "Waiting for locally staged DCU wheels for ${full_sha}"
          echo "Host staging root: ${DCU_WHEEL_STAGING_ROOT}"

          python3 - <<'PY_WAIT' | tee /tmp/dcu_wheel_paths.out
          import os
          import pathlib
          import sys
          import time

          root = pathlib.Path(os.environ.get("DCU_WHEEL_STAGING_ROOT", "/home/github/sgl_whl_temp"))
          container_root = pathlib.Path(os.environ.get("DCU_WHEEL_STAGING_CONTAINER_ROOT", "/dcu-wheel-staging"))
          target_sha = os.environ["DCU_WHEEL_TARGET_SHA"]
          short_sha = os.environ.get("DCU_WHEEL_TARGET_SHORT_SHA", target_sha[:12])
          repo = os.environ["GITHUB_REPOSITORY"]
          owner, repo_name = repo.split("/", 1)
          repo_key = f"{owner}_{repo_name}"
          gateway_required = os.environ.get("GATEWAY_WHEEL_REQUIRED", "false") == "true"
          timeout_s = int(os.environ.get("DCU_WHEEL_WAIT_TIMEOUT", "3600"))
          interval_s = int(os.environ.get("DCU_WHEEL_WAIT_INTERVAL", "60"))

          requirements = ["sglang", "sgl-kernel"]
          if gateway_required:
              requirements.append("sgl-model-gateway")

          def wheel_kind(path: pathlib.Path):
              name = path.name.replace("-", "_")
              if name.startswith(("sgl_kernel_", "sglang_kernel_")):
                  return "sgl-kernel"
              if name.startswith("sgl_model_gateway_"):
                  return "sgl-model-gateway"
              if name.startswith("sglang_"):
                  return "sglang"
              return None

          def to_container_path(path: pathlib.Path) -> str:
              return str(container_root / path.relative_to(root))

          def candidate_dirs():
              base = root / repo_key
              return sorted(
                  [path for path in base.glob(f"pr-*/{target_sha}") if path.is_dir()],
                  key=lambda path: path.stat().st_mtime,
                  reverse=True,
              )

          deadline = time.time() + timeout_s
          while time.time() < deadline:
              candidates = candidate_dirs()
              if not candidates:
                  print(f"[wait-dcu-wheels] no staged dirs under {root / repo_key}/pr-*/{target_sha}", file=sys.stderr)
              for staging_dir in candidates:
                  ready = staging_dir / "READY"
                  wheel_dir = staging_dir / "wheels"
                  if not ready.exists():
                      print(f"[wait-dcu-wheels] {staging_dir} has no READY", file=sys.stderr)
                      continue
                  if not wheel_dir.is_dir():
                      print(f"[wait-dcu-wheels] {staging_dir} has no wheels directory", file=sys.stderr)
                      continue
                  found = {}
                  for wheel in sorted(wheel_dir.glob("*.whl")):
                      kind = wheel_kind(wheel)
                      if kind and kind not in found:
                          found[kind] = wheel
                  missing = [name for name in requirements if name not in found]
                  if not missing:
                      paths = [to_container_path(found[name]) for name in requirements]
                      print(f"[wait-dcu-wheels] found staged wheels in {staging_dir}: {' '.join(paths)}", file=sys.stderr)
                      print(" ".join(paths))
                      sys.exit(0)
                  print(f"[wait-dcu-wheels] {staging_dir} missing {missing}; found={list(found)}", file=sys.stderr)
              print(f"[wait-dcu-wheels] waiting for local staged wheels for {short_sha}; sleep {interval_s}s", file=sys.stderr)
              time.sleep(interval_s)

          print(f"Timed out waiting for locally staged DCU wheels for {target_sha}", file=sys.stderr)
          sys.exit(1)
          PY_WAIT
          wheel_urls="$(tail -n 1 /tmp/dcu_wheel_paths.out)"
          if [[ -z "${wheel_urls}" ]]; then
            echo "No local staged wheel paths were produced." >&2
            exit 1
          fi
          echo "wheel_urls=${wheel_urls}" >> "${GITHUB_OUTPUT}"

  full-enabled-dcu:
    name: Full enabled DCU (${{ matrix.name }})
    needs:
      - validate-config
      - wait-dcu-wheels
    if: always() && needs.validate-config.result == 'success' && (needs.wait-dcu-wheels.result == 'success' || needs.wait-dcu-wheels.result == 'skipped')
    runs-on: ${{ needs.validate-config.outputs.runner_label }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: stage-a
            suite: stage-a-test-1-gpu-small-dcu
            nightly: "false"
            part: 0
            parts: 1
            timeout_per_file: 1200
            timeout_minutes: 90
          - name: stage-b-small-0
            suite: stage-b-test-1-gpu-small-dcu
            nightly: "false"
            part: 0
            parts: 4
            timeout_per_file: 1800
            timeout_minutes: 180
          - name: stage-b-small-1
            suite: stage-b-test-1-gpu-small-dcu
            nightly: "false"
            part: 1
            parts: 4
            timeout_per_file: 1800
            timeout_minutes: 180
          - name: stage-b-small-2
            suite: stage-b-test-1-gpu-small-dcu
            nightly: "false"
            part: 2
            parts: 4
            timeout_per_file: 1800
            timeout_minutes: 180
          - name: stage-b-small-3
            suite: stage-b-test-1-gpu-small-dcu
            nightly: "false"
            part: 3
            parts: 4
            timeout_per_file: 1800
            timeout_minutes: 180
          - name: stage-b-large
            suite: stage-b-test-1-gpu-large-dcu
            nightly: "false"
            part: 0
            parts: 1
            timeout_per_file: 2400
            timeout_minutes: 150
          - name: stage-b-2gpu
            suite: stage-b-test-2-gpu-large-dcu
            nightly: "false"
            part: 0
            parts: 1
            timeout_per_file: 1200
            timeout_minutes: 90
          - name: nightly-dcu-0
            suite: nightly-dcu
            nightly: "true"
            part: 0
            parts: 3
            timeout_per_file: 3000
            timeout_minutes: 180
          - name: nightly-dcu-1
            suite: nightly-dcu
            nightly: "true"
            part: 1
            parts: 3
            timeout_per_file: 3000
            timeout_minutes: 180
          - name: nightly-dcu-2
            suite: nightly-dcu
            nightly: "true"
            part: 2
            parts: 3
            timeout_per_file: 3000
            timeout_minutes: 180
          - name: nightly-dcu-1gpu
            suite: nightly-dcu-1-gpu
            nightly: "true"
            part: 0
            parts: 1
            timeout_per_file: 1200
            timeout_minutes: 90
          - name: accuracy-0
            suite: nightly-dcu-accuracy
            nightly: "true"
            part: 0
            parts: 2
            timeout_per_file: 4200
            timeout_minutes: 180
          - name: accuracy-1
