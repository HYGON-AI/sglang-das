            timeout_minutes: 180
            visible_devices: "4,5,6,7"
          - name: large-model-8gpu-0
            suite: nightly-dcu-large-model-8gpu
            nightly: "true"
            part: 0
            parts: 4
            timeout_per_file: 15000
            timeout_minutes: 480
          - name: large-model-8gpu-1
            suite: nightly-dcu-large-model-8gpu
            nightly: "true"
            part: 1
            parts: 4
            timeout_per_file: 15000
            timeout_minutes: 480
          - name: large-model-8gpu-2
            suite: nightly-dcu-large-model-8gpu
            nightly: "true"
            part: 2
            parts: 4
            timeout_per_file: 15000
            timeout_minutes: 480
          - name: large-model-8gpu-3
            suite: nightly-dcu-large-model-8gpu
            nightly: "true"
            part: 3
            parts: 4
            timeout_per_file: 15000
            timeout_minutes: 480
          - name: quant-opt-0
            suite: nightly-dcu-quant-opt
            nightly: "true"
            part: 0
            parts: 4
            timeout_per_file: 15000
            timeout_minutes: 480
          - name: quant-opt-1
            suite: nightly-dcu-quant-opt
            nightly: "true"
            part: 1
            parts: 4
            timeout_per_file: 15000
            timeout_minutes: 480
          - name: quant-opt-2
            suite: nightly-dcu-quant-opt
            nightly: "true"
            part: 2
            parts: 4
            timeout_per_file: 15000
            timeout_minutes: 480
          - name: quant-opt-3
            suite: nightly-dcu-quant-opt
            nightly: "true"
            part: 3
            parts: 4
            timeout_per_file: 15000
            timeout_minutes: 480
    env:
      DCU_CI_IMAGE: ${{ needs.validate-config.outputs.image }}
      DCU_CI_CONTAINER_NAME: ci_sglang_dcu_full_${{ github.run_id }}_${{ matrix.name }}
      DCU_CI_SKIP_PULL: ${{ vars.DCU_CI_SKIP_PULL || '' }}
      DCU_CI_SKIP_DEPENDENCY_INSTALL: ${{ vars.DCU_CI_SKIP_DEPENDENCY_INSTALL || '' }}
      DCU_CI_SKIP_REQUIREMENTS_INSTALL: ${{ vars.DCU_CI_SKIP_REQUIREMENTS_INSTALL || '' }}
      DCU_CI_SKIP_SGLANG_BUILD: ${{ vars.DCU_CI_SKIP_SGLANG_BUILD || '' }}
      DCU_CI_VISIBLE_DEVICES: ${{ matrix.visible_devices || vars.DCU_CI_VISIBLE_DEVICES || '' }}
      DCU_CI_INSTALL_WHEEL_URLS: ${{ needs.wait-dcu-wheels.outputs.wheel_urls || '' }}
      DCU_WHEEL_STAGING_ROOT: /home/github/sgl_whl_temp
      DCU_WHEEL_STAGING_CONTAINER_ROOT: /dcu-wheel-staging
      DCU_CI_USE_INSTALLED_WHEELS: ${{ inputs.force_wheel_mode == true && '1' || '' }}
    steps:
      - name: Checkout code
        env:
          CHECKOUT_REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKOUT_DIR="${RUNNER_TEMP}/dcu-sglang-${GITHUB_RUN_ID}-full-${{ matrix.name }}"
          rm -rf "${CHECKOUT_DIR}"
          mkdir -p "${CHECKOUT_DIR}"
          echo "DCU_CI_CHECKOUT_DIR=${CHECKOUT_DIR}" >> "${GITHUB_ENV}"
          git init "${CHECKOUT_DIR}"
          cd "${CHECKOUT_DIR}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            -c http.https://github.com.proxy= \
            -c http.proxy= \
            -c https.proxy= \
            fetch --no-tags --depth=1 origin "${CHECKOUT_REF}"
          git checkout --force FETCH_HEAD

      - name: Setup DCU container
        run: |
          GITHUB_WORKSPACE="${DCU_CI_CHECKOUT_DIR}" \
            bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_start_container.sh" \
              --image "${DCU_CI_IMAGE}" \
              --container-name "${DCU_CI_CONTAINER_NAME}"

      - name: Install dependencies
        run: bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_install_dependency.sh"

      - name: Run full enabled DCU suite
        run: |
          nightly_flag=""
          if [[ "${{ matrix.nightly }}" == "true" ]]; then
            nightly_flag="--nightly"
          fi

          echo "Running ${{ matrix.suite }} partition ${{ matrix.part }}/${{ matrix.parts }} nightly=${{ matrix.nightly }}"
          bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_exec.sh" -w /sglang-checkout/test --container-name "${DCU_CI_CONTAINER_NAME}" -- \
            python3 run_suite.py \
              --hw dcu \
              --suite "${{ matrix.suite }}" \
              ${nightly_flag} \
              --auto-partition-id "${{ matrix.part }}" \
              --auto-partition-size "${{ matrix.parts }}" \
              --timeout-per-file "${{ matrix.timeout_per_file }}" \
              ${{ needs.validate-config.outputs.continue_on_error_flag }}

      - name: Cleanup DCU container
        if: always()
        run: bash "${DCU_CI_CHECKOUT_DIR}/scripts/ci/dcu/dcu_ci_cleanup_container.sh"

  dcu-full-enabled-finish:
    name: DCU Full Enabled finish
    needs:
      - check-full-trigger
      - validate-config
      - wait-dcu-wheels
      - full-enabled-dcu
    if: always()
    runs-on: ${{ inputs.runner_label || vars.DCU_CI_RUNNER_LABEL }}
    steps:
      - name: Check all dependent job statuses
        run: |
          json_needs='${{ toJson(needs) }}'
          job_names=$(echo "${json_needs}" | jq -r 'keys_unsorted[]')

          for job in ${job_names}; do
            result=$(echo "${json_needs}" | jq -r --arg j "${job}" '.[$j].result')
            echo "${job}: ${result}"

            if [[ "${job}" == "check-full-trigger" && "${result}" == "success" ]]; then
              continue
            fi

            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done

          echo "All DCU full enabled jobs completed successfully or were skipped."
