name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - v0.5.12_dev

permissions:
  contents: read

concurrency:
  group: hygon-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Checks
    uses: HYGON-AI/open-source-governance/.github/workflows/pr-quality-gate.yml@b318c05e0f2e6fb1e54bccb9646bb62c0b69b34b
    permissions:
      contents: read
