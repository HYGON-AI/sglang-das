name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - v0.5.12_dev

permissions:
  contents: read

concurrency:
  group: hygon-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Checks
    uses: HYGON-AI/open-source-governance/.github/workflows/pr-quality-gate.yml@341e7ce85fd2e6744a9797b33e27873f4b6baa99  
    permissions:
      contents: read
