name: Release PR DCU Wheels

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    paths:
      - 'python/**'
      - 'sgl-kernel/**'
      - 'sgl-model-gateway/**'
      - 'requirements_dcu.txt'
      - '.github/workflows/release-pr-dcu.yml'

  # ---- 手动触发，可传参 ----
  workflow_dispatch:
    inputs:
      torch_version:
        description: 'PyTorch version to install'
        required: false
        default: '2.10.0'
        type: string
      skip_gateway:
        description: 'Skip sgl-model-gateway build'
        required: false
        default: false
        type: boolean

jobs:
  compile:
    # ---- 并发控制: 同一分支 + 同一 Python 版本的 job 只保留最新一个 ----
    concurrency:
      group: release-pr-dcu-${{ github.ref }}-py${{ matrix.python-version }}
      cancel-in-progress: true
    # ---- 自托管 DCU runner，在 Docker 容器内执行 ----
    runs-on: [self-hosted, dcu, nmz4]
    timeout-minutes: 180

    container:
      image: harbor.sourcefind.cn:5443/dcu/admin/base/dev:rockylinux8.6-mpi5.0-gcc10.3-cmake3.29-py3.10-mkl2020.4.304
      options: >
        --device=/dev/kfd --device=/dev/dri/ --group-add video
        -v /opt/hyhal/:/opt/hyhal/:ro
        -v ${{ vars.DCU_CI_WHEEL_STAGING_HOST || '/home/github/sgl_whl_temp' }}:${{ vars.DCU_CI_WHEEL_STAGING_HOST || '/home/github/sgl_whl_temp' }}
        --shm-size=80G
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged=true

    # ---- Matrix: 3 个 Python 版本并行编译 ----
    strategy:
      matrix:
        python-version: ['3.10']

    env:
      TORCH_VERSION: ${{ inputs.torch_version || '2.10.0' }}
      SKIP_GATEWAY: ${{ inputs.skip_gateway || false }}
      PIP_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
      PIP_TRUSTED_HOST: 10.16.1.201
      RESOURCE_SERVER: http://10.16.1.201:8000/
      DCU_RUNNER_HOST_UID: ${{ vars.DCU_RUNNER_HOST_UID || '1000' }}
      DCU_RUNNER_HOST_GID: ${{ vars.DCU_RUNNER_HOST_GID || '1000' }}
      WHEEL_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DCU_CI_WHEEL_STAGING_HOST: ${{ vars.DCU_CI_WHEEL_STAGING_HOST || '/home/github/sgl_whl_temp' }}

    steps:
      # =======================================================================
      # 环境准备
      # =======================================================================

      - name: Normalize workspace ownership before checkout
        run: |
          chown -R "${DCU_RUNNER_HOST_UID}:${DCU_RUNNER_HOST_GID}" "${GITHUB_WORKSPACE}" || true

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WHEEL_COMMIT_SHA }}
          submodules: 'recursive'

      # 容器内已预装 Python 3.10 + DTK/ROCm + gcc + cmake
      - name: Install build deps
        run: |
          pip install torch==${TORCH_VERSION} build scikit-build-core cmake ninja wheel setuptools setuptools-scm setuptools-rust maturin ciupload
          wget ${RESOURCE_SERVER}/Jenkins/CompileDep/sglang/protoc-24.4-linux-x86_64.zip
          unzip protoc-24.4-linux-x86_64.zip -d /usr/local/
          chmod +x /usr/local/bin/protoc
          ln -s /usr/local/bin/protoc /usr/bin/protoc
          wget ${RESOURCE_SERVER}/Jenkins/CompileDep/sglang/rustup-init.sh
          export RUSTUP_DIST_SERVER=https://mirrors.tuna.tsinghua.edu.cn/rustup
          export RUSTUP_UPDATE_ROOT=https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup
          bash rustup-init.sh -y
          rm -rf ${HOME}/.cargo/config
          mkdir -p ${HOME}/.cargo
          cat > ${HOME}/.cargo/config << 'EOF'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'

          [source.tuna-sparse]
          registry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"

          [net]
          retry = 5
          git-fetch-with-cli = true

          [http]
          low-speed-limit = 1
          EOF

      - name: Install DTK
        run: |
          DTK_PKG_URL=${RESOURCE_SERVER}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
          cd /opt
          wget -q $DTK_PKG_URL
          tar -xzf $(basename $DTK_PKG_URL)
          mv dtk-* dtk

      # =======================================================================
      # 路径检测: 决定哪些组件需要编译
      # =======================================================================

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            sgl-kernel:
              - 'sgl-kernel/**'
            sglang:
              - 'python/**'
            gateway:
              - 'sgl-model-gateway/**'

      # =======================================================================
      # 编译阶段: 按检测结果增量编译
      # workflow_dispatch 时忽略检测结果，全量编译
      # =======================================================================

      - name: Build sgl-kernel (HIP)
        run: |
          source /opt/dtk/env.sh
          cd sgl-kernel && python setup_hip.py bdist_wheel
          echo "=== sgl-kernel wheel ==="
          ls -lh dist/*.whl

      - name: Build sglang python package
        # if: steps.changes.outputs.sglang == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.5.12"
        run: |
          source /opt/dtk/env.sh
          source $HOME/.cargo/env
          cd python
          export SETUPTOOLS_SCM_PRETEND_VERSION="${SETUPTOOLS_SCM_PRETEND_VERSION}"
          python -m build --wheel --no-isolation -Cfeatures=all_hip
          echo "=== sglang wheel ==="
          ls -lh dist/*.whl

      - name: Build sgl-model-gateway
        if: ${{ env.SKIP_GATEWAY != 'true' && (steps.changes.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch') }}
        run: |
          source /opt/dtk/env.sh
          source $HOME/.cargo/env
          export RUSTUP_DIST_SERVER=https://mirrors.ustc.edu.cn/rust-static
          export RUSTUP_UPDATE_ROOT=https://mirrors.ustc.edu.cn/rust-static/rustup
          cd sgl-model-gateway && cargo build --release
          cd bindings/python && maturin build --release --skip-auditwheel
          echo "=== sgl-model-gateway wheel ==="
          ls -lh target/wheels/*.whl

      # =======================================================================
      # 修复 (auditwheel) & 本地暂存产物
      # =======================================================================

      - name: Apply DAS local version and stage wheels
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_id }}
        run: |
          set -eo pipefail
          source /opt/dtk/env.sh
          DTK_PKG_URL=${RESOURCE_SERVER}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
          DTK_VER=$(echo $DTK_PKG_URL | grep -oP 'dtk\K[0-9]+\.[0-9]+' | tr -d '.')
          TORCH_VER=$(echo $TORCH_VERSION | tr -d '.')
          SHORT_SHA="$(printf '%s' "${WHEEL_COMMIT_SHA}" | cut -c1-12)"
          LOCAL_VER="das.dtk${DTK_VER}.torch${TORCH_VER}.$(date +%y%m%d%H%M).g${SHORT_SHA}"
          echo "Local version: ${LOCAL_VER}"
          mkdir -p output
          for whl in sgl-kernel/dist/*.whl python/dist/*.whl sgl-model-gateway/bindings/python/target/wheels/*.whl; do
            [ -f "$whl" ] || continue
            CIUpload --repair --torch_version $TORCH_VERSION --set_local_version $LOCAL_VER --outputdir output -f "$whl"
          done
          echo "=== Repaired wheels ==="
          ls -lh output/

          if ! compgen -G "output/*.whl" >/dev/null; then
            echo "::error::No repaired DCU wheels were produced."
            exit 1
          fi

          REPO_KEY="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '/:' '__')"
          STAGING_BASE="${DCU_CI_WHEEL_STAGING_HOST}/${REPO_KEY}/pr-${PR_NUMBER}"
          STAGING_DIR="${STAGING_BASE}/${WHEEL_COMMIT_SHA}"
          TMP_DIR="${STAGING_DIR}.tmp.${GITHUB_RUN_ID}"

          rm -rf "${TMP_DIR}"
          mkdir -p "${TMP_DIR}/wheels"
          cp -f output/*.whl "${TMP_DIR}/wheels/"

          export STAGING_TMP_DIR="${TMP_DIR}"
          export MANIFEST_REPO="${GITHUB_REPOSITORY}"
          export MANIFEST_PR_NUMBER="${PR_NUMBER}"
          export MANIFEST_HEAD_SHA="${WHEEL_COMMIT_SHA}"
          export MANIFEST_SHORT_SHA="${SHORT_SHA}"
          export MANIFEST_RUN_ID="${GITHUB_RUN_ID}"
          export MANIFEST_REF_NAME="${GITHUB_REF_NAME:-}"
          export MANIFEST_GATEWAY_REQUIRED="${{ steps.changes.outputs.gateway }}"
          python3 - <<'PY_MANIFEST'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          staging = Path(os.environ["STAGING_TMP_DIR"])
          wheels = sorted(str(p.relative_to(staging)) for p in (staging / "wheels").glob("*.whl"))
          manifest = {
              "repo": os.environ["MANIFEST_REPO"],
              "pr_number": os.environ["MANIFEST_PR_NUMBER"],
              "head_sha": os.environ["MANIFEST_HEAD_SHA"],
              "short_sha": os.environ["MANIFEST_SHORT_SHA"],
              "build_run_id": os.environ["MANIFEST_RUN_ID"],
              "source_ref": os.environ.get("MANIFEST_REF_NAME", ""),
              "created_at": datetime.now(timezone.utc).isoformat(),
              "gateway_required": os.environ.get("MANIFEST_GATEWAY_REQUIRED", "false") == "true",
              "wheels": wheels,
          }
          (staging / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY_MANIFEST

          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_BASE}"
          mv "${TMP_DIR}" "${STAGING_DIR}"
          touch "${STAGING_DIR}/READY"
          echo "DCU PR wheels staged locally at ${STAGING_DIR}"
          find "${STAGING_DIR}" -maxdepth 2 -type f -print | sort

      - name: Skip GitHub artifact upload
        run: |
          echo "DCU PR wheels are staged locally under ${DCU_CI_WHEEL_STAGING_HOST}."
          echo "They will be uploaded to internal devpi only after PR Test (DCU) succeeds."

      - name: Normalize workspace ownership
        if: always()
        run: |
          chown -R "${DCU_RUNNER_HOST_UID}:${DCU_RUNNER_HOST_GID}" "${GITHUB_WORKSPACE}" || true
