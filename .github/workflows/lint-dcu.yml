name: Lint (DCU)

on:
  push:
    branches: [main, v0.5.12_dev]
  pull_request:

jobs:
  lint:
    runs-on: [self-hosted, dcu, nmz4]
    timeout-minutes: 30

    container:
      image: harbor.sourcefind.cn:5443/dcu/admin/base/dev:rockylinux8.6-mpi5.0-gcc10.3-cmake3.29-py3.10-mkl2020.4.304

    env:
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      PIP_TRUSTED_HOST: mirrors.aliyun.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pre-commit hook
        run: |
          python -m pip install pre-commit
          pre-commit install

      - name: Run pre-commit checks (PR diff only)
        if: github.event_name == 'pull_request'
        run: |
          SKIP=no-commit-to-branch pre-commit run \
            --from-ref origin/${{ github.base_ref }} \
            --to-ref HEAD \
            --show-diff-on-failure

      - name: Run pre-commit checks (all files on push)
        if: github.event_name == 'push'
        run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure
