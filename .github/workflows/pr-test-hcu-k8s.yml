  pr-test-hcu-k8s-finish:
    name: PR Test (HCU, K8s) finish
    needs:
      - check-changes
      - call-gate
      - validate-config
      - build-wheels
      - stage-a-test-1-hcu-small
      - stage-b-test-1-hcu-small
    if: always()
    runs-on: hygon-cpu
    timeout-minutes: 10
    steps:
      - name: Check all dependent job statuses
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "${NEEDS_JSON}"
          if [[ "${ANY_FAILED}" == "true" ]]; then
            echo "The above jobs failed."
            exit 1
          fi
