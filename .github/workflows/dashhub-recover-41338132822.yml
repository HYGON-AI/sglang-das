name: One-time DashHub recovery 41338132822

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashhub-recover-41338132822
  cancel-in-progress: false

jobs:
  upload:
    runs-on: [ci, bw1100]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dashhub-payload-41338132822
          sparse-checkout: .github/recovery
          persist-credentials: false
      - name: Submit combined model and operator result
        env:
          DASHHUB_CI_TOKEN: ${{ secrets.DASHHUB_CI_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          path = Path('.github/recovery/dashhub-combined-41338132822.json')
          raw = path.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '4dc020aa067f49456d680184c501964e7f0f96527de09b868bb34534e9392c45'
          data = json.loads(raw)
          assert data['image_name'].endswith('sglang:0.5.18-ubuntu22.04-dtk26041-py3.10-20261102-0242')
          assert (data['case_count'], data['case_pass'], data['case_fail'], data['case_skip']) == (90, 58, 5, 27)
          assert len(data['image_info']['model_test_result']) == 90
          assert len(data['image_info']['operator_test_result']['operators']) == 7
          assert (data['model_test_status'], data['operator_test_status']) == ('ci_fail', 'ci_pass')
          token = os.environ.get('DASHHUB_CI_TOKEN')
          if not token:
              raise SystemExit('DASHHUB_CI_TOKEN is unavailable to this workflow')
          request = Request(
              'http://10.16.1.201:10092/api/v1/integrations/ci/package-releases',
              data=raw,
              headers={'Content-Type': 'application/json', 'X-DashHub-CI-Token': token},
              method='POST',
          )
          with urlopen(request, timeout=30) as response:
              print('DashHub HTTP', response.status)
              if response.status not in (200, 201):
                  raise SystemExit('DashHub did not accept the recovery request')
          PY
